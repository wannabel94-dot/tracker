<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="theme-color" content="#07081d" id="navColor">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>To-do</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --morning-text: #f0f4ff;
  --night-text: #f0f4ff;
  --card-radius: 14px;
  --glass-border: rgba(255,255,255,0.12);
  font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial;
}
*{box-sizing:border-box}
html, body {
  height: 100%;
  margin: 0;
  padding: 0;
  overflow: hidden;
}

.wrap {
  position: fixed;
  top: 60px;
  bottom: 60px;
  left: 0;
  right: 0;
  overflow-y: auto;
  padding: 18px;
  -webkit-overflow-scrolling: touch;
}

body{ color:#fff; }
body::before{ content:""; position:fixed; inset:0; z-index:-1; background:#07081d; }

#topHeader{
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  display:flex;
  align-items:center;
  background: #07081d;
  justify-content:space-between;
  padding:10px 18px;
  z-index:100;
}
#dayOfWeek{ flex:1; text-align:center; font-size:1rem; font-weight:600; color:#f0f4ff; margin:0; pointer-events:none; }
#btnSettings {
  background: transparent;
  border: none;
  font-size: 24px;
  color: #fff;
  cursor: pointer;
  padding: 8px;
  z-index: 101;
  position: relative;
  min-width: 40px;
  min-height: 40px;
}
  
#btnSettings:hover { color: #ddd; }
#dataBtn {
  background: transparent;
  border: none;
  color: #fff;
  cursor: pointer;
  padding: 8px;
  z-index: 101;
  position: relative;
  min-width: 40px;
  min-height: 40px;
}

#dataBtn img {
  width: 22px;
  height: 22px;
  object-fit: contain;
  filter:invert(1);
}

/* Note entries */
.note-entry {
  background: rgba(255,255,255,0.05);
  border-radius: var(--card-radius);
  padding: 16px;
  margin-bottom: 12px;
  cursor: pointer;
  transition: background 0.2s;
}
.note-entry:hover {
  background: rgba(255,255,255,0.08);
}
.note-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
}
.note-title {
  font-size: 1.1rem;
  font-weight: 600;
  margin: 0 0 8px 0;
  color: #f0f4ff;
}
.note-timestamp {
  font-size: 0.85rem;
  color: rgba(255,255,255,0.5);
  white-space: nowrap;
}
.note-preview {
  color: rgba(255,255,255,0.7);
  font-size: 0.95rem;
  line-height: 1.4;
  margin: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}
.note-actions {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}
.delete-btn {
  background: rgba(255,50,50,0.25);
  color: #fff;
  border: 0;
  border-radius: 8px;
  padding: 6px 12px;
  cursor: pointer;
  font-size: 0.85rem;
  transition: background 0.2s;
}
.delete-btn:hover {
  background: rgba(255,50,50,0.4);
}

/* Note editor modal */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 500;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
}
.modal-overlay.show {
  opacity: 1;
  pointer-events: all;
}
.modal-box {
  background: #1e1e35;
  border-radius: 16px;
  width: 90%;
  max-width: 600px;
  max-height: 80vh;
  display: flex;
  flex-direction: column;
  transform: translateY(50px);
  transition: transform 0.3s;
}
.modal-overlay.show .modal-box {
  transform: translateY(0);
}
.modal-header {
  padding: 20px;
  border-bottom: 1px solid rgba(255,255,255,0.1);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.modal-header h3 {
  margin: 0;
  font-size: 1.2rem;
}
.close-btn {
  background: transparent;
  border: none;
  color: #fff;
  font-size: 24px;
  cursor: pointer;
  padding: 0;
  width: 32px;
  height: 32px;
}
.modal-body {
  padding: 20px;
  overflow-y: auto;
  flex: 1;
}
.modal-body input,
.modal-body textarea {
  width: 100%;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 12px;
  padding: 12px;
  color: #f0f4ff;
  font-family: inherit;
  font-size: 1rem;
  margin-bottom: 16px;
}
.modal-body input {
  font-weight: 600;
}
.modal-body textarea {
  min-height: 200px;
  resize: vertical;
}
.modal-body input:focus,
.modal-body textarea:focus {
  outline: none;
  border-color: rgba(255,255,255,0.3);
}
.modal-footer {
  padding: 20px;
  border-top: 1px solid rgba(255,255,255,0.1);
  display: flex;
  gap: 12px;
  justify-content: flex-end;
}
.modal-btn {
  padding: 10px 20px;
  border-radius: 12px;
  border: none;
  font-weight: 600;
  cursor: pointer;
  transition: opacity 0.2s;
}
.modal-btn:hover {
  opacity: 0.8;
}
.modal-btn.cancel {
  background: rgba(255,255,255,0.1);
  color: #f0f4ff;
}
.modal-btn.save {
  background: rgba(255,255,255,0.2);
  color: #f0f4ff;
}

.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: rgba(255,255,255,0.4);
}
.empty-state-icon {
  font-size: 48px;
  margin-bottom: 16px;
}

/* Footer */
.footer-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 60px;
  background: #303f5c;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 25px;
}

.left-group, .right-group {
  display: flex;
  justify-content: space-between;
  width: 120px;
  margin: 0;
  gap: 0;
}

.footer-nav::before {
  content: '';
  position: absolute;
  top: -25px;
  left: 50%;
  transform: translateX(-50%);
  width: 60px;
  height: 60px;
  background: #07081d;
  border-radius: 50%;
  z-index: 110;
}

.floating-center-btn {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  width: 50px;
  height: 50px;
  border-radius: 50%;
  background: #8694af;
  border: none;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 36px;
  font-weight: 700;
  color: #000;
  cursor: pointer;
  z-index: 130;
  transition: transform 0.2s;
}
.floating-center-btn:hover {
  transform: translateX(-50%) scale(1.1);
}

.footer-nav .switch-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  padding: 6px 8px;
  background: transparent;
  border: none;
  cursor: pointer;
  border-radius: 12px;
}
.footer-nav .switch-btn img {
  width: 22px;
  height: 22px;
  opacity: 0.9;
  filter: invert(1);
}
.footer-nav .switch-btn span {
  color: #fff;
  font-weight: 600;
}
.footer-nav .switch-btn.active span {
  color: #8d4585;
  font-weight: 700;
}

.settings-menu {
  position: fixed;
  top: 0;
  left: 0;
  height: 100vh;
  width: 50%;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(18px) saturate(180%);
  display: flex;
  flex-direction: column;
  padding: 20px 0;
  transform: translateX(-100%);
  transition: transform 0.4s ease;
  z-index: 200;
}
.settings-menu.show {
  transform: translateX(0);
}
.settings-menu button {
  background: transparent;
  border: 0;
  padding: 16px 20px;
  width: 100%;
  text-align: left;
  font-weight: 600;
  color: #fff;
  cursor: pointer;
  transition: background 0.25s, transform 0.2s;
}
.settings-menu button:hover {
  background: rgba(255,255,255,0.15);
  transform: translateX(6px);
}
.menu-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
  z-index: 150;
}
.menu-overlay.show {
  opacity: 1;
  pointer-events: all;
}

</style>
</head>
<body class="morning">
  <header id="topHeader">
    <button class="switch-btn data" id="dataBtn"><img src="icons/chart.svg" alt="Data"></button>
    <div id="dayOfWeek">Notes</div>
    <button id="btnSettings">☰</button>
  </header>

  <div id="menuOverlay" class="menu-overlay"></div>
  <div id="settingsMenu" class="settings-menu">
    <button id="btnExport">Export data</button>
    <button id="btnClearAll">Clear all notes</button>
  </div>

  <div class="wrap" id="notesContainer">
    <!-- Notes will be rendered here -->
  </div>

  <!-- Note editor modal -->
  <div class="modal-overlay" id="noteModal">
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="modalTitle">New Note</h3>
        <button class="close-btn" id="closeModal">&times;</button>
      </div>
      <div class="modal-body">
        <input type="text" id="noteTitle" placeholder="Title" />
        <textarea id="noteContent" placeholder="Write your note here..."></textarea>
      </div>
      <div class="modal-footer">
        <button class="modal-btn cancel" id="cancelBtn">Cancel</button>
        <button class="modal-btn save" id="saveBtn">Save</button>
      </div>
    </div>
  </div>

  <!-- Sticky footer nav -->
<footer class="footer-nav">
  <div class="left-group">
    <button class="switch-btn home" id="homeBtn"><img src="icons/home.svg" alt="Home"><span>Home</span></button>
   <button class="switch-btn rx" id="rxBtn"><img src="icons/rx1.svg" alt="rx"><span>Rx</span></button>
  </div>
  <div class="right-group">
    <button class="switch-btn todo" id="todoBtn"><img src="icons/todo.svg" alt="todo"><span>To-do</span></button>
   <button class="switch-btn mood" id="moodBtn"><img src="icons/mood.svg" alt="mood"><span>Mood</span></button>
  </div>
</footer>
  <button class="floating-center-btn" id="centralBtn">+</button>

<script>
let notes = JSON.parse(localStorage.getItem('dailyNotes') || '[]');
let editingNoteId = null;

document.getElementById('homeBtn').onclick = () => { window.location.href = 'index.html'; };
  document.getElementById('dataBtn').onclick = () => { window.location.href = 'data.html'; };
  document.getElementById('moodBtn').onclick = () => { window.location.href = 'mood.html'; };
  document.getElementById('rxBtn').onclick = () => { window.location.href = 'rx.html'; };


/* Settings menu */
const btnSettings = document.getElementById('btnSettings');
const settingsMenu = document.getElementById('settingsMenu');
const menuOverlay = document.getElementById('menuOverlay');

btnSettings.onclick = () => {
  const isOpen = settingsMenu.classList.toggle('show');
  menuOverlay.classList.toggle('show', isOpen);
};
menuOverlay.onclick = () => {
  settingsMenu.classList.remove('show');
  menuOverlay.classList.remove('show');
};

document.getElementById('btnExport').onclick = () => {
  if (notes.length === 0) {
    alert("No notes to export.");
    return;
  }
  const blob = new Blob([JSON.stringify(notes, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = "notes-export.json";
  a.click();
  URL.revokeObjectURL(url);
};

document.getElementById('btnClearAll').onclick = () => {
  if (confirm('Are you sure you want to delete all notes? This cannot be undone.')) {
    notes = [];
    localStorage.setItem('dailyNotes', JSON.stringify(notes));
    renderNotes();
    alert('All notes cleared.');
  }
};

/* Note modal */
const noteModal = document.getElementById('noteModal');
const modalTitle = document.getElementById('modalTitle');
const noteTitleInput = document.getElementById('noteTitle');
const noteContentInput = document.getElementById('noteContent');
const closeModal = document.getElementById('closeModal');
const cancelBtn = document.getElementById('cancelBtn');
const saveBtn = document.getElementById('saveBtn');
const centralBtn = document.getElementById('centralBtn');

function openNoteModal(noteId = null) {
  editingNoteId = noteId;
  
  if (noteId) {
    const note = notes.find(n => n.id === noteId);
    if (note) {
      modalTitle.textContent = 'Edit Note';
      noteTitleInput.value = note.title;
      noteContentInput.value = note.content;
    }
  } else {
    modalTitle.textContent = 'New Note';
    noteTitleInput.value = '';
    noteContentInput.value = '';
  }
  
  noteModal.classList.add('show');
  noteTitleInput.focus();
}

function closeNoteModal() {
  noteModal.classList.remove('show');
  editingNoteId = null;
}

centralBtn.onclick = () => openNoteModal();
closeModal.onclick = closeNoteModal;
cancelBtn.onclick = closeNoteModal;

noteModal.onclick = (e) => {
  if (e.target === noteModal) closeNoteModal();
};

saveBtn.onclick = () => {
  const title = noteTitleInput.value.trim();
  const content = noteContentInput.value.trim();
  
  if (!title && !content) {
    alert('Please add a title or content.');
    return;
  }
  
  if (editingNoteId) {
    // Edit existing note
    const note = notes.find(n => n.id === editingNoteId);
    if (note) {
      note.title = title || 'Untitled';
      note.content = content;
      note.updated = new Date().toISOString();
    }
  } else {
    // Create new note
    const newNote = {
      id: Date.now().toString(),
      title: title || 'Untitled',
      content: content,
      created: new Date().toISOString(),
      updated: new Date().toISOString()
    };
    notes.unshift(newNote);
  }
  
  localStorage.setItem('dailyNotes', JSON.stringify(notes));
  renderNotes();
  closeNoteModal();
};

function deleteNote(noteId) {
  if (confirm('Are you sure you want to delete this note?')) {
    notes = notes.filter(n => n.id !== noteId);
    localStorage.setItem('dailyNotes', JSON.stringify(notes));
    renderNotes();
  }
}

function formatDate(isoString) {
  const date = new Date(isoString);
  const now = new Date();
  const diff = now - date;
  const minutes = Math.floor(diff / 60000);
  const hours = Math.floor(diff / 3600000);
  const days = Math.floor(diff / 86400000);
  
  if (minutes < 1) return 'Just now';
  if (minutes < 60) return `${minutes}m ago`;
  if (hours < 24) return `${hours}h ago`;
  if (days < 7) return `${days}d ago`;
  
  return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

function renderNotes() {
  const container = document.getElementById('notesContainer');
  
  if (notes.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-state-icon">📝</div>
        <p>No notes yet</p>
        <p style="font-size:0.9rem;">Tap the + button to create your first note</p>
      </div>
    `;
    return;
  }
  
  container.innerHTML = notes.map(note => `
    <div class="note-entry" onclick="openNoteModal('${note.id}')">
      <div class="note-header">
        <h3 class="note-title">${note.title}</h3>
        <span class="note-timestamp">${formatDate(note.updated)}</span>
      </div>
      ${note.content ? `<p class="note-preview">${note.content}</p>` : ''}
      <div class="note-actions" onclick="event.stopPropagation()">
        <button class="delete-btn" onclick="deleteNote('${note.id}')">Delete</button>
      </div>
    </div>
  `).join('');
}

// Initialize
renderNotes();
</script>
</body>
</html>
