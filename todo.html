<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>To-do</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --card-radius: 14px;
  --bg: #07081d;
  --muted: rgba(255,255,255,0.4);
  font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial;
}
*{box-sizing:border-box;}
html, body{margin:0; padding:0; height:100%; background:var(--bg); color:#fff; overflow:hidden;}
.wrap { position: fixed; top: 60px; bottom: 60px; left: 0; right: 0; overflow-y: auto; padding: 18px; -webkit-overflow-scrolling: touch; }
#topHeader { position: fixed; top: 0; left: 0; width: 100%; display: flex; align-items: center; justify-content: space-between; background: var(--bg); padding: 10px 18px; z-index: 100; }
#dayOfWeek { flex: 1; text-align: center; font-weight: 600; font-size: 1rem; }
#btnSettings, #dataBtn { background: none; border: none; color: #fff; font-size: 24px; cursor: pointer; }
#dataBtn img { width: 22px; height: 22px; object-fit: contain; filter:invert(1); }
.footer-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 60px; background: #303f5c; display: flex; justify-content: space-between; align-items: center; padding: 0 25px; }
.left-group, .right-group { display: flex; justify-content: space-between; width: 120px; }
.footer-nav .switch-btn { display:flex; flex-direction:column; align-items:center; gap:4px; padding:6px 0; width: 50px; background:transparent; border:none; cursor:pointer; border-radius:12px; }
.footer-nav .switch-btn img { width:22px; height:22px; opacity:0.9; filter:invert(1); }
.footer-nav .switch-btn span { color:#fff; font-weight:600; }
.footer-nav .switch-btn.active span { color:#8d4585; font-weight:700; }

/* Masonry-style layout */
#notesContainer { column-count: 2; column-gap: 16px; }
.category-card { background: rgba(255,255,255,0.05); border-radius: var(--card-radius); margin-bottom: 16px; padding: 16px; display: inline-block; width: 100%; transition: background 0.2s; position: relative; }
.category-card:hover{ background: rgba(255,255,255,0.08); }
.category-title{ font-weight:600; margin-bottom:10px; font-size:1.1rem; cursor:pointer; }
.task-list{ list-style:none; margin:0; padding:0; }
.task-list li{ position: relative; display: flex; align-items: center; gap: 12px; padding: 6px 4px; border-radius:10px; cursor: pointer; transition: background 0.12s; }
.task-list li:hover { background: rgba(255,255,255,0.02); }
.task-list li span{ flex:1; }

/* Hide the old inputs if present */
.task-list input[type="checkbox"]{ position:absolute; opacity:0; width:0; height:0; pointer-events:none; }

/* ---------- iOS-style circular toggle ---------- */
.task-circle {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.9);
  background: transparent;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 2px 6px rgba(0,0,0,0.45);
  transition: all 0.22s cubic-bezier(.2,.9,.2,1);
  flex-shrink: 0;
  position: relative;
}
.task-circle .inner-check {
  transform: scale(0);
  opacity: 0;
  transition: all 0.18s ease;
  color: white;
  font-weight: 700;
  font-size: 12px;
  line-height: 1;
  user-select: none;
}
.task-circle.checked {
  background: linear-gradient(135deg,#8d4585 0%, #7a3a74 100%);
  border-color: rgba(255,255,255,0.0);
  transform: scale(0.98);
}
.task-circle.checked .inner-check{
  transform: scale(1);
  opacity: 1;
}

/* subtle focus style for keyboard users */
.task-circle:focus {
  outline: none;
  box-shadow: 0 0 0 4px rgba(141,69,133,0.12);
}
.category-title {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 600;
  font-size: 1.1rem;
}

.cat-icon {
  width: 18px;
  height: 18px;
  opacity: 0.9;
  filter: invert(1);
}

/* Delete checked button (sticky above footer) */
#deleteCheckedBtn {
  position: fixed;
  bottom: 72px;
  left: 50%;
  transform: translateX(-70%);
  background: #d9534f;
  padding: 12px 18px;
  border-radius: 14px;
  font-weight: 700;
  display: none;
  z-index: 220;
  border: none;
  color: white;
  cursor: pointer;
  box-shadow: 0 8px 20px rgba(0,0,0,0.4);
}

/* category delete button (mobile) */
.category-card .delete-category-btn {
  display: none;
  position: absolute;
  top: 8px;
  right: 8px;
  background: rgba(255,50,50,0.7);
  color: #fff;
  border: none;
  border-radius: 8px;
  padding: 4px 8px;
  cursor: pointer;
  font-size: 0.8rem;
  z-index: 10;
}
.category-card.show-delete .delete-category-btn { display:block; }

/* Modal */
.modal-overlay{ position:fixed; inset:0; background: rgba(0,0,0,0.7); display:flex; justify-content:center; align-items:center; opacity:0; pointer-events:none; transition:0.3s;}
.modal-overlay.show{ opacity:1; pointer-events:all;}
.modal-box{ background:#1e1e35; border-radius:16px; width:90%; max-width:600px; max-height:80vh; display:flex; flex-direction:column; transform:translateY(50px); transition:0.3s;}
.modal-overlay.show .modal-box{ transform:translateY(0);}
.modal-header{ padding:20px; border-bottom:1px solid rgba(255,255,255,0.1); display:flex; justify-content:space-between; align-items:center;}
.close-btn{ background:none; border:none; color:#fff; font-size:24px; cursor:pointer; }
.modal-body{ padding:20px; overflow-y:auto; flex:1; }
.modal-body input, .modal-body select{ width:100%; padding:12px; border-radius:12px; border:1px solid rgba(255,255,255,0.12); margin-bottom:16px; background:rgba(255,255,255,0.05); color:#fff; font-size:1rem; }
.modal-footer{ padding:20px; display:flex; gap:12px; justify-content:flex-end; }
.modal-btn{ padding:10px 20px; border:none; border-radius:12px; font-weight:600; cursor:pointer; }
.modal-btn.cancel{ background: rgba(255,255,255,0.1); color:#fff; }
.modal-btn.save{ background: rgba(255,255,255,0.2); color:#fff; }

.floating-center-btn{ position:fixed; bottom:30px; left:50%; transform:translateX(-50%); width:50px; height:50px; border-radius:50%; background:#8694af; border:none; font-size:36px; font-weight:700; color:#000; cursor:pointer; display:flex; justify-content:center; align-items:center; z-index:130; }
.floating-center-btn:hover{ transform:translateX(-50%) scale(1.1);}

</style>
</head>
<body>
<header id="topHeader">
  <button class="switch-btn data" id="dataBtn"><img src="icons/chart.svg" alt="Data"></button>
  <div id="dayOfWeek">Notes</div>
  <button id="btnSettings">☰</button>
</header>

<div class="wrap" id="notesContainer"></div>

<!-- Delete checked button -->
<button id="deleteCheckedBtn">Delete Checked</button>

<!-- Modal -->
<div id="noteModal" class="modal-overlay">
  <div class="modal-box">
   <div class="modal-header">
  <span id="modalTitle" style="font-size:1.2rem; font-weight:700;">New Task</span>
  <button id="closeModal" class="close-btn">&times;</button>
</div>
    <div class="modal-body">
      <input type="text" id="taskTitle" placeholder="Task" />
      <select id="taskCategory"></select>
    </div>
    <div class="modal-footer">
      <button id="cancelBtn" class="modal-btn cancel">Cancel</button>
      <button id="saveBtn" class="modal-btn save">Save</button>
    </div>
  </div>
</div>

<footer class="footer-nav">
  <div class="left-group">
    <button class="switch-btn home" id="homeBtn"><img src="icons/home.svg" alt="Home"><span>Home</span></button>
    <button class="switch-btn rx" id="rxBtn"><img src="icons/rx1.svg" alt="Rx"><span>Rx</span></button>
  </div>
  <div class="right-group">
    <button class="switch-btn todo" id="todoBtn"><img src="icons/todo.svg" alt="To-do"><span>To-do</span></button>
    <button class="switch-btn mood" id="moodBtn"><img src="icons/mood.svg" alt="Mood"><span>Mood</span></button>
  </div>
</footer>

<button class="floating-center-btn" id="centralBtn">+</button>

<script>
document.addEventListener('DOMContentLoaded', () => {
  // Navigation buttons
  document.getElementById('homeBtn').onclick = () => window.location.href = "index.html";
  document.getElementById('dataBtn').onclick = () => window.location.href = "data.html";
  document.getElementById('moodBtn').onclick = () => window.location.href = "mood.html";
  document.getElementById('rxBtn').onclick = () => window.location.href = "rx.html";

  let tasks = JSON.parse(localStorage.getItem('todoTasks') || '[]');
  let categories = JSON.parse(localStorage.getItem('todoCategories') || '[]');
  let editingTaskId = null;
  
const permanentCategoryIcons = {
  "Buy": "icons/buy.svg",
  "Home": "icons/home.svg",
  "Admin": "icons/admin.svg",
  "Social": "icons/social.svg",
  "Finances": "icons/finances.svg",
  "Personal": "icons/personal.svg",
  "Health": "icons/health.svg"
};

  // For undo (stores array of deleted tasks)
  let lastDeleted = [];
  let undoTimer = null;

  const modal = document.getElementById('noteModal');
  const taskTitleInput = document.getElementById('taskTitle');
  const taskCategoryInput = document.getElementById('taskCategory');
  const notesContainer = document.getElementById('notesContainer');
  const deleteCheckedBtn = document.getElementById('deleteCheckedBtn');

  // --- MAKE UNDO POPUP ---
  const undoPopup = document.createElement('div');
  undoPopup.style.position = "fixed";
  undoPopup.style.bottom = "110px";
  undoPopup.style.left = "50%";
  undoPopup.style.transform = "translateX(-50%)";
  undoPopup.style.background = "#1e1e35";
  undoPopup.style.padding = "12px 20px";
  undoPopup.style.borderRadius = "12px";
  undoPopup.style.boxShadow = "0 4px 10px rgba(0,0,0,0.4)";
  undoPopup.style.display = "none";
  undoPopup.style.zIndex = "300";
  undoPopup.style.color = "#fff";
  undoPopup.style.fontSize = "0.95rem";
  undoPopup.style.fontWeight = "600";
  undoPopup.style.cursor = "pointer";
  undoPopup.textContent = "Tasks deleted — Undo";
  document.body.appendChild(undoPopup);

  undoPopup.onclick = () => {
    if (lastDeleted && lastDeleted.length) {
      // restore deleted tasks to front (preserve relative order)
      tasks = [...lastDeleted, ...tasks];
      lastDeleted = [];
      clearTimeout(undoTimer);
      localStorage.setItem('todoTasks', JSON.stringify(tasks));
      renderTasks();
      undoPopup.style.display = "none";
    }
  };

  // --- SHOW UNDO POPUP ---
  function showUndo(deletedTasks) {
    lastDeleted = deletedTasks;
    undoPopup.style.display = "block";

    clearTimeout(undoTimer);
    undoTimer = setTimeout(() => {
      undoPopup.style.display = "none";
      lastDeleted = [];
    }, 5000);
  }

  // --- MODAL HANDLERS ---
  function openTaskModal(id = null) {
    editingTaskId = id;
    populateCategoryDropdown();

    if (id) {
      const t = tasks.find(x => x.id === id);
      if (!t) return;
      document.getElementById('modalTitle').textContent = 'Edit Task';
      taskTitleInput.value = t.title;
      taskCategoryInput.value = t.category;
    } else {
      document.getElementById('modalTitle').textContent = 'New Task';
      taskTitleInput.value = '';
      taskCategoryInput.value = categories[0] || '';
    }
    modal.classList.add('show');
    taskTitleInput.focus();
  }

  function closeModal() {
    modal.classList.remove('show');
    editingTaskId = null;
  }

  document.getElementById('centralBtn').onclick = () => openTaskModal();
  document.getElementById('closeModal').onclick = closeModal;
  document.getElementById('cancelBtn').onclick = closeModal;
  modal.onclick = e => { if (e.target === modal) closeModal(); };

  // --- CATEGORY DROPDOWN ---
  function populateCategoryDropdown() {
    taskCategoryInput.innerHTML = '';
    categories.forEach(cat => {
      const opt = document.createElement('option');
      opt.value = cat;
      opt.textContent = cat;
      taskCategoryInput.appendChild(opt);
    });
    const addNew = document.createElement('option');
    addNew.value = '__add_new__';
    addNew.textContent = 'Add New Category…';
    taskCategoryInput.appendChild(addNew);
  }

  taskCategoryInput.onchange = () => {
    if (taskCategoryInput.value === '__add_new__') {
      const newCat = prompt('Enter new category name:')?.trim();
      if (newCat && !categories.includes(newCat)) {
        categories.push(newCat);
        localStorage.setItem('todoCategories', JSON.stringify(categories));
        populateCategoryDropdown();
        taskCategoryInput.value = newCat;
      } else {
        taskCategoryInput.value = categories[0] || '';
      }
    }
  };

  // --- SAVE TASK ---
  document.getElementById('saveBtn').onclick = () => {
    const title = taskTitleInput.value.trim();
    const category = taskCategoryInput.value;
    if (!title) return alert('Please enter a task name.');
    if (!category) return alert('Please select a category.');

    if (editingTaskId !== null) {
      const t = tasks.find(x => x.id === editingTaskId);
      if (t) {
        t.title = title;
        t.category = category;
        t.updated = new Date().toISOString();
      }
    } else {
      tasks.unshift({
        id: Date.now().toString(),
        title,
        category,
        done: false,
        created: new Date().toISOString(),
        updated: new Date().toISOString()
      });
    }

    localStorage.setItem('todoTasks', JSON.stringify(tasks));
    renderTasks();
    closeModal();
  };

  // --- RENDER TASKS ---
  function renderTasks() {
    if (!tasks.length) {
      notesContainer.innerHTML = `<div style="text-align:center;padding:60px 20px;color:rgba(255,255,255,0.4);">
        <div style="font-size:48px;margin-bottom:16px;">📋</div>
        <p>No tasks yet</p>
        <p style="font-size:0.9rem;">Tap the + button to create one</p>
      </div>`;
      deleteCheckedBtn.style.display = 'none';
      return;
    }

    const allCategories = [...new Set(tasks.map(t => t.category))];
    let html = '';

    allCategories.forEach(cat => {
      const catTasks = tasks.filter(t => t.category === cat);
      html += `<div class="category-card">
<div class="category-title">
  ${permanentCategoryIcons[cat] 
    ? `<img class="cat-icon" src="${permanentCategoryIcons[cat]}" alt="${cat}">`
    : ""
  }
  <span>${cat}</span>
</div>
        <ul class="task-list">
          ${catTasks.map(t => `
            <li data-id="${t.id}">
              <!-- circle toggle -->
              <button class="task-circle" aria-pressed="${t.done ? 'true' : 'false'}" title="${t.done ? 'Checked' : 'Mark done'}">
                <span class="inner-check">${t.done ? '✓' : ''}</span>
              </button>
              <span class="task-title">${escapeHtml(t.title)}</span>
            </li>`
          ).join('')}
        </ul>
      </div>`;
    });

    notesContainer.innerHTML = html;
    addMobileLongPressDelete();
    checkForDeleteVisibility();
  }

  // small helper to escape user text
  function escapeHtml(s) {
    return (s+'').replace(/[&<>"']/g, function(m){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]; });
  }

  // --- DELEGATED CLICK HANDLING ---
  notesContainer.addEventListener('click', (e) => {
    const circle = e.target.closest('.task-circle');
    if (circle) {
      // toggle done state
      e.stopPropagation();
      const li = circle.closest('li');
      const id = li.dataset.id;
      const t = tasks.find(x => x.id === id);
      if (!t) return;
      t.done = !t.done;
      // update DOM immediately for snappy feel
      circle.classList.toggle('checked', t.done);
      const inner = circle.querySelector('.inner-check');
      if (inner) inner.textContent = t.done ? '✓' : '';
      circle.setAttribute('aria-pressed', t.done ? 'true' : 'false');

      localStorage.setItem('todoTasks', JSON.stringify(tasks));
      checkForDeleteVisibility();
      return;
    }

    const li = e.target.closest('li');
    if (li) {
      // clicking the list item (but not the circle) opens edit modal
      const id = li.dataset.id;
      openTaskModal(id);
    }
  });

  // --- DELETE CHECKED (batch) ---
  deleteCheckedBtn.addEventListener('click', () => {
    const checkedTasks = tasks.filter(t => t.done);
    if (!checkedTasks.length) return;
    if (!confirm(`Delete ${checkedTasks.length} checked task${checkedTasks.length>1?'s':''}?`)) return;

    // animation: fade/slide checked li elements
    checkedTasks.forEach(dt => {
      const el = notesContainer.querySelector(`li[data-id="${dt.id}"]`);
      if (el) {
        el.style.transition = "opacity 0.28s ease, transform 0.28s ease";
        el.style.opacity = "0";
        el.style.transform = "translateX(40px)";
      }
    });

    // after animation, remove from tasks and persist
    setTimeout(() => {
      const deleted = [];
      tasks = tasks.filter(t => {
        if (t.done) { deleted.push(t); return false; }
        return true;
      });
      localStorage.setItem('todoTasks', JSON.stringify(tasks));
      renderTasks();
      showUndo(deleted);
    }, 300);
  });

  // --- UNDO handled earlier with popup ---

  // --- SHOW/HIDE DELETE BUTTON ---
  function checkForDeleteVisibility() {
    const any = tasks.some(t => t.done);
    deleteCheckedBtn.style.display = any ? 'block' : 'none';
  }

  // --- MOBILE LONG-PRESS CATEGORY DELETE ---
  function addMobileLongPressDelete() {
    // preserve original behavior: only add handlers on touch devices
    if (!('ontouchstart' in window)) return;

    document.querySelectorAll('.category-card').forEach(card => {
      if (card.querySelector('.delete-category-btn')) return; // already added
      const btn = document.createElement('button');
      btn.textContent = 'Delete';
      btn.className = 'delete-category-btn';
      card.appendChild(btn);

      let timer;
      card.addEventListener('touchstart', () => {
        timer = setTimeout(() => card.classList.add('show-delete'), 600);
      });
      card.addEventListener('touchend', () => clearTimeout(timer));
      card.addEventListener('touchmove', () => clearTimeout(timer));

      btn.onclick = (e) => {
        e.stopPropagation();
        const categoryName = card.querySelector('.category-title').textContent;
        if (confirm(`Delete all tasks in "${categoryName}"?`)) {
          tasks = tasks.filter(t => t.category !== categoryName);
          localStorage.setItem('todoTasks', JSON.stringify(tasks));
          renderTasks();
        }
      };
    });
  }

  // --- INITIAL RENDER ---
  renderTasks();

});
</script>

</body>
</html>
