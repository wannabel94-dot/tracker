2<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daily Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ===============================================
   ROOT VARIABLES
   -----------------------------------------------
   Define colors, border radius, and font for the app.
   These can be reused throughout the CSS using var().
================================================= */
:root {
  --morning-text: #f0f4ff;   /* Text color for morning mode */
  --night-text: #f0f4ff;     /* Text color for night mode */
  --card-radius: 14px;       /* Rounded corners for cards/buttons */
  --bg-blur: 6px;
  --glass-bg: rgba(255,255,255,0.08);
  --glass-border: rgba(255,255,255,0.12);
  font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial;
}

/* ===============================================
   GLOBAL SETTINGS
================================================= */
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  margin: 0;
  padding: 18px;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  min-height: 100vh;
  transition: background 0.5s, color 0.5s;
  color: var(--night-text);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
/* ===============================================
   FIXED FOOTER NAV
================================================= */
.footer-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 70px;
  background: rgba(0, 0, 0, 0.35);
  backdrop-filter: blur(14px) saturate(180%);
  -webkit-backdrop-filter: blur(14px) saturate(180%);
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 28px;
  border-top: 1px solid rgba(255,255,255,0.15);
  z-index: 100;
}

.footer-nav .switch-btn {
  background: transparent;
  border: none;
  border-radius: 50%;
  padding: 10px;
  transition: transform 0.25s, background 0.25s;
}

.footer-nav .switch-btn img {
  width: 32px;
  height: 32px;
  filter: invert(1);
  opacity: 0.6;
  transition: opacity 0.3s, transform 0.3s;
}

.footer-nav .switch-btn:hover {
  background: rgba(255,255,255,0.1);
  transform: scale(1.1);
}

body.morning .footer-nav .switch-btn.morning img {
  opacity: 1;
  transform: scale(1.2);
}

body.night .footer-nav .switch-btn.night img {
  opacity: 1;
  transform: scale(1.2);
}

/* Push main content above footer */
body {
  padding-bottom: 90px; /* prevent overlap with footer */
}

/* ===============================================
   TIME INPUT
================================================= */
input[type="time"] {
  width: 100%;
  padding: 12px 16px;
  font-size: 18px;
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,0.3);
  background: rgba(255,255,255,0.08);
  color: #fff;
  font-family: inherit;
  backdrop-filter: blur(var(--bg-blur));
  transition: background 0.2s, border 0.2s;
}
input[type="time"]:focus {
  outline: none;
  border: 1px solid rgba(255,255,255,0.6);
  background: rgba(255,255,255,0.12);
}

/* ===============================================
   LAYOUT
================================================= */
.wrap { width: 100%; max-width: 740px; }
header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.top-switch { display: flex; gap: 8px; }

/* ===============================================
   TOP SWITCH BUTTONS
================================================= */
.switch-btn {
  padding: 10px;
  border: none;
  border-radius: 10px;
  background: transparent;
  cursor: pointer;
  display: flex;
  justify-content: center;
  align-items: center;
  transition: background 0.25s;
}
.switch-btn img {
  width: 28px;
  height: 28px;
  filter: invert(1);
  opacity: 0.5;
  transform: scale(1);
  transition: opacity 0.25s, transform 0.25s, filter 0.25s;
}
.switch-btn:hover { background: rgba(255,255,255,0.08); border-radius:50%; }
body.morning .switch-btn.morning img { opacity: 1; transform: scale(1.15); }
body.night .switch-btn.night img { opacity: 1; transform: scale(1.15); }

/* ===============================================
   OPTION BUTTONS (Checklist Style)
   -----------------------------------------------
   For normal (non-drink) option buttons (keeps pill UI)
================================================= */
.opt-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 14px 18px;
  border-radius: 16px;
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--glass-border);
  font-size: 17px;
  font-weight: 500;
  color: #fff;
  cursor: pointer;
  transition: transform 0.2s, background 0.2s;
  text-align: center;
  user-select: none;
}
.opt-btn:hover {
  background: rgba(255,255,255,0.10);
  transform: scale(1.02);
}
.opt-btn.selected {
  background: rgba(255,255,255,0.25);
  border-color: rgba(255,255,255,0.5);
  box-shadow: 0 0 10px rgba(255,255,255,0.22);
  transform: scale(1.04);
}

/* Day/night tweaks for pills */
body.morning .opt-btn {
  background: rgba(255,255,255,0.15);
  color: var(--morning-text);
  border-color: rgba(255,255,255,0.25);
}
body.night .opt-btn {
  background: rgba(255,255,255,0.05);
  color: #fff;
  border-color: rgba(255,255,255,0.12);
}
body.morning .opt-btn.selected {
  background: rgba(255,255,255,0.35);
  border-color: rgba(255,255,255,0.5);
}
body.night .opt-btn.selected {
  background: rgba(255,255,255,0.25);
  border-color: rgba(255,255,255,0.4);
}

/* ===============================================
   DRINKS: clean layout (no pill boxes)
   -----------------------------------------------
   Structure: <div class="drink-pill"> <img> <span.label> <div.counter-inner> ...
================================================= */
.drink-pill {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 12px;
  background: none;
  border: none;
  box-shadow: none;
  padding: 4px 0;
}

/* label text next to icon */
.drink-label {
  font-size: 18px;
  font-weight: 500;
  color: #fff;
  min-width: 72px;   /* keeps counters vertically aligned */
}

.icon-circle {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: rgba(255,255,255,0.15);
  display: flex;
  justify-content: center;
  align-items: center;
  flex-shrink: 0;
  margin-right: 6px;
  transition: background 0.25s ease, transform 0.2s ease;
}

.icon-circle img {
  width: 28px;
  height: 28px;
  filter: invert(1);
  opacity: 0.9;
  transition: transform 0.2s ease;
}

.drink-pill:hover .icon-circle {
  background: rgba(255,255,255,0.25);
  transform: scale(1.05);
}

.drink-pill:hover .counter-icon {
  transform: scale(1.06);
  opacity: 0.95;
}

/* counter internals (minus, count, plus) */
.counter-inner {
  display: flex;
  align-items: center;
  gap: 4px;
}
.counter-inner .minus,
.counter-inner .plus {
  background: none;
  border: none;
  color: #fff;
  font-weight: 700;
  font-size: 22px;
  cursor: pointer;
  user-select: none;
  padding: 0 3px;
  transition: opacity 0.16s;
}
.counter-inner .minus:hover,
.counter-inner .plus:hover { opacity: 0.72; }

.counter-inner span[id^="count-"] {
  color: #fff;
  font-size: 18px;
  min-width: 20px;
  text-align: center;
}

/* ===============================================
   CLEAR BUTTONS
================================================= */
#clearDrinksBtn, #clearChecklistBtn {
  display: block;
  margin: 16px auto 0;
  padding: 12px 18px;
  border-radius: 16px;
  font-weight: 600;
  border: none;
  cursor: pointer;
  transition: background 0.25s, transform 0.2s;
  text-align: center;
  width: fit-content;
}
body.morning #clearDrinksBtn, body.morning #clearChecklistBtn {
  background: rgba(255,255,255,0.25);
  color: var(--morning-text);
}
body.night #clearDrinksBtn, body.night #clearChecklistBtn {
  background: rgba(255,255,255,0.12);
  color: #fff;
}
#clearDrinksBtn:hover, #clearChecklistBtn:hover {
  background: rgba(255,255,255,0.30);
  transform: scale(1.04);
}

/* ===============================================
   DRINK COUNTER GROUP (if you need a compact wrapper)
================================================= */
.drink-counter {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap; /* allows row wrap on small screens */
}

/* small icon buttons used elsewhere */
.counter-btn {
  background: transparent;
  border: none;
  color: #fff;
  font-size: 20px;
  cursor: pointer;
  padding: 0 6px;
}
.counter-btn:focus {
  outline: none;
}

/* ===============================================
   RESPONSIVE / SMALL SCREENS
================================================= */
@media (max-width: 480px) {
  body { padding: 12px; }
  .opt-btn { font-size: 16px; padding: 12px; }
  .counter-icon { width: 56px; height: 56px; }
  .drink-label { font-size: 15px; min-width: 56px; }
  input[type="time"] { font-size: 16px; padding: 12px; }
  .drink-counter { gap: 10px; }
}

/* ===============================================
    MENU
   -----------------------------------------------
   ================================================= */
#btnSettings { background:transparent; border:none; font-size:24px; color:#fff; cursor:pointer; padding:0; line-height:1; }
#btnSettings:hover { color:#ddd; background:none; }
.settings-menu {
  position:absolute; top:40px; right:12px;
  background:rgba(0,0,0,0.65);
  backdrop-filter:blur(18px) saturate(180%);
  -webkit-backdrop-filter:blur(18px) saturate(180%);
  border:none; padding:10px 0;
  display:none; flex-direction:column; align-items:stretch;
  min-width:200px;
  box-shadow:0 10px 25px rgba(0,0,0,0.3);
  z-index:50; transform-origin:top right;
  transform:scale(0.95); opacity:0;
  transition:all 0.25s ease;
}
.settings-menu.show { display:flex; opacity:1; transform:translateY(0); }
.settings-menu button {
  background:transparent; border:none; padding:12px 18px;
  width:100%; text-align:left;
  font-weight:600; color:#fff;
  cursor:pointer; display:flex; align-items:center; gap:10px;
  transition:background 0.2s, transform 0.2s;
}
.settings-menu button:hover { background:rgba(255,255,255,0.2); transform:translateX(4px); border-left:4px solid #fff; border-radius:0 8px 8px 0; }

/* ===============================================
   CARD + QUESTIONS
   -----------------------------------------------
   The main card container and question layout.
================================================= */
main.card { padding:18px; border-radius:var(--card-radius); min-height:520px; }
.progress-wrap { display:flex; align-items:center; margin-bottom:12px; }
.progress { flex:1.2; height:10px; border-radius:8px; overflow:hidden; background:rgba(255,255,255,0.06); }
.bar { height:100%; width:0%; background:linear-gradient(90deg,rgba(255,255,255,0.15),rgba(255,255,255,0.3)); border-radius:8px; transition:width 0.25s; }
.question { font-size:18px; margin-bottom:12px; font-weight:600; color:#fff; }
.options { display:grid; grid-template-columns:1fr 1fr; gap:10px; }

/* ===============================================
   MORNING CHECKLIST
   -----------------------------------------------
================================================= */
.checklist { display:flex; flex-direction:column; gap:8px; margin-top:12px; }
.check-item { display:flex; align-items:center; margin-bottom:8px; padding:10px 14px; border-radius:16px; background:rgba(255,255,255,0.05); cursor:pointer; transition:background 0.2s ease; }
.check-item:hover { background:rgba(255,255,255,0.1); }
.check-text { font-weight:500; color:#fff; }
.check-item.selected .check-text { text-decoration:line-through; opacity:0.6; }

   .icon-circle {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: rgba(255,255,255,0.15);
  display: flex;
  justify-content: center;
  align-items: center;
  flex-shrink: 0;
  margin-right: 10px;
  transition: background 0.25s ease;
}

.icon-circle img {
  width: 20px;
  height: 20px;
  filter: invert(1);
  opacity: 0.9;
}

.check-item.selected .icon-circle {
  background: rgba(255,255,255,0.3);
}

/* ===============================================
   NAVIGATION BUTTONS
   -----------------------------------------------
   Back/Next buttons at bottom of card.
================================================= */
.controls { display:flex; gap:10px; justify-content:space-between; margin-top:16px; }
.back-btn, .next-btn {
  background:rgba(255,255,255,0.15);
  color:#fff;
  font-weight:700;
  border:0; padding:12px 16px;
  border-radius:12px;
  cursor:pointer;
  backdrop-filter:blur(6px);
  transition:opacity 0.2s;
}
.back-btn:hover, .next-btn:hover { opacity:0.85; }
.back-btn[disabled], .next-btn[disabled] { opacity:0.5; cursor:not-allowed; }
.done-note { font-size:20px; text-align:center; font-weight:700; margin-top:120px; }

   .back-to-checklist {
  display: inline-block;
  margin-top: 40px;
  padding: 10px 18px;
  border: none;
  border-radius: 20px;
  background: rgba(255,255,255,0.15);
  color: #fff;
  font-size: 16px;
  font-weight: 500;
  cursor: pointer;
  transition: background 0.25s ease, transform 0.2s ease;
}

.back-to-checklist:hover {
  background: rgba(255,255,255,0.25);
  transform: scale(1.05);
}
   
/* ===============================================
   BACKGROUNDS
   -----------------------------------------------
================================================= */
body.night { color:#fff; }
body.night::before {
  content:""; position:fixed; inset:0; z-index:-1;
  background:url("https://i.pinimg.com/736x/5a/62/e0/5a62e0d170bdd225f171db6520d5bb83.jpg") center/cover no-repeat;
}
body.morning { color:#fff; }
body.morning::before {
  content:""; position:fixed; inset:0; z-index:-1;
  background:url("https://i.pinimg.com/736x/69/44/51/694451017e620165ffc4408bcfa3fdf8.jpg") center/cover no-repeat;
}

/* ===============================================
   HISTORY 
   -----------------------------------------------
================================================= */
.history-modal { position:fixed; inset:0; background:rgba(0,0,0,0.55); backdrop-filter:blur(10px); display:none; justify-content:center; align-items:center; z-index:100; animation:fadeIn 0.3s ease forwards; }
.history-modal.show { display:flex; }
.history-content {
  background:rgba(255,255,255,0.12);
  backdrop-filter:blur(18px);
  color:#fff;
  border-radius:18px;
  width:90%; max-width:600px; max-height:80vh;
  overflow-y:auto; padding:24px; position:relative;
  box-shadow:0 8px 20px rgba(0,0,0,0.25);
  animation:slideUp 0.3s ease forwards;
}
.history-content h3 { margin-top:16px; font-weight:700; font-size:20px; }
.close-history {
  position:absolute; top:8px; right:12px;
  background:rgba(255,255,255,0.15);
  border:none; border-radius:50%;
  color:#fff; font-size:22px;
  width:34px; height:34px;
  cursor:pointer; transition:background 0.2s;
}
.close-history:hover { background:rgba(255,255,255,0.3); }

/* ===============================================
   ANIMATIONS
================================================= */
@keyframes fadeIn { from{opacity:0;} to{opacity:1;} }
@keyframes slideUp { from{transform:translateY(40px); opacity:0;} to{transform:translateY(0); opacity:1;} }

/* ===============================================
   SMALL SCREENS (Mobile)
================================================= */
@media (max-width:480px) { 
  body{padding:12px;}
  .opt-btn, .counter-btn{font-size:16px;padding:12px;}
  .counter-icon{width:20px;height:20px;}
  input[type=time]{font-size:16px;padding:12px;}
}
</style>
</head>
<body class="night">
<div class="wrap">
  <header>
    <button id="btnSettings">☰</button>
    <div id="settingsMenu" class="settings-menu">
      <button id="btnExport">Export data</button>
      <button id="btnClearToday">Clear Today's Data</button>
    </div>
  </header>

  <main class="card">
    <div class="progress-wrap"><div class="progress"><div class="bar" id="progressBar"></div></div></div>
    <div id="contentArea"></div>
    <div class="controls">
      <button class="back-btn" id="backBtn">Back</button>
      <button class="next-btn" id="nextBtn">Next</button>
    </div>
  </main>
</div>

<!-- History Modal -->
<div id="historyModal" class="history-modal">
  <div class="history-content">
    <button class="close-history" id="closeHistory">×</button>
    <div id="historyInner"></div>
  </div>
</div>

<!-- Fixed Footer Navigation -->
<footer class="footer-nav">
  <button class="switch-btn morning" id="morningBtn"><img src="icons/day.svg" alt="Morning"></button>
  <button class="switch-btn night" id="nightBtn"><img src="icons/night.svg" alt="Night"></button>
  <button class="switch-btn history" id="historyBtn"><img src="icons/history.svg" alt="History"></button>
</footer>

<script>
document.addEventListener('DOMContentLoaded', () => {
  /* ---------- QUESTIONS ---------- */
  const MORNING = [
    {key:'wake_time', type:'time', label:'What time did you wake up?'},
    {key:'how_slept', type:'single', label:'How do you think you slept?', options:['Went to bed late but slept in','Went to bed late but woke early','Went to bed early but woke really early',"Couldn't fall asleep",'Lightly disrupted','Frequently disrupted','Fine'], autoNext:true}
  ];
  const MORNING_CHECKLIST_ITEMS = [
    { key: 'made_bed', label: 'Make bed', icon: 'bed.svg' },
    { key: 'took_meds_morn', label: 'Take meds', icon: 'meds.svg' },
    { key: 'tidy_up', label: 'Tidy up', icon: 'sweep.svg' },
    { key: 'tea_meditate', label: 'Have tea', icon: 'tea.svg' },
    { key: 'shower_morn', label: 'Shower', icon: 'shower.svg' },
    { key: 'led_mask_morn', label: 'LED mask', icon: 'led.svg' },
    { key: 'skincare_morn', label: 'Skincare', icon: 'skincare2.svg' },
    { key: 'eat_breakfast', label: 'Breakfast', icon: 'break2.svg' },
    { key: 'supplements_morn', label: 'Supplements', icon: 'supplements.svg' },
    { key: 'get_dressed', label: 'Get dressed', icon: 'dressed.svg' },
    { key: 'brush_teeth_morn', label: 'Brush teeth', icon: 'toothbrush.svg' }
  ];
  const NIGHT = [
    {key:'psyillium', type:'single', label:'Did you take psyllium?', options:['Yes','No'], autoNext:true},
    {key:'magnesium', type:'single', label:'Magnesium?', options:['Yes','No'], autoNext:true},
    {key:'pillowcase', type:'single', label:'Did you change the pillowcase?', options:['Yes','No'], autoNext:true},
    {key:'shower_night', type:'single', label:'Shower?', options:['Yes','No'], autoNext:true},
    {key:'skincare_night', type:'single', label:'Skincare?', options:['None','Bare minimum','Once','Twice'], autoNext:true},
    {key:'teeth_night', type:'single', label:'Teeth?', options:['Once','Twice','None'], autoNext:true},
    {key:'flossed', type:'single', label:'Flossed?', options:['Once','Twice','None'], autoNext:true},
    {key:'left_house', type:'single', label:'Did you leave the house?', options:['Nope','Seconds','Briefly','1h+','2h+','Fair amount','All day'], autoNext:true},
    {key:'day_description', type:'single', label:'How would you best describe the day?', options:['Bedrot','Mostly wasted','Chilled','Somewhat productive','Hyperproductive','Busy','Good'], autoNext:true},
    {key:'caffeine_alcohol', type:'multi', label:'Caffeine / alcohol', options:['Coffee','Tea','Beer','Spirits','Wine','Mate']},
    {key:'sickness', type:'multi', label:'Sickness / symptoms', options:['UTI feeling','UTI','Headache','Migraine','Ulcer','Nausea','Gassy','Trapped gas','Cold/flu','Allergies','Vomiting','none']},
    {key:'sensory_triggers', type:'multi', label:'Sensory triggers', options:['Body fat','Body size','Dirty / messy flat','Skin','Hair','Clothes','Outside environment','none']},
    {key:'appointments', type:'multi', label:'Appointments', options:['Psych','Therapy (online)','Therapy (in-person)','Doctor','Blood tests','none']},
    {key:'movement', type:'multi', label:'Did you move today?', options:['Tidying / cleaning','City walking','Stroll','Quick dog walk','Long dog walk','Hike','Jog','none']},
    {key:'talked_to_anyone', type:'multi', label:'Did you talk to anyone?', options:['Parents','Friends','Co-worker','Classmate','Social','none']}
  ];
  
  /* ---------- STATE ---------- */
  let mode = 'night';
  let currentStep = 0;
  let answers = {};

  /* ---------- ELEMENTS ---------- */
  const contentArea = document.getElementById('contentArea');
  const backBtn = document.getElementById('backBtn');
  const nextBtn = document.getElementById('nextBtn');
  const progressBar = document.getElementById('progressBar');
  const morningBtn = document.getElementById('morningBtn');
  const nightBtn = document.getElementById('nightBtn');
  const historyBtn = document.getElementById('historyBtn');
  const historyModal = document.getElementById('historyModal');
  const closeHistory = document.getElementById('closeHistory');

  /* ---------- MODE SWITCH ---------- */
  function switchMode(newMode) {
    mode = newMode;
    document.body.classList.remove('morning','night');
    document.body.classList.add(mode);
    currentStep = 0;
    answers = {};
    renderStep();
  }

  morningBtn.addEventListener('click',()=>switchMode('morning'));
  nightBtn.addEventListener('click',()=>switchMode('night'));
  historyBtn.addEventListener('click',()=>historyModal.classList.add('show'));
  closeHistory.addEventListener('click',()=>historyModal.classList.remove('show'));

  /* ---------- RENDER ---------- */
  function renderStep() {
    const steps = (mode==='morning')?MORNING:MORNING_CHECKLIST_ITEMS.concat(NIGHT);
    const step = steps[currentStep];
    if(!step){ contentArea.innerHTML = `<p>All done for ${mode}!</p>`; progressBar.style.width='100%'; return; }
    let html = '';
    if(step.type==='time'){
      html = `<label>${step.label}</label><input type="time" id="inputTime">`;
    } else if(step.type==='single' || step.type==='multi'){
      html = `<p class="question">${step.label}</p><div class="options">`;
      step.options.forEach((opt,i)=>html+=`<button class="opt-btn" data-index="${i}">${opt}</button>`);
      html += `</div>`;
    } else {
      html = `<p>${step.label}</p>`;
    }
    contentArea.innerHTML = html;
    updateProgress();
    attachOptionHandlers(step);
  }

  function attachOptionHandlers(step){
    document.querySelectorAll('.opt-btn').forEach(btn=>{
      btn.onclick = ()=>{
        const val = step.type==='multi' ? (answers[step.key]||[]).includes(btn.textContent) ? answers[step.key].filter(v=>v!==btn.textContent) : [...(answers[step.key]||[]),btn.textContent] : btn.textContent;
        answers[step.key]=val;
        if(step.type==='single'){ document.querySelectorAll('.opt-btn').forEach(b=>b.classList.remove('selected')); btn.classList.add('selected'); if(step.autoNext) nextStep(); }
        if(step.type==='multi'){ btn.classList.toggle('selected'); }
      }
    });
    if(step.type==='time'){ document.getElementById('inputTime').value=answers[step.key]||''; document.getElementById('inputTime').onchange=e=>{answers[step.key]=e.target.value; nextStep();}; }
  }

  function nextStep(){ currentStep++; renderStep(); }
  function prevStep(){ if(currentStep>0) currentStep--; renderStep(); }

  backBtn.addEventListener('click',prevStep);
  nextBtn.addEventListener('click',nextStep);

  function updateProgress(){
    const total = (mode==='morning')?MORNING.length:MORNING_CHECKLIST_ITEMS.length+NIGHT.length;
    progressBar.style.width = `${Math.round(currentStep/total*100)}%`;
  }

  renderStep();
});
</script>
</body>
</html>
