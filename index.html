<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daily Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root { 
  --morning-text:#3b1b10; 
  --night-text:#f0f4ff; 
  --card-radius:14px; 
  font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial; 
}

* { box-sizing:border-box; }
html, body { height:100%; margin:0; }
body { margin:0; padding:18px; display:flex; justify-content:center; align-items:flex-start; min-height:100vh; transition: background 0.5s, color 0.5s; }

/* Time input */
input[type="time"] { 
  width:100%; padding:12px 16px; font-size:18px; border-radius:12px; border:1px solid rgba(255,255,255,0.3); background:rgba(255,255,255,0.08); color:#fff; font-family:inherit; backdrop-filter:blur(6px); transition:background 0.2s, border 0.2s; 
}
input[type="time"]:focus { 
  outline:none; border:1px solid rgba(255,255,255,0.6); background:rgba(255,255,255,0.12); 
}

/* Layout */
.wrap { width:100%; max-width:740px; }
header { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
.top-switch { display:flex; gap:8px; }
.switch-btn { padding:10px; border:none; border-radius:10px; background:transparent; cursor:pointer; display:flex; justify-content:center; align-items:center; transition:background 0.25s; }
.switch-btn img { width:28px; height:28px; filter:invert(1); opacity:0.5; transform:scale(1); transition:opacity 0.25s, transform 0.25s, filter 0.25s; }
.switch-btn:hover { background: rgba(255,255,255,0.08); border-radius:50%; }
body.morning .switch-btn.morning img { opacity:1; transform:scale(1.15); }
body.night .switch-btn.night img { opacity:1; transform:scale(1.15); }
  
/* ---------- SETTINGS MENU ---------- */
.settings-menu {
  position: absolute;
  top: 40px;
  right: 12px;
.settings-menu {
  pointer-events: auto; /* ensure menu is clickable */
  background: rgba(0,0,0,0.65); /* slightly visible background for menu */
  backdrop-filter: blur(18px) saturate(180%);
  -webkit-backdrop-filter: blur(18px) saturate(180%);
  border: none;
  padding: 10px 0;
  display: none;
  flex-direction: column;
  align-items: stretch;
  min-width: 200px;
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
  z-index: 50;
  transform-origin: top right;
  transform: scale(0.95);
  opacity: 0;
  transition: all 0.25s ease;
}


/* Show menu */
.settings-menu.show {
  display: flex;
  opacity: 1;
  transform: translateY(0);
}

/* Settings buttons inside menu */
.settings-menu button {
  background: transparent;
  border: none;
  padding: 12px 18px;
  width: 100%;
  text-align: left;
  font-weight: 600;
  color: #fff;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 10px;
  transition: background 0.2s, transform 0.2s;
}

.settings-menu button:hover {
  background: rgba(255, 255, 255, 0.2);
  transform: translateX(4px);
  border-left: 4px solid #fff;   
  border-radius: 0 8px 8px 0;
}

/* Make menu more mobile friendly */
@media (max-width: 480px) {
  .settings-menu {
    top: 45px;
    right: 5px;
    min-width: 140px;
    padding: 8px 0;
  }
  .settings-menu button {
    padding: 10px 14px;
    font-size: 14px;
  }
}

/* Card + questions */
main.card { padding:18px; border-radius:var(--card-radius); min-height:520px; }
.progress-wrap { display:flex; align-items:center; gap:0; margin-bottom:12px; }
.progress { flex:1.2; height:10px; border-radius:8px; overflow:hidden; background:rgba(255,255,255,0.06); }
.bar { height:100%; width:0%; background:linear-gradient(90deg,rgba(255,255,255,0.15),rgba(255,255,255,0.3)); border-radius:8px; transition:width 0.25s; }
.question { font-size:18px; margin-bottom:12px; font-weight:600; }
.options { display:grid; grid-template-columns:1fr 1fr; gap:10px; }

/* Option buttons */
.opt-btn {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px 18px;
  border-radius: 16px;
  border: 1px solid transparent;
  font-size: 18px;
  font-weight: 600;
  cursor: pointer;
  transition: transform 0.2s, background 0.3s, box-shadow 0.3s, border 0.3s, color 0.3s;
  backdrop-filter: blur(6px);
  box-shadow: 0 4px 6px rgba(0,0,0,0.1);
  text-align: center;
  user-select: none;
}
.opt-btn:hover { transform: scale(1.03); box-shadow: 0 6px 10px rgba(0,0,0,0.15); }
.opt-btn.selected { border: 2px solid rgba(255,255,255,0.4); background: rgba(255,255,255,0.2); }

/* ---------- CHECKLIST CONTAINER ---------- */
.checklist {
  display: flex;
  flex-direction: column; 
  gap: 8px;               
  margin-top: 12px;
}

/* ---------- CHECKLIST ITEM (pill style) ---------- */
.check-item {
  display: flex;
  align-items: center;
  margin-bottom: 8px;
  padding: 10px 14px;
  border-radius: 16px;
  background: rgba(255,255,255,0.05);
  cursor: pointer;
  transition: background 0.2s ease;
}

.check-item:hover {
  background: rgba(255,255,255,0.1);
}

.check-text {
  font-weight: 500;
}

.check-item.selected .check-text {
  text-decoration: line-through;
  opacity: 0.6;
}

.check-icon {
  width: 22px;
  height: 22px;
  filter: invert(1);     
  opacity: 0.9;
  flex-shrink: 0;
  margin-right: 10px;    
  transition: opacity 0.25s ease;
}

.check-item.selected .check-icon {
  opacity: 0.4;
}

.clear-btn {
  display: block;
  margin: 14px auto 0;
  padding: 8px 14px;
  border-radius: 14px;
  background: rgba(255,255,255,0.08);
  color: white;
  border: none;
  cursor: pointer;
  transition: background 0.25s ease;
}

.clear-btn:hover {
  background: rgba(255,255,255,0.18);
}

/* Morning / Night backgrounds */
body.morning .opt-btn { background: rgba(255,255,255,0.12); color: #fff; }
body.morning .opt-btn:hover { background: rgba(255,255,255,0.25); }
body.night .opt-btn { background: rgba(255,255,255,0.08); color: var(--night-text); }
body.night .opt-btn:hover { background: rgba(255,255,255,0.18); }

/* Small screens */
@media (max-width:480px){
  .opt-btn { font-size:16px; padding:14px 16px; }
}

/* Drinks counter */
.counter-item { display:flex; justify-content:space-between; align-items:center; padding:10px 14px; border-radius:12px; margin-bottom:8px; background:rgba(255,255,255,0.1); backdrop-filter:blur(8px); border:1px solid rgba(255,255,255,0.15); transition:background 0.3s,border 0.3s; }
body.night .counter-item { background: rgba(0,0,0,0.3); border:1px solid rgba(255,255,255,0.2); }
body.morning .counter-item { background: rgba(255,255,255,0.15); border:1px solid rgba(255,255,255,0.25); }
.counter-controls { display:flex; gap:6px; align-items:center; }
.counter-controls button { background: rgba(255,255,255,0.2); border:none; color:#fff; font-size:18px; padding:4px 10px; border-radius:8px; cursor:pointer; transition:background 0.2s; }
.counter-controls button:hover { background: rgba(255,255,255,0.35); }
body.night .counter-controls button { background: rgba(255,255,255,0.15); }
body.night .counter-controls button:hover { background: rgba(255,255,255,0.3); }

/* Navigation buttons */
.controls { display:flex; gap:10px; justify-content:space-between; margin-top:16px; }
.back-btn, .next-btn { background: rgba(255,255,255,0.15); color:#fff; font-weight:700; border:0; padding:12px 16px; border-radius:12px; cursor:pointer; backdrop-filter:blur(6px); transition:opacity 0.2s; }
.back-btn:hover, .next-btn:hover { opacity:0.85; }
.back-btn[disabled], .next-btn[disabled] { opacity:0.5; cursor:not-allowed; }

.done-note { font-size:20px; text-align:center; font-weight:700; margin-top:18px; }

/* Backgrounds */
body.night { color:#fff; }
body.night::before { content:""; position:fixed; inset:0; z-index:-1; background:url("https://i.pinimg.com/1200x/1f/7e/32/1f7e32801501b45b287f369256c50f03.jpg") center/cover no-repeat; }
body.morning { color:#fff; }
body.morning::before { content:""; position:fixed; inset:0; z-index:-1; background:url("https://i.pinimg.com/736x/69/44/51/694451017e620165ffc4408bcfa3fdf8.jpg") center/cover no-repeat; }

/* ---------- HISTORY MODAL ---------- */
.history-modal {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.55);
  backdrop-filter: blur(10px);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 100;
  animation: fadeIn 0.3s ease forwards;
}
.history-modal.show { display: flex; }
.history-content {
  background: rgba(255, 255, 255, 0.12);
  backdrop-filter: blur(18px);
  color: #fff;
  border-radius: 18px;
  width: 90%;
  max-width: 600px;
  max-height: 80vh;
  overflow-y: auto;
  padding: 24px;
  position: relative;
  box-shadow: 0 8px 20px rgba(0,0,0,0.25);
  animation: slideUp 0.3s ease forwards;
}
.history-content h3 { margin-top: 16px; font-weight: 700; font-size: 20px; }
.close-history {
  position: absolute;
  top: 8px;
  right: 12px;
  background: rgba(255,255,255,0.15);
  border: none;
  border-radius: 50%;
  color: #fff;
  font-size: 22px;
  width: 34px;
  height: 34px;
  cursor: pointer;
  transition: background 0.2s;
}
.close-history:hover { background: rgba(255,255,255,0.3); }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

/* Small screens */
@media (max-width:480px) { 
  body{padding:12px;} 
  .opt-btn{font-size:16px;padding:12px;} 
  input[type=time]{font-size:16px;padding:12px;} 
}
</style>
</head>
<body class="night">
<div class="wrap">
  <header>
    <div class="top-switch">
      <button class="switch-btn morning" id="morningBtn"><img src="icons/day.svg" alt="Morning"></button>
      <button class="switch-btn night" id="nightBtn"><img src="icons/night.svg" alt="Night"></button>
    </div>
    <button id="btnSettings">☰</button>
    <div id="settingsMenu" class="settings-menu">
      <button id="btnEntries">History</button>
      <button id="btnExport">Export data</button>
      <button id="btnClearToday">Clear Today's Data</button>
    </div>
  </header>

  <main class="card">
    <div class="progress-wrap"><div class="progress"><div class="bar" id="progressBar"></div></div></div>
    <div id="contentArea"></div>
    <div class="controls">
      <button class="back-btn" id="backBtn">Back</button>
      <button class="next-btn" id="nextBtn">Next</button>
    </div>
  </main>
</div>

<!-- History Modal -->
<div id="historyModal" class="history-modal">
  <div class="history-content">
    <button class="close-history" id="closeHistory">×</button>
    <div id="historyInner"></div>
  </div>
</div>

</body>
</html>
