<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#317EFB">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Daily Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --morning-text:#3b1b10;
  --night-text:#f0f4ff;
  --card-radius:14px;
  font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial;
}

* { box-sizing:border-box; }
html, body { height:100%; }

body {
  margin:0;
  padding:18px;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  min-height:100vh;
  transition: background 0.5s ease, color 0.5s ease;
}

/* Layout + header */
.wrap { width:100%; max-width:740px; position:relative; }
header { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; gap:8px; position:relative; }
h1 { margin:0; font-size:20px; }

.top-actions {
  display:flex;
  align-items:center;
  justify-content:space-between;
  width:100%;
}

/* MODE SWITCH ICONS — translucent inactive, bright active, scale effect */
.top-switch {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
}

.switch-btn {
  flex: 1;
  padding: 10px;
  border: none;
  border-radius: 10px;
  background: transparent; /* 🔹 ensures no square background */
  cursor: pointer;
  display: flex;
  justify-content: center;
  align-items: center;
  transition: background 0.25s ease;
}

/* Night icon slightly smaller base size */
.switch-btn.night img {
  width: 25px;
  height: 25px;
}

/* Morning base size */
.switch-btn.morning img {
  width: 24px;
  height: 24px;
}

/* Make SVG icons white */
.switch-btn img {
  filter: invert(1); /* 🔹 turns black SVG white */
  opacity: 0.5;
  transform: scale(1);
  transition: opacity 0.25s ease, transform 0.25s ease, filter 0.25s ease;
}

/* Base hover glow (optional, still works on hover) */
.switch-btn:hover {
  background: rgba(255, 255, 255, 0.08);
  border-radius: 50%;
}

/* Persistent glow + soft halo for morning mode */
body.morning .switch-btn.morning {
  background: rgba(255, 255, 255, 0.12); /* circular glow behind icon */
  border-radius: 50%;
}

body.morning .switch-btn.morning img {
  opacity: 1;
  transform: scale(1.15);
}

/* Persistent glow + soft halo for night mode */
body.night .switch-btn.night {
  background: rgba(255, 255, 255, 0.12); /* circular glow behind icon */
  border-radius: 50%;
}

body.night .switch-btn.night img {
  opacity: 1;
  transform: scale(1.12);
}

/* Hover effects — still works on top of persistent glow */
.switch-btn.morning img:hover {
  opacity: 0.85;
  transform: scale(1.18);
}

.switch-btn.night img:hover {
  opacity: 0.85;
  transform: scale(1.15);
}


/* Settings button */
#btnSettings {
  font-size:22px;
  padding:6px 10px;
  line-height:1;
  background:transparent;
  border:none;
  color:#fff;
  cursor:pointer;
  margin-left:auto;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:opacity 0.2s ease;
  margin-top:-10px;
}

#btnSettings:hover { opacity:0.8; }

/* Settings dropdown */
.settings-menu {
  position:absolute;
  top:42px;
  right:0;
  background:rgba(255,255,255,0.25);
  backdrop-filter:blur(16px);
  border-radius:12px;
  box-shadow:0 8px 24px rgba(0,0,0,0.3);
  flex-direction:column;
  padding:6px;
  z-index:20;
  display:none;
  min-width:150px;
}

.settings-menu.show { display:flex; }

.settings-menu button {
  background:transparent;
  border:none;
  padding:10px 16px;
  width:100%;
  text-align:left;
  cursor:pointer;
  font-weight:600;
  transition:background 0.2s;
}

.settings-menu button:hover {
  background:rgba(0,0,0,0.05);
}

/* Main card + questions */
main.card {
  padding:18px;
  border-radius:0;
  min-height:520px;
  background:none;
  box-shadow:none;
  backdrop-filter:none;
  -webkit-backdrop-filter:none;
}

.progress-wrap {
  display:flex;
  align-items:center;
  gap:0;
  margin-bottom:12px;
}

.progress {
  flex:1.2;
  height:10px;
  border-radius:8px;
  overflow:hidden;
  background:rgba(255,255,255,0.06);
}

.bar {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, rgba(255,255,255,0.15), rgba(255,255,255,0.3));
  box-shadow: 0 0 4px rgba(255,255,255,0.2);
  border-radius: 8px;
  transition: width 0.25s;
}


.prog-text { display:none; }

.question {
  font-size:18px;
  margin-bottom:12px;
  font-weight:600;
}

.options {
  display: grid !important;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.opt-btn {
  width: 100%;
  text-align: center;
  display: flex;           /* use flex to center content vertically */
  align-items: center;     /* vertical centering */
  justify-content: center; 
  padding: 14px 16px;
  border-radius: 12px;
  border: 1px solid transparent;
  font-size: 18px;
  cursor: pointer;
  transition: background .2s, color .2s, border .2s;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

.opt-btn.selected {
  background: rgba(255,255,255,0.6);
  color: #000;
  font-weight: 700;
}

.options button {
  width: 100%;
}
  .opt-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  text-align: center;
}

.opt-icon {
  display: flex;
  align-items: center;
  justify-content: center;
}
  
.opt-icon {
  width: 20px;       /* smaller, subtle size */
  height: 20px;
  filter: invert(1); /* keep white for dark backgrounds */
  opacity: 0.9;
  flex-shrink: 0;    /* keeps icon from squishing with long text */
}

.opt-btn svg {
  width: 18px;
  height: 18px;
  opacity: 0.85;
}

/* Controls */
.controls {
  display:flex;
  gap:10px;
  justify-content:space-between;
  margin-top:16px;
}

  /*next and back format*/
.back-btn,
.next-btn {
  background: rgba(255, 255, 255, 0.15); /* slightly translucent background */
  color: #fff;  /* white text */
  font-weight: 700;
  border: 0;
  padding: 12px 16px;
  border-radius: 12px;
  cursor: pointer;
  transition: opacity 0.2s;
  backdrop-filter: blur(6px);
}

.back-btn:hover,
.next-btn:hover {
  opacity: 0.85;
}

.back-btn[disabled],
.next-btn[disabled] {
  opacity: 0.5;
  cursor: not-allowed;
}

.small-muted {
  font-size: 13px;
  text-align: center;
  margin-top: 12px;
}


.done-note {
  font-size:20px;
  text-align:center;
  font-weight:700;
  margin-top:18px;
}

/* Fade effect */
.fade-out { opacity:0; transition:opacity 0.8s ease; }

/* Entries list */
.meta { font-size:13px; margin-top:10px; text-align:center; }
.center { display:flex; justify-content:center; }
.entries-list { margin-top:8px; }
.entry-row {
  padding:12px;
  border-radius:10px;
  margin-bottom:8px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.entry-row .small { font-size:13px; }

/* Night mode styling */
body.night {
  color:#fff;
}

body.night::before {
  content:"";
  position:fixed;
  inset:0;
  z-index:-1;
  background:url("https://i.pinimg.com/1200x/6c/d7/2d/6cd72d1678453c8f4d7c4afa59a617e3.jpg") center center / cover no-repeat;
}

body.night .opt-btn {
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.06);
  color:var(--night-text);
}

body.night .opt-btn.selected {
  background:rgba(255,255,255,0.28);
  color:#12002e;
  font-weight:700;
}

/* Morning mode styling */
body.morning {
  color:#fff;
}

body.morning::before {
  content:"";
  position:fixed;
  inset:0;
  z-index:-1;
  background:url("images/morning.jpg") center center / cover no-repeat;
}

body.morning .opt-btn {
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.25);
  color:#fff;
}

body.morning .opt-btn.selected {
  background:rgba(255,255,255,0.32);
  color:#fff;
  font-weight:700;
}

/* Responsive */
@media (max-width:480px) {
  body { padding:12px; }
  .opt-btn { font-size:16px; padding:12px; }
  input[type=time],
  input[type=number] { font-size:16px; padding:12px; }
}
</style>

</head>
<body class="night">
<div class="wrap">
  <header>
    <div class="top-actions">
      <div class="top-switch" id="switchWrap">
        <button class="switch-btn morning" id="morningBtn" title="Morning">
          <img src="icons/day.svg" class="icon-morning" alt="Morning">
        </button>
        <button class="switch-btn night" id="nightBtn" title="Night">
          <img src="icons/night.svg" class="icon-night" alt="Night">
        </button>
      </div>
      <button id="btnSettings" class="btn ghost" title="Menu">⋮</button>
      <div id="settingsMenu" class="settings-menu">
        <button id="btnEntries">History</button>
        <button id="btnExport">Export data</button>
        <button id="btnClearToday">Clear Today's Data</button> 
      </div>
    </div>
  </header>

  <main class="card" id="appCard">
    <div class="progress-wrap">
      <div class="progress"><div class="bar" id="progressBar"></div></div>
      <div class="prog-text" id="progText"></div>
    </div>
    <div id="contentArea"></div>
    <div class="controls" id="controls">
      <div class="center"><button class="back-btn" id="backBtn">Back</button></div>
      <div class="center"><button class="next-btn" id="nextBtn">Next</button></div>
    </div>
  </main>
</div>
<script>
document.addEventListener('DOMContentLoaded', () => {

  // ===== QUESTIONS =====
  const MORNING = [
    {key:'wake_time', type:'time', label:'What time did you wake up?'},
    {key:'how_slept', type:'single', label:'How do you think you slept?', options:['Went to bed late but slept in','Went to bed late but woke early','Went to bed early but woke really early',"Couldn't fall asleep",'Lightly disrupted','Frequently disrupted','Fine'], autoNext:true},
    {key:'made_bed', type:'single', label:'Make bed?', options:['Yes','No'], autoNext:true},
    {key:'took_meds_morn', type:'single', label:'Take meds?', options:['Yes','No'], autoNext:true},
    {key:'tidy_up', type:'single', label:'Tidy up?', options:['Yes','No'], autoNext:true},
    {key:'tea_meditate', type:'single', label:'Have tea in bed + meditate 5 mins?', options:['Yes','No'], autoNext:true},
    {key:'shower_morn', type:'single', label:'Shower?', options:['Yes','No'], autoNext:true},
    {key:'led_mask_morn', type:'single', label:'LED mask?', options:['Yes','No'], autoNext:true},
    {key:'skincare_morn', type:'single', label:'Skincare?', options:['Yes','No'], autoNext:true},
    {key:'eat_breakfast', type:'single', label:'Eat breakfast?', options:['Yes','No'], autoNext:true},
    {key:'supplements_morn', type:'single', label:'Supplements?', options:['Yes','No'], autoNext:true},
    {key:'get_dressed', type:'single', label:'Get dressed?', options:['Yes','No'], autoNext:true},
    {key:'brush_teeth_morn', type:'single', label:'Brush teeth?', options:['Yes','No'], autoNext:true}
  ];

  const NIGHT = [
    {key:'psyillium', type:'single', label:'Did you take psyllium?', options:['Yes','No'], autoNext:true},
    {key:'magnesium', type:'single', label:'Magnesium?', options:['Yes','No'], autoNext:true},
    {key:'pillowcase', type:'single', label:'Did you change the pillowcase?', options:['Yes','No'], autoNext:true},
    {key:'shower_night', type:'single', label:'Shower?', options:['Yes','No'], autoNext:true},
    {key:'skincare_night', type:'single', label:'Skincare?', options:['None','Bare minimum','Once', 'Twice'], autoNext:true},
    {key:'teeth_night', type:'single', label:'Teeth?', options:['Once','Twice','None'], autoNext:true},
    {key:'flossed', type:'single', label:'Flossed?', options:['Once','Twice','None'], autoNext:true},
    {key:'left_house', type:'single', label:'Did you leave the house?', options:['Nope','Seconds','Briefly','1h+','2h+','Fair amount','All day'], autoNext:true},
    {key:'day_description', type:'single', label:'How would you best describe the day?', options:['Bedrot','Mostly wasted','Chilled','Somewhat productive','Hyperproductive','Busy','Good'], autoNext:true},
    {key:'saw_dogs', type:'single', label:'Did you see the dogs today?', options:['Sometimes','Yes','No'], autoNext:true},
    {key:'feel_with_L', type:'single', label:'How do you feel with L today?', options:['Elated','Sensitive','Pretty good','Fine','Irritated','Somewhat insecure','Anxiously insecure','Anguish'], autoNext:true},
    {key:'house_state', type:'single', label:'What is the state of the house?', options:['Disaster','Very messy','A bit messy','Fine - a few dishes','Pretty tidy','Spotless'], autoNext:true},
    {key:'drove', type:'single', label:'Did you drive today?', options:['No','<30 mins','30 mins+','1h+'], autoNext:true},
    {key:'body_feelings', type:'single', label:'How do you feel about your body today?', options:["Hadn't thought about it","Passing thoughts","Momentarily down","Depressed or gross","Fixated","Disgusting / really preoccupied","All-consuming"], autoNext:true},
    {key:'food_desc', type:'single', label:'How would you describe your food?', options:['Binged','Grazed random crap','Indulgent but satisfying','Big portions of good food','Balanced food + portions','Restricted food + portions'], autoNext:true},
    {key:'most_prominent', type:'multi', label:'What do you think is most prominent?', options:['none','Somatic anxiety','Mental anxiety','OCD','Depression','BPD','ADHD','BDD'], autoNext:true},
    {key:'meds', type:'multi', label:'Any extra meds?', options:['1mg benzo','Painkillers','2mg benzo','Antisickness','3mg benzo','Antihistamine','D-Mannose','Antibiotic','None']},
    {key:'caffeine_alcohol', type:'multi', label:'Caffeine / alcohol', options:['1 coffee','1 tea','2 teas','3 teas','2 coffees','mate','1-2 drinks','2+ drinks','none']},
    {key:'sickness', type:'multi', label:'Sickness / symptoms', options:['UTI feeling','UTI','Headache','Migraine','Ulcer','Nausea','Gassy','Trapped gas','Cold/flu','Allergies','Vomiting','none']},
    {key:'sensory_triggers', type:'multi', label:'Sensory triggers', options:['Body fat','Body size','Dirty / messy flat','Skin','Hair','Clothes','Outside environment','none']},
    {key:'appointments', type:'multi', label:'Appointments', options:['Psych','Therapy (online)','Therapy (in-person)','Doctor','Blood tests','none']},
    {key:'movement', type:'multi', label:'Did you move today?', options:['Tidying / cleaning','City walking','Stroll','Quick dog walk','Long dog walk','Hike','Jog','none']},
    {key:'talked_to_anyone', type:'multi', label:'Did you talk to anyone besides L today?', options:['none','General public','Health professional','Acquaintances','Friends','Friends of L','Family','none']},
    {key:'wellness', type:'multi', label:'Did you do any wellness stuff?', options:['Shakti mat','Stretching','Moments of mindfulness','Meditation','Therapy notes','Deep breathing','none']},
    {key:'creative', type:'multi', label:'Did you do anything creative?', options:['Painting','DIY','Guitar','Sewing','Van stuff','Reading', 'none']},
    {key:'closed_eyes_time', type:'time', label:'What time did you close your eyes?', autoNext:true},
  ];

  // ===== STORAGE =====
  const STORAGE_KEY = 'dailyTracker_v5';
  function todayKey(){ return new Date().toISOString().slice(0,10); }
  function loadAll(){ try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch(e){ return {}; } }
  function saveAll(obj){ localStorage.setItem(STORAGE_KEY, JSON.stringify(obj)); }

  // ===== UI REFS =====
  const contentArea = document.getElementById('contentArea');
  const progressBar = document.getElementById('progressBar');
  const progText = document.getElementById('progText');
  const backBtn = document.getElementById('backBtn');
  const nextBtn = document.getElementById('nextBtn');
  const morningBtn = document.getElementById('morningBtn');
  const nightBtn = document.getElementById('nightBtn');
  const btnEntries = document.getElementById('btnEntries');
  const btnExport = document.getElementById('btnExport');
  const btnSettingsEl = document.getElementById('btnSettings');
  const settingsMenu = document.getElementById('settingsMenu');
  const btnClearToday = document.getElementById('btnClearToday');
  const btnRestart = document.getElementById('btnRestart'); // optional

  let session = null;
  let list = null;
  let index = 0;
  let answers = {};
  let currentDate = todayKey();

  // ===== SETTINGS MENU =====
  if (btnSettingsEl) btnSettingsEl.addEventListener('click', e => {
    e.stopPropagation();
    settingsMenu.classList.toggle('show');
  });
  document.addEventListener('click', e => {
    if (!settingsMenu.contains(e.target) && !btnSettingsEl.contains(e.target)) settingsMenu.classList.remove('show');
  });

  // ===== BUTTONS =====
  if (morningBtn) morningBtn.addEventListener('click', ()=> startManual('morning'));
  if (nightBtn) nightBtn.addEventListener('click', ()=> startManual('night'));
  if (backBtn) backBtn.addEventListener('click', ()=>{ if(index>0){ index--; loadUI(); } });
  if (nextBtn) nextBtn.addEventListener('click', handleNext);
  if (btnEntries) btnEntries.addEventListener('click', ()=>{ settingsMenu.classList.remove('show'); showEntriesView(); });
  if (btnExport) btnExport.addEventListener('click', ()=>{ settingsMenu.classList.remove('show'); exportAll(); });
  if (btnClearToday) btnClearToday.addEventListener('click', clearToday);
  if (btnRestart) btnRestart.addEventListener('click', startNextDay);

  // ===== INIT =====
  function init(){
    const all = loadAll();
    const today = all[currentDate] || {};
    if(!today.morning){ startSession('morning'); }
    else if(!today.night){ startSession('night'); }
    else { session = null; showOverview(currentDate); }
  }

  function startManual(which){ startSession(which); }

  function startSession(which){
    session = which;
    list = (session === 'morning') ? MORNING : NIGHT;
    document.body.classList.remove('morning','night');
    document.body.classList.add(session);

    const all = loadAll();
    const today = all[currentDate] || {};
    answers = today[session] ? JSON.parse(JSON.stringify(today[session])) : {};
    index = 0;
    for(let i=0;i<list.length;i++){
      if(!(list[i].key in answers)){
        index=i;
        break;
      }
    }
    loadUI();
  }

  // ===== UI FUNCTIONS =====
  function loadUI() {
    if (!list || index >= list.length) {
      saveSession();
      if (session === 'morning') {
        contentArea.innerHTML = `<div class="done-note">Morning complete!</div>`;
        progressBar.style.width = '0';
        progText.textContent = '';
        document.getElementById('controls').style.display = 'none';
        setTimeout(() => startSession('night'), 1500);
      } else {
        session = null;
        showOverview(currentDate);
      }
      return;
    }
    
    const q = list[index];
    contentArea.innerHTML = '';
    const qEl = document.createElement('div');
    qEl.className = 'question';
    qEl.textContent = q.label;
    contentArea.appendChild(qEl);

    const optionsWrap = document.createElement('div');
    optionsWrap.className = 'options';

    if (q.type === 'single' || q.type === 'multi') {
      q.options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn';
const iconSrc = getIconForOption(opt);
btn.innerHTML = iconSrc
  ? `<img src="${iconSrc}" alt="${opt}" class="opt-icon"><span class="opt-text">${opt}</span>`
  : `<span class="opt-text">${opt}</span>`;


function getIconForOption(opt) {
  // Map known options to specific files, or auto-generate filenames
  const icons = {
    'UTI feeling': 'icons/bladder1.svg',
    'UTI': 'icons/bladder2.svg',
    'Headache': 'icons/head (1).svg',
    'Migraine': 'icons/headache.svg',
    'Ulcer': 'icons/mouth.svg',    
    'Nausea': 'icons/sick.svg',   
    'Gassy': 'icons/FHIR-logo.svg',
    'Trapped gas': 'icons/stomach.svg',
    'Cold/flu': 'icons/cold-chain.svg',   
    'Allergies': 'icons/flower.svg',
    'Vomiting': 'icons/vomiting.svg',
    '1mg benzo': 'icons/loraz1.svg',
    '2mg benzo': 'icons/loraz2.svg',
    '3mg benzo': 'icons/loraz3.svg',
    'Painkillers': 'icons/ibu.svg',
    'Antisickness': 'icons/stomach.svg',
    'Antihistamine': 'icons/flower.svg',
    'D-Mannose': 'icons/bladder2.svg',
    'Antibiotic' : 'icons/bacteria.svg',
  };
 return icons[opt] || null; // ⬅️ no icon means null, not auto-generated filename
}
  // If no match found, try a filename based on the option text
  if (!icons[opt]) {
    const fileName = opt
      .toLowerCase()
      .replace(/\s+/g, '_')
      .replace(/[^\w-]/g, '');
    icons[opt] = `icons/${fileName}.svg`;
  }

  return icons[opt];
}

        if (q.type === 'multi' && answers[q.key] && answers[q.key].includes(opt)) btn.classList.add('selected');
        if (q.type === 'single' && answers[q.key] === opt) btn.classList.add('selected');

        btn.addEventListener('click', () => {
          if (q.type === 'single') {
            answers[q.key] = opt;
            nextBtn.disabled = false;
            if (q.autoNext) handleNext();
            else loadUI();
          } else {
            if (!answers[q.key]) answers[q.key] = [];
            if (answers[q.key].includes(opt)) answers[q.key] = answers[q.key].filter(x => x !== opt);
            else answers[q.key].push(opt);
            btn.classList.toggle('selected');
            nextBtn.disabled = answers[q.key].length === 0;
          }
        });

        optionsWrap.appendChild(btn);
      });
    } else if (q.type === 'time' || q.type === 'number') {
      const inp = document.createElement('input');
      inp.type = q.type;
      inp.value = answers[q.key] || '';
      inp.addEventListener('input', () => { answers[q.key] = inp.value; nextBtn.disabled = !inp.value; });
      optionsWrap.appendChild(inp);
    } else if (q.type === 'auto') {
      const span = document.createElement('span');
      span.textContent = answers[q.key] || 'Auto-filled';
      optionsWrap.appendChild(span);
      nextBtn.disabled = false;
    }
    contentArea.appendChild(optionsWrap);

    const progress = ((index + 1) / list.length) * 100;
    progressBar.style.width = progress + '%';
    progText.textContent = '';

    backBtn.style.display = (index === 0) ? 'none' : 'inline-flex';
    nextBtn.disabled = !(answers[q.key] && ((q.type === 'single')||(q.type==='time')||(q.type==='number')||(q.type==='auto')||(q.type==='multi')));
    document.getElementById('controls').style.display = 'flex';
  }

  function handleNext() {
    const q = list[index];
    if (!answers[q.key]) return;
    index++;
    loadUI();
  }

  function saveSession() {
    const all = loadAll();
    if (!all[currentDate]) all[currentDate] = {};
    all[currentDate][session] = answers;
    saveAll(all);
  }

  function showOverview(date) {
    session = null;
    const dayName = new Date(date).toLocaleDateString('en-US', { weekday: 'long' });
    contentArea.innerHTML = `<div class="done-note">${dayName} complete.</div>`;
    progressBar.style.width = '0';
    progText.textContent = '';
    document.getElementById('controls').style.display = 'none';
  }

  function showEntriesView() {
    const all = loadAll();
    contentArea.innerHTML = '<div class="entries-list"></div>';
    const listWrap = contentArea.querySelector('.entries-list');
    Object.keys(all).sort().reverse().forEach(day => {
      const row = document.createElement('div');
      row.className = 'entry-row';
      row.innerHTML = `<div>${day}</div><div class="small">morning:${all[day].morning ? Object.keys(all[day].morning).length : 0} | night:${all[day].night ? Object.keys(all[day].night).length : 0}</div>`;
      listWrap.appendChild(row);
    });
  }

  function exportAll() {
    const all = loadAll();
    const blob = new Blob([JSON.stringify(all, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'daily-tracker-data.json';
    a.click();
    URL.revokeObjectURL(url);
  }

  function startNextDay() {
    currentDate = todayKey();
    session = null;
    startSession('morning');
  }

  function clearToday() {
    if(confirm("Are you sure you want to clear all answers for today?")) {
      const all = loadAll();
      delete all[currentDate];
      saveAll(all);
      session = null;
      index = 0;
      answers = {};
      progressBar.style.width = '0%';
      progText.textContent = '';
      document.getElementById('controls').style.display = 'none';
      settingsMenu.classList.remove('show');
      contentArea.innerHTML = `<div class="done-note fade-out">Today's data cleared.</div>`;
      setTimeout(() => { 
        const msg = contentArea.querySelector('.done-note'); 
        if(msg) msg.style.opacity = '0'; 
      }, 50);
      setTimeout(() => { startSession('morning'); document.getElementById('controls').style.display = 'flex'; }, 2000);
    }
  }

  // ===== INITIALIZE APP =====
  init();

  // Optional: service worker
  // if ('serviceWorker' in navigator) {
  //   navigator.serviceWorker.register('service-worker.js')
  //     .then(() => console.log('Service Worker registered.'))
  //     .catch(err => console.error('Service Worker registration failed:', err));
  // }

});
</script>
</body>
</html>
