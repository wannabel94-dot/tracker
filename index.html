<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Daily Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --morning-text:#3b1b10;
  --night-text:#f0f4ff;
  --card-radius:14px;
  font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial;
}
* { box-sizing:border-box; }
html, body { height:100%; margin:0; padding:18px; display:flex; justify-content:center; align-items:flex-start; min-height:100vh; transition: background 0.5s, color 0.5s; }
input[type="time"] { width:100%; padding:12px 16px; font-size:18px; border-radius:12px; border:1px solid rgba(255,255,255,0.3); background:rgba(255,255,255,0.08); color:#fff; backdrop-filter:blur(6px); transition:0.2s; }
input[type="time"]:focus { outline:none; border:1px solid rgba(255,255,255,0.6); background:rgba(255,255,255,0.12); }

/* Layout */
.wrap { width:100%; max-width:740px; }
header { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
.top-switch { display:flex; gap:8px; margin-bottom:12px; }
.switch-btn { flex:1; padding:10px; border:none; border-radius:10px; background:transparent; cursor:pointer; display:flex; justify-content:center; align-items:center; transition:0.25s; }
.switch-btn img { filter:invert(1); opacity:0.5; width:24px; height:24px; transition:0.25s; }
.switch-btn:hover { background:rgba(255,255,255,0.08); border-radius:50%; }
body.morning .switch-btn.morning img, body.night .switch-btn.night img { opacity:1; transform:scale(1.15); }

#btnSettings { font-size:22px; padding:6px 10px; line-height:1; background:transparent; border:none; color:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center; margin-top:-10px; }
.settings-menu { position:absolute; top:42px; right:0; background:rgba(255,255,255,0.25); backdrop-filter:blur(16px); border-radius:12px; display:none; flex-direction:column; padding:6px; min-width:150px; }
.settings-menu.show { display:flex; }
.settings-menu button { background:transparent; border:none; padding:10px 16px; width:100%; text-align:left; cursor:pointer; font-weight:600; }
.settings-menu button:hover { background:rgba(0,0,0,0.05); }

main.card { padding:18px; min-height:520px; }
.progress-wrap { display:flex; align-items:center; margin-bottom:12px; }
.progress { flex:1; height:10px; border-radius:8px; overflow:hidden; background:rgba(255,255,255,0.06); }
.bar { height:100%; width:0%; background:linear-gradient(90deg, rgba(255,255,255,0.15), rgba(255,255,255,0.3)); border-radius:8px; transition:0.25s; }

.question { font-size:18px; margin-bottom:12px; font-weight:600; }
.options { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.opt-btn { display:flex; align-items:center; justify-content:center; padding:14px 16px; border-radius:12px; border:1px solid transparent; font-size:18px; cursor:pointer; backdrop-filter:blur(6px); transition:0.2s; }
.opt-btn.selected { background:rgba(255,255,255,0.6); color:#000; font-weight:700; }

.counter-item { display:flex; justify-content:space-between; align-items:center; padding:6px 10px; border:1px solid rgba(255,255,255,0.2); border-radius:10px; margin-bottom:6px; }
.counter-controls { display:flex; gap:6px; align-items:center; }

.controls { display:flex; gap:10px; justify-content:space-between; margin-top:16px; }
.back-btn, .next-btn { background: rgba(255,255,255,0.15); color:#fff; font-weight:700; border:0; padding:12px 16px; border-radius:12px; cursor:pointer; backdrop-filter:blur(6px); transition:0.2s; }
.back-btn:hover, .next-btn:hover { opacity:0.85; }
.back-btn[disabled], .next-btn[disabled] { opacity:0.5; cursor:not-allowed; }

.done-note { font-size:20px; text-align:center; font-weight:700; margin-top:18px; }
body.night { color:#fff; background:url("https://i.pinimg.com/1200x/6c/d7/2d/6cd72d1678453c8f4d7c4afa59a617e3.jpg") center/cover no-repeat; }
body.morning { color:#fff; background:url("images/morning.jpg") center/cover no-repeat; }

@media (max-width:480px) { body{padding:12px;} .opt-btn,input[type=time]{font-size:16px;padding:12px;} }
</style>
</head>
<body class="night">
<div class="wrap">
  <header>
    <div class="top-switch">
      <button class="switch-btn morning" id="morningBtn"><img src="icons/day.svg" alt="Morning"></button>
      <button class="switch-btn night" id="nightBtn"><img src="icons/night.svg" alt="Night"></button>
    </div>
    <button id="btnSettings">⋮</button>
    <div id="settingsMenu" class="settings-menu">
      <button id="btnEntries">History</button>
      <button id="btnExport">Export data</button>
      <button id="btnClearToday">Clear Today's Data</button>
    </div>
  </header>

  <main class="card">
    <div class="progress-wrap">
      <div class="progress"><div class="bar" id="progressBar"></div></div>
    </div>
    <div id="contentArea"></div>
    <div class="controls">
      <button class="back-btn" id="backBtn">Back</button>
      <button class="next-btn" id="nextBtn">Next</button>
    </div>
  </main>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const MORNING = [
    {key:'wake_time', type:'time', label:'What time did you wake up?'},
    {key:'how_slept', type:'single', label:'How do you think you slept?', options:['Went to bed late but slept in','Went to bed late but woke early','Went to bed early but woke really early',"Couldn't fall asleep",'Lightly disrupted','Frequently disrupted','Fine'], autoNext:true},
    {key:'made_bed', type:'single', label:'Make bed?', options:['Yes','No'], autoNext:true},
    {key:'took_meds_morn', type:'single', label:'Take meds?', options:['Yes','No'], autoNext:true},
    {key:'tidy_up', type:'single', label:'Tidy up?', options:['Yes','No'], autoNext:true},
    {key:'tea_meditate', type:'single', label:'Have tea in bed + meditate 5 mins?', options:['Yes','No'], autoNext:true},
    {key:'shower_morn', type:'single', label:'Shower?', options:['Yes','No'], autoNext:true},
    {key:'led_mask_morn', type:'single', label:'LED mask?', options:['Yes','No'], autoNext:true},
    {key:'skincare_morn', type:'single', label:'Skincare?', options:['Yes','No'], autoNext:true},
    {key:'eat_breakfast', type:'single', label:'Eat breakfast?', options:['Yes','No'], autoNext:true},
    {key:'supplements_morn', type:'single', label:'Supplements?', options:['Yes','No'], autoNext:true},
    {key:'get_dressed', type:'single', label:'Get dressed?', options:['Yes','No'], autoNext:true},
    {key:'brush_teeth_morn', type:'single', label:'Brush teeth?', options:['Yes','No'], autoNext:true}
  ];

  const NIGHT = [
    {key:'psyillium', type:'single', label:'Did you take psyllium?', options:['Yes','No'], autoNext:true},
    {key:'magnesium', type:'single', label:'Magnesium?', options:['Yes','No'], autoNext:true},
    {key:'pillowcase', type:'single', label:'Did you change the pillowcase?', options:['Yes','No'], autoNext:true},
    {key:'shower_night', type:'single', label:'Shower?', options:['Yes','No'], autoNext:true},
    {key:'skincare_night', type:'single', label:'Skincare?', options:['None','Bare minimum','Once','Twice'], autoNext:true},
    {key:'teeth_night', type:'single', label:'Teeth?', options:['Once','Twice','None'], autoNext:true},
    {key:'flossed', type:'single', label:'Flossed?', options:['Once','Twice','None'], autoNext:true},
    {key:'left_house', type:'single', label:'Did you leave the house?', options:['Nope','Seconds','Briefly','1h+','2h+','Fair amount','All day'], autoNext:true},
    {key:'day_description', type:'single', label:'How would you best describe the day?', options:['Bedrot','Mostly wasted','Chilled','Somewhat productive','Hyperproductive','Busy','Good'], autoNext:true},
    {key:'caffeine_alcohol', type:'multi', label:'Caffeine / alcohol', options:['Coffee','Tea','Beer','Spirits','Wine']}
  ];

  let currentIndex = 0;
  let answers = {};

  const contentArea = document.getElementById('contentArea');
  const backBtn = document.getElementById('backBtn');
  const nextBtn = document.getElementById('nextBtn');
  const progressBar = document.getElementById('progressBar');

  const getQuestions = () => document.body.classList.contains('morning') ? MORNING : NIGHT;

  function updateCounter(opt, delta) {
    if (!answers['caffeine_alcohol']) answers['caffeine_alcohol'] = {};
    let val = answers['caffeine_alcohol'][opt] || 0;
    val += delta; if(val<0) val=0;
    answers['caffeine_alcohol'][opt] = val;
    document.getElementById(`count-${opt}`).textContent = val;
  }

  function loadUI() {
    const questions = getQuestions();
    if(currentIndex>=questions.length){
      contentArea.innerHTML='<div class="done-note">All done for today!</div>';
      backBtn.style.display='none';
      nextBtn.style.display='none';
      progressBar.style.width='100%';
      return;
    }

    const q = questions[currentIndex];
    let html = `<div class="question">${q.label}</div><div class="options">`;

    if(q.type==='single'){
      q.options.forEach(opt=>html+=`<button class="opt-btn" onclick="selectOption('${opt}')">${opt}</button>`);
    } else if(q.type==='multi' && q.key==='caffeine_alcohol'){
      q.options.forEach(opt=>{
        html+=`<div class="counter-item"><span>${opt}</span><div class="counter-controls">
        <button type="button" onclick="updateCounter('${opt}',-1)">−</button>
        <span id="count-${opt}">${(answers[q.key]&&answers[q.key][opt])||0}</span>
        <button type="button" onclick="updateCounter('${opt}',1)">+</button>
        </div></div>`;
      });
      nextBtn.disabled=false;
    } else if(q.type==='time'){
      html+=`<input type="time" value="${answers[q.key]||''}" onchange="selectOption(this.value)"/>`;
    }

    html+='</div>';
    contentArea.innerHTML=html;
    progressBar.style.width=((currentIndex)/questions.length*100)+'%';
  }

  window.selectOption = opt => {
    const q = getQuestions()[currentIndex];
    answers[q.key]=opt;
    if(q.autoNext){ currentIndex++; loadUI(); }
  }

  backBtn.onclick = ()=>{if(currentIndex>0){currentIndex--; loadUI();}}
  nextBtn.onclick = ()=>{
    const q = getQuestions()[currentIndex];
    if(q.type==='multi' && q.key==='caffeine_alcohol'){
      q.options.forEach(opt=>{
        const el=document.getElementById(`count-${opt}`);
        answers[q.key][opt]=el?parseInt(el.textContent):0;
      });
    } else if(q.type!=='multi' && q.type!=='time' && !answers[q.key]) { alert('Please select an option.'); return; }
    currentIndex++; loadUI();
  }

  document.getElementById('morningBtn').onclick=()=>{document.body.classList.add('morning'); document.body.classList.remove('night'); currentIndex=0; answers={}; loadUI();}
  document.getElementById('nightBtn').onclick=()=>{document.body.classList.add('night'); document.body.classList.remove('morning'); currentIndex=0; answers={}; loadUI();}

  document.getElementById('btnSettings').onclick=()=>{document.getElementById('settingsMenu').classList.toggle('show');}

  loadUI();
});
</script>
</body>
</html>
