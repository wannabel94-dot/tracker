<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checklist</title>
<style>
  body { font-family: sans-serif; padding: 20px; margin: 0; }
  header, footer { background: #333; color: white; padding: 10px; text-align: center; }
  main { padding: 20px; }

  table { width: 100%; border-collapse: collapse; margin-top: 20px; }
  th, td { padding: 8px 12px; border: 1px solid #ccc; text-align: center; }

  /* Highlight edited row */
  .checklist-item-editing {
    background: rgba(255,255,0,0.3);
    pointer-events: auto;
    transform: scale(1.03);
    transition: 0.3s;
  }

  /* Dim other rows */
  .checklist-item-dimmed {
    opacity: 0.3;
    pointer-events: none;
    transition: 0.3s;
  }

  .date-cell { cursor: pointer; user-select: none; }
  .yes-no-cell { cursor: pointer; }
</style>
</head>
<body>

<header>
  <h1>My Checklist App</h1>
</header>

<main>
  <h2>Checklist</h2>
  <table id="checklist">
    <thead>
      <tr>
        <th>Date</th>
        <th>Morning</th>
        <th>Night</th>
      </tr>
    </thead>
    <tbody>
      <tr class="check-item">
        <td class="date-cell" data-key="2025-11-25">2025-11-25</td>
        <td class="yes-no-cell" data-key="2025-11-25" data-time="morning">No</td>
        <td class="yes-no-cell" data-key="2025-11-25" data-time="night">Yes</td>
      </tr>
      <tr class="check-item">
        <td class="date-cell" data-key="2025-11-26">2025-11-26</td>
        <td class="yes-no-cell" data-key="2025-11-26" data-time="morning">No</td>
        <td class="yes-no-cell" data-key="2025-11-26" data-time="night">No</td>
      </tr>
    </tbody>
  </table>
</main>

<footer>
  <p>© 2025 Checklist Inc.</p>
</footer>

<script>
let longPressTimer;
let editingRow = null;

// Enable edit mode
function enableEditMode(rowElement) {
    document.querySelectorAll('.check-item').forEach(item => {
        item.classList.add('checklist-item-dimmed');
        item.classList.remove('checklist-item-editing');
    });
    rowElement.classList.remove('checklist-item-dimmed');
    rowElement.classList.add('checklist-item-editing');
    editingRow = rowElement;
}

// Attach long press to date cells
function attachLongPress(dateCell) {
    dateCell.addEventListener('mousedown', startPress);
    dateCell.addEventListener('touchstart', startPress);
    dateCell.addEventListener('mouseup', cancelPress);
    dateCell.addEventListener('mouseleave', cancelPress);
    dateCell.addEventListener('touchend', cancelPress);

    function startPress() {
        longPressTimer = setTimeout(() => {
            enableEditMode(dateCell.parentElement);
        }, 600); // long press threshold
    }

    function cancelPress() {
        clearTimeout(longPressTimer);
    }
}

// Toggle Yes/No cell
function toggleYesNo(cell) {
    if (!editingRow || !editingRow.contains(cell)) return; // only active row
    cell.textContent = cell.textContent === 'Yes' ? 'No' : 'Yes';
}

// Attach events
document.querySelectorAll('.date-cell').forEach(cell => attachLongPress(cell));
document.querySelectorAll('.yes-no-cell').forEach(cell => {
    cell.addEventListener('click', () => toggleYesNo(cell));
});
</script>

</body>
</html>
