<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daily Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root { --morning-text:#3b1b10; --night-text:#f0f4ff; --card-radius:14px; font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial; }
* { box-sizing:border-box; }
html, body { height:100%; margin:0; }
body { margin:0; padding:18px; display:flex; justify-content:center; align-items:flex-start; min-height:100vh; transition: background 0.5s, color 0.5s; }

/* Time input */
input[type="time"] { width:100%; padding:12px 16px; font-size:18px; border-radius:12px; border:1px solid rgba(255,255,255,0.3); background:rgba(255,255,255,0.08); color:#fff; font-family:inherit; backdrop-filter:blur(6px); transition:background 0.2s, border 0.2s; }
input[type="time"]:focus { outline:none; border:1px solid rgba(255,255,255,0.6); background:rgba(255,255,255,0.12); }

/* Layout */
.wrap { width:100%; max-width:740px; }
header { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
.top-switch { display:flex; gap:8px; }
.switch-btn { padding:10px; border:none; border-radius:10px; background:transparent; cursor:pointer; display:flex; justify-content:center; align-items:center; transition:background 0.25s; }
.switch-btn img { width:28px; height:28px; filter:invert(1); opacity:0.5; transform:scale(1); transition:opacity 0.25s, transform 0.25s, filter 0.25s; }
.switch-btn:hover { background: rgba(255,255,255,0.08); border-radius:50%; }
body.morning .switch-btn.morning img { opacity:1; transform:scale(1.15); }
body.night .switch-btn.night img { opacity:1; transform:scale(1.15); }

/* Settings */
#btnSettings { font-size:22px; padding:6px 10px; background:transparent; border:none; color:#fff; cursor:pointer; }
#btnSettings:hover { opacity:0.8; }
.settings-menu { position:absolute; top:42px; right:0; background:rgba(255,255,255,0.25); backdrop-filter:blur(16px); border-radius:12px; flex-direction:column; padding:6px; z-index:20; display:none; min-width:150px; }
.settings-menu.show { display:flex; }
.settings-menu button { background:transparent; border:none; padding:10px 16px; width:100%; text-align:left; cursor:pointer; font-weight:600; }
.settings-menu button:hover { background:rgba(0,0,0,0.05); }

/* Card + questions */
main.card { padding:18px; border-radius:var(--card-radius); min-height:520px; }
.progress-wrap { display:flex; align-items:center; gap:0; margin-bottom:12px; }
.progress { flex:1.2; height:10px; border-radius:8px; overflow:hidden; background:rgba(255,255,255,0.06); }
.bar { height:100%; width:0%; background:linear-gradient(90deg,rgba(255,255,255,0.15),rgba(255,255,255,0.3)); border-radius:8px; transition:width 0.25s; }
.question { font-size:18px; margin-bottom:12px; font-weight:600; }
.options { display:grid; grid-template-columns:1fr 1fr; gap:10px; }

/* Option buttons */
.opt-btn {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px 18px;
  border-radius: 16px;
  border: 1px solid transparent;
  font-size: 18px;
  font-weight: 600;
  cursor: pointer;
  transition: transform 0.2s, background 0.3s, box-shadow 0.3s, border 0.3s, color 0.3s;
  backdrop-filter: blur(6px);
  box-shadow: 0 4px 6px rgba(0,0,0,0.1);
  text-align: center;
  user-select: none;
}
.opt-btn:hover {
  transform: scale(1.03);
  box-shadow: 0 6px 10px rgba(0,0,0,0.15);
}

/* Morning / Night backgrounds */
body.morning .opt-btn { background: rgba(255,255,255,0.12); color: #fff; }
body.morning .opt-btn:hover { background: rgba(255,255,255,0.25); }
body.night .opt-btn { background: rgba(255,255,255,0.08); color: var(--night-text); }
body.night .opt-btn:hover { background: rgba(255,255,255,0.18); }

/* Small screens */
@media (max-width:480px){
  .opt-btn { font-size:16px; padding:14px 16px; }
}

/* Drinks counter */
.counter-item { display:flex; justify-content:space-between; align-items:center; padding:10px 14px; border-radius:12px; margin-bottom:8px; background:rgba(255,255,255,0.1); backdrop-filter:blur(8px); border:1px solid rgba(255,255,255,0.15); transition:background 0.3s,border 0.3s; }
body.night .counter-item { background: rgba(0,0,0,0.3); border:1px solid rgba(255,255,255,0.2); }
body.morning .counter-item { background: rgba(255,255,255,0.15); border:1px solid rgba(255,255,255,0.25); }
.counter-controls { display:flex; gap:6px; align-items:center; }
.counter-controls button { background: rgba(255,255,255,0.2); border:none; color:#fff; font-size:18px; padding:4px 10px; border-radius:8px; cursor:pointer; transition:background 0.2s; }
.counter-controls button:hover { background: rgba(255,255,255,0.35); }
body.night .counter-controls button { background: rgba(255,255,255,0.15); }
body.night .counter-controls button:hover { background: rgba(255,255,255,0.3); }

/* Navigation buttons */
.controls { display:flex; gap:10px; justify-content:space-between; margin-top:16px; }
.back-btn, .next-btn { background: rgba(255,255,255,0.15); color:#fff; font-weight:700; border:0; padding:12px 16px; border-radius:12px; cursor:pointer; backdrop-filter:blur(6px); transition:opacity 0.2s; }
.back-btn:hover, .next-btn:hover { opacity:0.85; }
.back-btn[disabled], .next-btn[disabled] { opacity:0.5; cursor:not-allowed; }

.done-note { font-size:20px; text-align:center; font-weight:700; margin-top:18px; }

/* Backgrounds */
body.night { color:#fff; }
body.night::before { content:""; position:fixed; inset:0; z-index:-1; background:url("https://i.pinimg.com/1200x/6c/d7/2d/6cd72d1678453c8f4d7c4afa59a617e3.jpg") center/cover no-repeat; }
body.morning { color:#fff; }
body.morning::before { content:""; position:fixed; inset:0; z-index:-1; background:url("images/morning.jpg") center/cover no-repeat; }

/* ---------- HISTORY MODAL ---------- */
.history-modal {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.55);
  backdrop-filter: blur(10px);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 100;
  animation: fadeIn 0.3s ease forwards;
}
.history-modal.show { display: flex; }
.history-content {
  background: rgba(255, 255, 255, 0.12);
  backdrop-filter: blur(18px);
  color: #fff;
  border-radius: 18px;
  width: 90%;
  max-width: 600px;
  max-height: 80vh;
  overflow-y: auto;
  padding: 24px;
  position: relative;
  box-shadow: 0 8px 20px rgba(0,0,0,0.25);
  animation: slideUp 0.3s ease forwards;
}
.history-content h3 { margin-top: 16px; font-weight: 700; font-size: 20px; }
.close-history {
  position: absolute;
  top: 8px;
  right: 12px;
  background: rgba(255,255,255,0.15);
  border: none;
  border-radius: 50%;
  color: #fff;
  font-size: 22px;
  width: 34px;
  height: 34px;
  cursor: pointer;
  transition: background 0.2s;
}
.close-history:hover { background: rgba(255,255,255,0.3); }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

@media (max-width:480px) { body{padding:12px;} .opt-btn{font-size:16px;padding:12px;} input[type=time]{font-size:16px;padding:12px;} }
</style>
</head>
<body class="night">
<div class="wrap">
  <header>
    <div class="top-switch">
      <button class="switch-btn morning" id="morningBtn"><img src="icons/day.svg" alt="Morning"></button>
      <button class="switch-btn night" id="nightBtn"><img src="icons/night.svg" alt="Night"></button>
    </div>
    <button id="btnSettings">⋮</button>
    <div id="settingsMenu" class="settings-menu">
      <button id="btnEntries">History</button>
      <button id="btnExport">Export data</button>
      <button id="btnClearToday">Clear Today's Data</button>
    </div>
  </header>

  <main class="card">
    <div class="progress-wrap"><div class="progress"><div class="bar" id="progressBar"></div></div></div>
    <div id="contentArea"></div>
    <div class="controls">
      <button class="back-btn" id="backBtn">Back</button>
      <button class="next-btn" id="nextBtn">Next</button>
    </div>
  </main>
</div>

<!-- History Modal -->
<div id="historyModal" class="history-modal">
  <div class="history-content">
    <button class="close-history" id="closeHistory">×</button>
    <div id="historyInner"></div>
  </div>
</div>
<script>
document.addEventListener('DOMContentLoaded', ()=>{

  /* ---------- QUESTIONS ---------- */
  const MORNING = [
    {key:'wake_time', type:'time', label:'What time did you wake up?'},
    {key:'how_slept', type:'single', label:'How do you think you slept?', options:['Went to bed late but slept in','Went to bed late but woke early','Went to bed early but woke really early',"Couldn't fall asleep",'Lightly disrupted','Frequently disrupted','Fine'], autoNext:true},
    {key:'made_bed', type:'single', label:'Make bed?', options:['Yes','No'], autoNext:true},
    {key:'took_meds_morn', type:'single', label:'Take meds?', options:['Yes','No'], autoNext:true},
    {key:'tidy_up', type:'single', label:'Tidy up?', options:['Yes','No'], autoNext:true},
    {key:'tea_meditate', type:'single', label:'Have tea in bed + meditate 5 mins?', options:['Yes','No'], autoNext:true},
    {key:'shower_morn', type:'single', label:'Shower?', options:['Yes','No'], autoNext:true},
    {key:'led_mask_morn', type:'single', label:'LED mask?', options:['Yes','No'], autoNext:true},
    {key:'skincare_morn', type:'single', label:'Skincare?', options:['Yes','No'], autoNext:true},
    {key:'eat_breakfast', type:'single', label:'Eat breakfast?', options:['Yes','No'], autoNext:true},
    {key:'supplements_morn', type:'single', label:'Supplements?', options:['Yes','No'], autoNext:true},
    {key:'get_dressed', type:'single', label:'Get dressed?', options:['Yes','No'], autoNext:true},
    {key:'brush_teeth_morn', type:'single', label:'Brush teeth?', options:['Yes','No'], autoNext:true}
  ];

  const NIGHT = [
    {key:'psyillium', type:'single', label:'Did you take psyllium?', options:['Yes','No'], autoNext:true},
    {key:'magnesium', type:'single', label:'Magnesium?', options:['Yes','No'], autoNext:true},
    {key:'pillowcase', type:'single', label:'Did you change the pillowcase?', options:['Yes','No'], autoNext:true},
    {key:'shower_night', type:'single', label:'Shower?', options:['Yes','No'], autoNext:true},
    {key:'skincare_night', type:'single', label:'Skincare?', options:['None','Bare minimum','Once','Twice'], autoNext:true},
    {key:'teeth_night', type:'single', label:'Teeth?', options:['Once','Twice','None'], autoNext:true},
    {key:'flossed', type:'single', label:'Flossed?', options:['Once','Twice','None'], autoNext:true},
    {key:'left_house', type:'single', label:'Did you leave the house?', options:['Nope','Seconds','Briefly','1h+','2h+','Fair amount','All day'], autoNext:true},
    {key:'day_description', type:'single', label:'How would you best describe the day?', options:['Bedrot','Mostly wasted','Chilled','Somewhat productive','Hyperproductive','Busy','Good'], autoNext:true},
    {key:'caffeine_alcohol', type:'multi', label:'Caffeine / alcohol', options:['Coffee','Tea','Beer','Spirits','Wine']}
  ];

  /* ---------- STATE ---------- */
  let currentIndex=0;
  let answers={};
  let editingDate=null; // null = editing today

  const contentArea=document.getElementById('contentArea');
  const backBtn=document.getElementById('backBtn');
  const nextBtn=document.getElementById('nextBtn');
  const progressBar=document.getElementById('progressBar');
  const btnSettings=document.getElementById('btnSettings');
  const settingsMenu=document.getElementById('settingsMenu');
  const historyModal=document.getElementById('historyModal');
  const historyInner=document.getElementById('historyInner');
  const closeHistory=document.getElementById('closeHistory');

  const getQuestions=()=>document.body.classList.contains('morning')?MORNING:NIGHT;
  const getMode=()=>document.body.classList.contains('morning')?'morning':'night';

  /* ---------- COUNTER UPDATES ---------- */
  window.updateCounter=(opt,delta)=>{
    if(!answers['caffeine_alcohol']) answers['caffeine_alcohol']={};
    let val=answers['caffeine_alcohol'][opt]||0;
    val+=delta;if(val<0) val=0;
    answers['caffeine_alcohol'][opt]=val;
    const el=document.getElementById(`count-${opt}`);
    if(el) el.textContent=val;
  }

  /* ---------- LOAD / SAVE ---------- */
  function getTodayDate(){ 
    if(editingDate) return editingDate;
    const d=new Date(); 
    return d.toLocaleDateString('en-GB'); 
  }

  function loadSavedData(){
    const all=JSON.parse(localStorage.getItem('dailyTrackerData')||'{}');
    const day=getTodayDate();
    const mode=getMode();
    if(all[day] && all[day][mode]) answers=all[day][mode];
  }

  function saveData(){
    const all=JSON.parse(localStorage.getItem('dailyTrackerData')||'{}');
    const day=getTodayDate();
    const mode=getMode();
    if(!all[day]) all[day]={};
    all[day][mode]=answers;
    localStorage.setItem('dailyTrackerData',JSON.stringify(all));
  }

  window.addEventListener('beforeunload', saveData);
  nextBtn.addEventListener('click', saveData);
  backBtn.addEventListener('click', saveData);

  /* ---------- UI ---------- */
  function loadUI(){
    const questions=getQuestions();
    if(currentIndex>=questions.length){
      contentArea.innerHTML='<div class="done-note">All done for today!</div>';
      backBtn.style.display='none'; nextBtn.style.display='none';
      progressBar.style.width='100%';
      return;
    }
    const q=questions[currentIndex];
    let html=`<div class="question">${q.label}</div><div class="options">`;
    
    if(q.type==='single'){
      q.options.forEach(opt=>{
        const isSelected = answers[q.key]===opt ? 'selected' : '';
        html+=`<button class="opt-btn ${isSelected}" onclick="selectOption('${opt}')">${opt}</button>`;
      });
    } else if(q.type==='multi' && q.key==='caffeine_alcohol'){
      q.options.forEach(opt=>{
        html+=`<div class="counter-item"><span>${opt}</span>
        <div class="counter-controls">
        <button type="button" onclick="updateCounter('${opt}',-1)">−</button>
        <span id="count-${opt}">${(answers[q.key]&&answers[q.key][opt])||0}</span>
        <button type="button" onclick="updateCounter('${opt}',1)">+</button>
        </div></div>`;
      });
      nextBtn.disabled=false;
    } else if(q.type==='time'){
      html+=`<input type="time" value="${answers[q.key]||''}" onchange="selectOption(this.value)"/>`;
    }

    html+='</div>';
    contentArea.innerHTML=html;
    progressBar.style.width=((currentIndex)/questions.length*100)+'%';
    backBtn.style.display=(currentIndex>0)?'inline-block':'none';
    nextBtn.style.display='inline-block';
  }

  /* ---------- SELECT OPTION ---------- */
  window.selectOption = opt => {
    const q = getQuestions()[currentIndex];
    answers[q.key] = opt;
    loadUI(); // refresh to apply selected style
    if(q.autoNext){ 
      currentIndex++; 
      loadUI(); 
    }
  };

  backBtn.onclick=()=>{if(currentIndex>0){currentIndex--; loadUI();}};
  nextBtn.onclick=()=>{
    const q=getQuestions()[currentIndex];
    if(q.type==='multi' && q.key==='caffeine_alcohol'){
      if(Object.values(answers[q.key]||{}).every(v=>v===0)){
        if(!confirm('Save with no caffeine/alcohol?')) return;
      }
    }
    currentIndex++; loadUI();
  };

  /* ---------- SETTINGS ---------- */
  btnSettings.onclick=e=>{
    e.stopPropagation();
    settingsMenu.classList.toggle('show');
  };
  document.addEventListener('click',e=>{
    if(!settingsMenu.contains(e.target)&&e.target!==btnSettings) settingsMenu.classList.remove('show');
  });

  document.getElementById('morningBtn').onclick=()=>{
    saveData(); 
    document.body.classList.add('morning'); 
    document.body.classList.remove('night'); 
    currentIndex=0; answers={}; editingDate=null; 
    loadSavedData(); loadUI();
  };
  document.getElementById('nightBtn').onclick=()=>{
    saveData(); 
    document.body.classList.add('night'); 
    document.body.classList.remove('morning'); 
    currentIndex=0; answers={}; editingDate=null;
    loadSavedData(); loadUI();
  };

  document.getElementById('btnClearToday').onclick=()=>{
    const all=JSON.parse(localStorage.getItem('dailyTrackerData')||'{}');
    const day=getTodayDate();
    delete all[day];
    localStorage.setItem('dailyTrackerData',JSON.stringify(all));
    answers={}; currentIndex=0; loadUI();
    editingDate=null;
    alert("Today's data cleared.");
  };

  /* ---------- HISTORY ---------- */
  closeHistory.onclick=()=>historyModal.classList.remove('show');

  document.getElementById('btnEntries').onclick=()=>{
    const all=JSON.parse(localStorage.getItem('dailyTrackerData')||'{}');
    if(Object.keys(all).length===0){alert("No history yet."); return;}
    let html=`<div class="question">📅 Daily History</div>`;
    const dates=Object.keys(all).sort((a,b)=>{
      const [da,ma,ya]=a.split('/').map(Number);
      const [db,mb,yb]=b.split('/').map(Number);
      return new Date(yb,mb-1,db)-new Date(ya,ma-1,da);
    });
    for(const date of dates){
      html+=`<div class="counter-item" style="cursor:pointer;" onclick="showHistoryEntry('${date}')">${date}</div>`;
    }
    historyInner.innerHTML=html;
    historyModal.classList.add('show');
    settingsMenu.classList.remove('show');
  };

  /* ---------- EDIT & DELETE ---------- */
  window.showHistoryEntry = (date)=>{
    const all=JSON.parse(localStorage.getItem('dailyTrackerData')||'{}');
    const d=all[date]; if(!d) return;
    let html=`<div class="question">🗓 ${date}</div>`;
    const render=(title,data)=>{
      if(!data||Object.keys(data).length===0) return '';
      let s=`<h3>${title}</h3>`;
      for(const [k,v] of Object.entries(data)){
        if(typeof v==='object'){ s+=`<div class="counter-item"><strong>${k}</strong>: ${Object.entries(v).map(([drink,c])=>`${drink} × ${c}`).join(', ')}</div>`; }
        else{ s+=`<div class="counter-item"><strong>${k}</strong>: ${v}</div>`; }
      }
      return s;
    };
    html+=render('☀️ Morning', d.morning);
    html+=render('🌙 Night', d.night);
    html+=`
      <div class="controls" style="margin-top:18px; gap:8px;">
        <button class="back-btn" onclick="document.getElementById('btnEntries').onclick()">Back</button>
        <button class="next-btn" onclick="editPastDay('${date}')">Edit</button>
        <button class="next-btn" style="background:rgba(255,0,0,0.25);" onclick="deletePastDay('${date}')">Delete</button>
      </div>
    `;
    historyInner.innerHTML=html;
    historyModal.classList.add('show');
    settingsMenu.classList.remove('show');
  };

  window.editPastDay=(date)=>{
    const all=JSON.parse(localStorage.getItem('dailyTrackerData')||'{}');
    const dayData=all[date];
    if(!dayData) return alert("No data for that day.");
    editingDate=date;
    document.body.classList.add('morning'); 
    document.body.classList.remove('night');
    answers=dayData.morning||{};
    currentIndex=0;
    historyModal.classList.remove('show');
    loadUI();
    alert(`Editing ${date}. Changes will overwrite that day's data.`);
  };

  window.deletePastDay=(date)=>{
    if(!confirm(`Delete entry for ${date}? This cannot be undone.`)) return;
    const all=JSON.parse(localStorage.getItem('dailyTrackerData')||'{}');
    delete all[date];
    localStorage.setItem('dailyTrackerData',JSON.stringify(all));
    alert(`Deleted entry for ${date}.`);
    document.getElementById('btnEntries').onclick();
  };

  /* ---------- INIT ---------- */
  loadSavedData();
  loadUI();

});
</script>
</body>
</html>
