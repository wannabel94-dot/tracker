<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#07081d" id="navColor">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daily Tracker - Home</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; }

body {
  margin: 0;
  padding: 0;
  min-height: 100vh;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  color: #fff;
}

.container {
  max-width: 500px;
  width: 90%;
  text-align: center;
  padding: 40px 20px;
}
  /* ===============================================
   STICKY HEADER (Day + Menu)
================================================= */
#topHeader {
  position: sticky;
  top: 0;
  left: 0;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 18px;
  z-index: 100;
}

/* Day of Week text inside header */
#dayOfWeek {
  flex: 1;
  text-align: center;
  font-size: 1rem;
  font-weight: 600;
  color: #f0f4ff;
  margin: 0;
  pointer-events: none; /* text is not interactive */
}

/* Settings / Menu button */
#btnSettings {
  background: transparent;
  border: none;
  font-size: 24px;
  color: #fff;
  cursor: pointer;
  padding: 8px;
  z-index: 101;
  position: relative;
  min-width: 40px;
  min-height: 40px;
}

#btnSettings:hover {
  color: #ddd;
}
#dataBtn {
  background: transparent;
  border: none;
  color: #fff;
  cursor: pointer;
  padding: 8px;
  z-index: 101;
  position: relative;
  min-width: 40px;
  min-height: 40px;
}

   #dataBtn img {
  width: 22px;
  height: 22px;
  object-fit: contain;
   filter:invert(1);
}
h1 {
  font-size: 48px;
  font-weight: 700;
  margin: 0 0 16px 0;
  text-shadow: 0 2px 10px rgba(0,0,0,0.2);
}

.subtitle {
  font-size: 18px;
  font-weight: 400;
  opacity: 0.9;
  margin-bottom: 60px;
}

.mode-buttons {
  display: flex;
  flex-direction: column;
  gap: 20px;
  margin-bottom: 40px;
}

.mode-btn {
  padding: 24px 32px;
  border-radius: 20px;
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(10px);
  border: 2px solid rgba(255,255,255,0.3);
  color: #fff;
  font-size: 22px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  text-decoration: none;
}

.mode-btn:hover {
  background: rgba(255,255,255,0.25);
  transform: translateY(-4px);
  box-shadow: 0 8px 20px rgba(0,0,0,0.2);
}

.mode-btn img {
  width: 32px;
  height: 32px;
  filter: invert(1);
}

.secondary-links {
  display: flex;
  gap: 16px;
  justify-content: center;
  margin-top: 40px;
}

.secondary-btn {
  padding: 14px 24px;
  border-radius: 14px;
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.2);
  color: #fff;
  font-size: 16px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.3s ease;
  text-decoration: none;
  display: flex;
  align-items: center;
  gap: 8px;
}

.secondary-btn:hover {
  background: rgba(255,255,255,0.2);
  transform: scale(1.05);
}

.secondary-btn img {
  width: 20px;
  height: 20px;
  filter: invert(1);
}

.progress-summary {
  background: rgba(255,255,255,0.1);
  backdrop-filter: blur(10px);
  border-radius: 16px;
  padding: 20px;
  margin-top: 40px;
  border: 1px solid rgba(255,255,255,0.2);
}

.progress-summary h3 {
  margin: 0 0 16px 0;
  font-size: 18px;
  font-weight: 600;
}

.progress-item {
  display: flex;
  justify-content: space-between;
  padding: 8px 0;
  font-size: 16px;
}

.progress-item span:last-child {
  font-weight: 600;
}

  /* ===============================================
   FIXED FOOTER NAV
================================================= */
.footer-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 60px;
  background: #303f5c;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 25px;
}

.left-group, .right-group {
  display: flex;
  justify-content: space-between; /* even spacing between buttons */
  width: 120px; /* adjust width to fit 2 buttons evenly */
  margin: 0;
  gap: 0; /* spacing is controlled by flex */
}


/* Circular cutout behind the button */
.footer-nav::before {
  content: '';
  position: absolute;
  top: -25px; /* half the cutout height */
  left: 50%;
  transform: translateX(-50%);
  width: 60px;
  height: 60px;
  background: var(--bg-color); /* match page background */
  border-radius: 50%;
  z-index: 110; /* below the button */
}

.floating-center-btn {
  position: fixed; /* outside the footer */
  bottom: 30px; /* vertically center it in the cutout */
  left: 50%;
  transform: translateX(-50%);
  width: 50px;  /* same as cutout */
  height: 50px;
  border-radius: 50%;
  background: #ccd4ef;
  border: none;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 36px;
  font-weight: 700;
  color: #000;
  cursor: pointer;
  z-index: 130; /* above footer and cutout */
}

.footer-nav .switch-btn { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; padding:6px 0; width: 50px; background:transparent; border:none; cursor:pointer; border-radius:12px; }
.footer-nav .switch-btn img { width:22px; height:22px; opacity:0.9; filter:invert(1); }
.footer-nav .switch-btn span { color:#fff; font-weight:600; }
.footer-nav .switch-btn.active span { color:#8d4585; font-weight:700; }
  

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.container > * {
  animation: fadeIn 0.6s ease forwards;
}

.mode-buttons .mode-btn:nth-child(1) { animation-delay: 0.1s; }
.mode-buttons .mode-btn:nth-child(2) { animation-delay: 0.2s; }
.secondary-links { animation-delay: 0.3s; }
.progress-summary { animation-delay: 0.4s; }
</style>
</head>
    <!-- Sticky header -->
  <header id="topHeader">
    <button class="switch-btn data" id="dataBtn"><img src="icons/chart.svg" alt="Data"></button>
    <div id="dayOfWeek">Monday</div>
    <button id="btnSettings">☰</button>
  </header>
<body>
    <div class="mode-buttons">
      <a href="morning.html" class="mode-btn">
        <img src="icons/sun.svg" alt="Morning">
        Morning Routine
      </a>
      <a href="night.html" class="mode-btn">
        <img src="icons/night.svg" alt="Night">
        Night Routine
      </a>
    </div>


    <div class="progress-summary" id="todayProgress">
      <h3>Today's Progress</h3>
      <div class="progress-item">
        <span>Morning Routine</span>
        <span id="morningProgress">0%</span>
      </div>
      <div class="progress-item">
        <span>Night Routine</span>
        <span id="nightProgress">0%</span>
      </div>
    </div>
  </div>
  
  <!-- Sticky footer nav -->
<footer class="footer-nav">
  <div class="left-group">
    <button class="switch-btn home" id="homeBtn"><img src="icons/home.svg" alt="Home"><span>Home</span></button>
  </div>
  <div class="right-group">
    <button class="switch-btn todo" id="todoBtn"><img src="icons/todo.svg" alt="todo"><span>To-do</span></button>
  </div>
</footer>
<button class="floating-center-btn" id="centralBtn">+</button>

  <script>
    function getTodayDate() {
      return new Date().toLocaleDateString('en-GB');
    }

    function calculateProgress(mode) {
      const day = getTodayDate();
      const all = JSON.parse(localStorage.getItem('dailyTrackerData') || '{}');
      const modeData = all[day]?.[mode];
      
      if (!modeData) return 0;
      
      const answers = modeData.answers || {};
      const morningChecklistCount = 15; // Update this if you add/remove checklist items
      const nightChecklistCount = 10;
      const morningQuestionsCount = 2;
      const nightQuestionsCount = 19;
      
      let done = 0;
      let total = 0;
      
      if (mode === 'morning') {
        total = morningQuestionsCount + morningChecklistCount;
        Object.keys(answers).forEach(key => {
          if (answers[key]) done++;
        });
      } else {
        total = nightChecklistCount + nightQuestionsCount;
        Object.keys(answers).forEach(key => {
          const val = answers[key];
          if (Array.isArray(val) && val.length > 0) done++;
          else if (typeof val === 'object' && Object.values(val).some(v => v !== 0)) done++;
          else if (val) done++;
        });
      }
      
      return total > 0 ? Math.round((done / total) * 100) : 0;
    }

    // Update progress on page load
    document.addEventListener('DOMContentLoaded', () => {
      const morningProgress = calculateProgress('morning');
      const nightProgress = calculateProgress('night');
      
      document.getElementById('morningProgress').textContent = morningProgress + '%';
      document.getElementById('nightProgress').textContent = nightProgress + '%';
      document.getElementById('todoBtn').onclick = () => { window.location.href = 'todo.html'; };
      document.getElementById('dataBtn').onclick = () => { window.location.href = 'data.html'; };

    });
  </script>
</body>
</html>
