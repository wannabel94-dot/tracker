<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#374866" id="navColor">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Morning Page</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --morning-text: #f0f4ff;
  --night-text: #f0f4ff;
  --card-radius: 14px;
  --bg-blur: 6px;
  --glass-bg: rgba(255,255,255,0.08);
  --glass-border: rgba(255,255,255,0.12);
  font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; padding: 0; }
body {
  margin: 0;
  padding: 0 18px 90px;
  min-height: 100vh;
  color: var(--morning-text);
  background: linear-gradient(to bottom, #a8c0ff, #f0f4ff);
  font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial;
}

/* Sticky header */
#topHeader {
  position: sticky;
  top: 0;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 18px;
  z-index: 100;
  background: transparent;
}
#dayOfWeek { flex: 1; text-align: center; font-weight: 600; color: #f0f4ff; }
#btnSettings { background: transparent; border: none; font-size: 24px; color: #fff; cursor: pointer; }

/* Main content */
.wrap { width: 100%; max-width: 740px; margin-top: 40px; display: block; }
main.card { padding: 18px; border-radius: var(--card-radius); min-height: 520px; background: rgba(255,255,255,0.08); backdrop-filter: blur(var(--bg-blur)px); }
.question { font-size: 18px; margin-bottom: 12px; font-weight: 600; color: #f0f4ff; }
.options { display: flex; flex-wrap: wrap; gap: 10px; }
.options.column-options { flex-direction: column; }
.opt-btn { flex: 1; padding: 12px; font-weight: 600; border-radius: 12px; border: 0; cursor: pointer; background: rgba(255,255,255,0.15); color: #f0f4ff; transition: 0.2s; }
.opt-btn.selected { background: rgba(255,255,255,0.3); }
.controls { display: flex; justify-content: space-between; margin-top: 16px; }
.back-btn, .next-btn { padding: 12px 16px; border-radius: 12px; border: 0; font-weight: 700; cursor: pointer; background: rgba(255,255,255,0.15); color: #f0f4ff; }
.back-btn:hover, .next-btn:hover { opacity: 0.85; }

/* Footer navigation — identical to index.html */
.footer-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 90px;              /* <— matches index.html */
  background: rgba(0,0,0,0.25);
  backdrop-filter: blur(12px) saturate(180%);
  border-top: 1px solid rgba(255,255,255,0.15);
  display: flex;
  justify-content: space-around;   /* <— same spacing as index */
  align-items: center;
  padding: 0 10px;
  z-index: 200;
}

/* each button */
.footer-nav .switch-btn {
  background: transparent;
  border: none;
  width: 60px;              /* <— same hitbox size */
  height: 60px;
  border-radius: 16px;
  display: flex;
  justify-content: center;
  align-items: center;
  cursor: pointer;
  transition: background 0.25s ease, transform 0.25s ease;
}

/* icon inside button */
.footer-nav .switch-btn img {
  width: 40px;               /* <— SAME SIZE as index */
  height: 40px;
  opacity: 0.8;
  transition: opacity 0.25s ease, transform 0.25s ease;
}

.footer-nav .switch-btn:hover {
  background: rgba(255,255,255,0.12);
  transform: scale(1.07);
}

.footer-nav .switch-btn.active img {
  opacity: 1;
  transform: scale(1.18);
}

/* Settings menu */
.settings-menu {
  position: fixed; top:0; left:0; height:100vh; width:50%;
  background: rgba(0,0,0,0.7); backdrop-filter: blur(18px) saturate(180%);
  display:flex; flex-direction:column; padding:20px 0; transform:translateX(-100%); transition: transform 0.4s ease; z-index:200;
}
.settings-menu.show { transform:translateX(0); }
.menu-overlay { position: fixed; inset:0; background: rgba(0,0,0,0.5); opacity:0; pointer-events:none; transition: opacity 0.3s ease; z-index:150; }
.menu-overlay.show { opacity:1; pointer-events:all; }
</style>
</head>
<body class="morning">
  <!-- Sticky header -->
  <header id="topHeader">
    <div id="dayOfWeek">Monday</div>
    <button id="btnSettings">☰</button>
  </header>

  <!-- Menu overlay & settings -->
  <div id="menuOverlay" class="menu-overlay"></div>
  <div id="settingsMenu" class="settings-menu"></div>

  <!-- Main content wrapper -->
  <div class="wrap">
    <main class="card">
      <div id="contentArea">
        <div class="question">Welcome to your morning routine!</div>
        <div class="options">
          <button class="opt-btn">Start</button>
        </div>
      </div>
      <div class="controls">
        <button class="back-btn" id="backBtn" disabled>Back</button>
        <button class="next-btn" id="nextBtn">Next</button>
      </div>
    </main>
  </div>

  <!-- Footer nav -->
  <footer class="footer-nav">
    <button class="switch-btn morning active" id="morningBtn"><img src="icons/sun.svg" alt="Morning"></button>
    <button class="switch-btn night" id="nightBtn"><img src="icons/night.svg" alt="Night"></button>
    <button class="switch-btn history" id="historyBtn"><img src="icons/history.svg" alt="History"></button>
    <button class="switch-btn data" id="dataBtn"><img src="icons/data.svg" alt="Data"></button>
  </footer>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const contentArea = document.getElementById('contentArea');
  const backBtn = document.getElementById('backBtn');
  const nextBtn = document.getElementById('nextBtn');
  const btnSettings = document.getElementById('btnSettings');
  const settingsMenu = document.getElementById('settingsMenu');
  const menuOverlay = document.getElementById('menuOverlay');

  // Settings menu toggle
  btnSettings.onclick = () => {
    const isOpen = settingsMenu.classList.toggle('show');
    menuOverlay.classList.toggle('show', isOpen);
  };
  menuOverlay.onclick = () => {
    settingsMenu.classList.remove('show');
    menuOverlay.classList.remove('show');
  };

  // Footer buttons
  document.getElementById('morningBtn').onclick = () => location.reload();
  document.getElementById('nightBtn').onclick = () => alert("Switch to night mode");
  document.getElementById('historyBtn').onclick = () => window.location.href='history.html';
  document.getElementById('dataBtn').onclick = () => window.location.href='data.html';
});
</script>
</body>
</html>
