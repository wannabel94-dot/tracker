<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#07081d">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Medication Counter</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  body {
    margin: 0; padding: 0 18px 90px;
    min-height: 100vh;
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial;
    background: linear-gradient(to bottom, #a8c0ff, #f0f4ff);
    color: #f0f4ff;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  #topHeader {
    position: sticky; top: 0; width: 100%;
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 18px; z-index: 100;
    background: transparent;
  }
  #dayOfWeek { flex: 1; text-align: center; font-weight: 600; }
  #btnSettings { background: transparent; border: none; font-size: 24px; color: #fff; cursor: pointer; }
  main.card {
    margin-top: 40px;
    padding: 24px;
    border-radius: 14px;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(6px);
    width: 100%; max-width: 400px;
    display: flex; flex-direction: column; align-items: center;
  }
  #plusBtn {
    width: 80px; height: 80px;
    border-radius: 50%;
    font-size: 42px; font-weight: 700;
    border: 0; background: rgba(255,255,255,0.3); color: #fff;
    display: flex; justify-content: center; align-items: center;
    cursor: pointer; transition: transform 0.2s;
  }
  #totalDisplay { margin-top: 20px; font-size: 28px; font-weight: 700; text-align: center; }
  .opt-btn {
    margin-top: 20px;
    padding: 12px 16px;
    border-radius: 12px;
    border: none;
    font-weight: 600;
    cursor: pointer;
    background: rgba(255,255,255,0.15);
    color: #fff;
  }
  .footer-nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    height: 90px; display: flex; justify-content: space-around; align-items: center;
    background: rgba(0,0,0,0.25);
    backdrop-filter: blur(12px) saturate(180%);
    border-top: 1px solid rgba(255,255,255,0.15);
    z-index: 200;
  }
  .footer-nav .switch-btn { background: transparent; border: none; width: 60px; height: 60px; border-radius: 16px; display: flex; justify-content: center; align-items: center; cursor: pointer; }
  .footer-nav .switch-btn img { filter: invert(1); width: 32px; height: 32px; opacity: 0.8; }
</style>
</head>
<body>

<header id="topHeader">
  <div id="dayOfWeek">Medication</div>
  <button id="btnSettings">☰</button>
</header>

<div id="menuOverlay" class="menu-overlay"></div>
<div id="settingsMenu" class="settings-menu"></div>

<main class="card">
  <button id="plusBtn">+</button>
  <div id="totalDisplay">Total: 0</div>
  <button id="clearTotalBtn" class="opt-btn">Clear Total</button>
  <button id="appointmentBtn" class="opt-btn">Open Appointment</button>
</main>

<footer class="footer-nav">
  <button class="switch-btn morning active" id="morningBtn"><img src="icons/sun.svg" alt="Morning"></button>
  <button class="switch-btn night" id="nightBtn"><img src="icons/night.svg" alt="Night"></button>
  <button class="switch-btn history" id="historyBtn"><img src="icons/history.svg" alt="History"></button>
  <button class="switch-btn data" id="dataBtn"><img src="icons/data.svg" alt="Data"></button>
</footer>

<script>
document.addEventListener('DOMContentLoaded', () => {
  // Settings menu toggle
  const btnSettings = document.getElementById('btnSettings');
  const settingsMenu = document.getElementById('settingsMenu');
  const menuOverlay = document.getElementById('menuOverlay');
  btnSettings.onclick = () => {
    const isOpen = settingsMenu.classList.toggle('show');
    menuOverlay.classList.toggle('show', isOpen);
  };
  menuOverlay.onclick = () => {
    settingsMenu.classList.remove('show');
    menuOverlay.classList.remove('show');
  };

  // Footer buttons
  document.getElementById('morningBtn').onclick = () => location.reload();
  document.getElementById('nightBtn').onclick = () => window.location.href='index.html?mode=night';
  document.getElementById('historyBtn').onclick = () => window.location.href='history.html';
  document.getElementById('dataBtn').onclick = () => window.location.href='data.html';

  // Counter logic
  let total = parseInt(localStorage.getItem("blankTotal") || "0", 10);
  const plusBtn = document.getElementById("plusBtn");
  const totalDisplay = document.getElementById("totalDisplay");
  const clearBtn = document.getElementById("clearTotalBtn");
  const appointmentBtn = document.getElementById("appointmentBtn");

  function updateDisplay() { totalDisplay.textContent = "Total: " + total; }
  updateDisplay();

  plusBtn.addEventListener("click", () => {
    total += 1;
    localStorage.setItem("blankTotal", total);
    updateDisplay();
    plusBtn.style.transform = "scale(1.15)";
    setTimeout(() => plusBtn.style.transform = "scale(1)", 120);
  });

  clearBtn.addEventListener("click", () => {
    total = 0;
    localStorage.setItem("blankTotal", total);
    updateDisplay();
  });

  // Attempt to open app, fallback to web URL
  appointmentBtn.addEventListener("click", () => {
    const appUrl = "sanitas://appointments"; // Replace with actual scheme if available
    const webUrl = "https://www.sanitas.es/misanitas/online/clientes/#/appointmentsV2/selection";
    
    const now = Date.now();
    const timeout = setTimeout(() => { window.location.href = webUrl; }, 500);

    // Try to open app
    window.location = appUrl;

    // Clear timeout if app opens quickly (heuristic)
    window.addEventListener('blur', () => clearTimeout(timeout));
  });

});
</script>

</body>
</html>
