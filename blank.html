<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Medication Counter</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0; padding: 0;
    height: 100%; width: 100%;
    overflow: hidden; /* prevent scrolling */
    display: flex; flex-direction: column; justify-content: flex-start; align-items: center;
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial;
    background: linear-gradient(to bottom, #a8c0ff, #f0f4ff);
    color: #fff;
    padding-top: 30px; /* push content slightly down from top */
  }

  main.card {
    display: flex; flex-direction: column; align-items: center;
    justify-content: flex-start;
    padding: 20px; border-radius: 14px;
    background: rgba(0,0,0,0.15); /* more transparent */
    backdrop-filter: blur(6px);
    text-align: center;
  }

  #totalDisplay {
    font-size: 36px;
    font-weight: 700;
    margin: 15px 0;
  }

  .counter-btn {
    width: 90px; height: 90px; /* smaller circle */
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,0.3);
    display: flex; justify-content: center; align-items: center;
    cursor: pointer;
    margin: 10px;
    transition: transform 0.2s;
  }

  .counter-btn img {
    width: 48px; height: 48px; /* smaller icon */
    filter: invert(1); /* make icon white */
  }

  .opt-btn {
    margin: 8px;
    padding: 12px 18px;
    font-size: 18px;
    border-radius: 12px;
    border: none;
    font-weight: 600;
    cursor: pointer;
    background: rgba(255,255,255,0.15);
    color: #fff;
    transition: background 0.2s;
  }

  .opt-btn:hover {
    background: rgba(255,255,255,0.25);
  }

  .footer-nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    height: 90px; display: flex; justify-content: space-around; align-items: center;
    background: rgba(0,0,0,0.25); backdrop-filter: blur(12px) saturate(180%);
    border-top: 1px solid rgba(255,255,255,0.15);
    z-index: 200;
  }

  .footer-nav .switch-btn { background: transparent; border: none; width: 50px; height: 50px; border-radius: 16px; display: flex; justify-content: center; align-items: center; cursor: pointer; }
  .footer-nav .switch-btn img { filter: invert(1); width: 28px; height: 28px; opacity: 0.8; }
</style>
</head>
<body>

<main class="card">
  <h1 style="font-size:28px; margin-bottom:15px;">Medication Counter</h1>

  <!-- Main meds button -->
  <button id="plusBtn" class="counter-btn">
    <img src="icons/meds.svg" alt="Med">
  </button>

  <!-- Total -->
  <div id="totalDisplay">Total: 28</div>

  <!-- Reset button -->
  <button id="resetTotalBtn" class="opt-btn">Reset to 28</button>

  <!-- Secondary + / - buttons -->
  <div style="display:flex; justify-content:center; margin-top:15px;">
    <button id="minusBtn" class="opt-btn" style="font-size:28px; width:70px;">-</button>
    <button id="plusExtraBtn" class="opt-btn" style="font-size:28px; width:70px; margin-left:15px;">+</button>
  </div>

  <!-- Appointment button -->
  <button id="appointmentBtn" class="opt-btn" style="margin-top:15px;">Open Appointment</button>
</main>

<footer class="footer-nav">
  <button class="switch-btn morning active" id="morningBtn"><img src="icons/sun.svg" alt="Morning"></button>
  <button class="switch-btn night" id="nightBtn"><img src="icons/night.svg" alt="Night"></button>
  <button class="switch-btn history" id="historyBtn"><img src="icons/history.svg" alt="History"></button>
  <button class="switch-btn data" id="dataBtn"><img src="icons/data.svg" alt="Data"></button>
</footer>

<script>
document.addEventListener('DOMContentLoaded', () => {
  let total = parseInt(localStorage.getItem("medTotal") || "28", 10);
  const totalDisplay = document.getElementById("totalDisplay");
  const plusBtn = document.getElementById("plusBtn");
  const resetBtn = document.getElementById("resetTotalBtn");
  const minusBtn = document.getElementById("minusBtn");
  const plusExtraBtn = document.getElementById("plusExtraBtn");
  const appointmentBtn = document.getElementById("appointmentBtn");

  function updateDisplay() {
    totalDisplay.textContent = "Total: " + total;
  }

  updateDisplay();

  // Main meds button decreases total
  plusBtn.addEventListener("click", () => {
    if(total > 0) total -= 1;
    localStorage.setItem("medTotal", total);
    updateDisplay();
    plusBtn.style.transform = "scale(1.15)";
    setTimeout(() => plusBtn.style.transform = "scale(1)", 120);
  });

  // Reset
  resetBtn.addEventListener("click", () => {
    total = 28;
    localStorage.setItem("medTotal", total);
    updateDisplay();
  });

  // Secondary buttons
  plusExtraBtn.addEventListener("click", () => {
    total += 1;
    localStorage.setItem("medTotal", total);
    updateDisplay();
  });

  minusBtn.addEventListener("click", () => {
    if(total > 0) total -= 1;
    localStorage.setItem("medTotal", total);
    updateDisplay();
  });

  // Appointment button
  appointmentBtn.addEventListener("click", () => {
    const webUrl = "https://www.sanitas.es/misanitas/online/clientes/#/appointmentsV2/selection";
    window.location.href = webUrl;
  });

  // Footer buttons
  document.getElementById('morningBtn').onclick = () => location.reload();
  document.getElementById('nightBtn').onclick = () => window.location.href='index.html?mode=night';
  document.getElementById('historyBtn').onclick = () => window.location.href='history.html';
  document.getElementById('dataBtn').onclick = () => window.location.href='data.html';
});
</script>
</body>
</html>
