<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Medication Counter</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --text-color: #fff;
  --card-bg: rgba(255,255,255,0.08);
  --card-radius: 14px;
  --button-bg: rgba(255,255,255,0.3);
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial; background: linear-gradient(to bottom, #a8c0ff, #f0f4ff); color: var(--text-color); }

#topHeader {
  position: sticky;
  top: 0;
  width: 100%;
  padding: 10px 18px;
  font-size: 24px;
  font-weight: 700;
  text-align: center;
}

.wrap {
  width: 100%;
  max-width: 400px;
  margin: 20px auto 0 auto;
  display: flex;
  justify-content: center;
}

main.card {
  padding: 20px;
  border-radius: var(--card-radius);
  background: var(--card-bg);
  display: flex;
  flex-direction: column;
  align-items: center;
}

#totalDisplay {
  font-size: 36px;
  font-weight: 700;
  margin: 20px 0;
}

/* pill style buttons */
.pill-btn {
  padding: 12px 24px;
  border-radius: 24px;
  border: 0;
  background: var(--button-bg);
  color: #fff;
  font-weight: 600;
  cursor: pointer;
  margin: 0 5px;
  font-size: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.pill-btn img {
  width: 24px;
  height: 24px;
  filter: invert(1);
}

/* popup */
.popup-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 100;
}

.popup {
  background: rgba(0,0,0,0.85);
  padding: 20px;
  border-radius: 14px;
  text-align: center;
  color: #fff;
  display: flex;
  flex-direction: column;
  gap: 15px;
}

.popup button {
  padding: 10px 20px;
  border-radius: 12px;
  border: 0;
  cursor: pointer;
  font-weight: 600;
}

.popup .appointment {
  background: #4caf50;
  color: #fff;
}

.popup .remind {
  background: #2196f3;
  color: #fff;
}

/* Footer navigation */
.footer-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 90px;
  background: rgba(0,0,0,0.25);
  backdrop-filter: blur(12px) saturate(180%);
  border-top: 1px solid rgba(255,255,255,0.15);
  display: flex;
  justify-content: space-around;
  align-items: center;
  padding: 0 10px;
  z-index: 200;
}

.footer-nav .switch-btn {
  background: transparent;
  border: none;
  width: 50px;
  height: 50px;
  border-radius: 12px;
  display: flex;
  justify-content: center;
  align-items: center;
  cursor: pointer;
  transition: background 0.25s ease, transform 0.25s ease;
}

.footer-nav .switch-btn img {
  filter: invert(1);
  width: 28px;
  height: 28px;
  opacity: 0.85;
  transition: opacity 0.25s, transform 0.25s;
}

.footer-nav .switch-btn:hover {
  background: rgba(255,255,255,0.12);
  transform: scale(1.1);
}
</style>
</head>
<body>

<header id="topHeader">Medication Counter</header>

<div class="wrap">
  <main class="card">
    <div id="totalDisplay">Total: 28</div>

    <div style="display:flex; gap:10px;">
      <button id="minusBtn" class="pill-btn">-</button>
      <button id="resetBtn" class="pill-btn">Reset to 28</button>
      <button id="plusBtn" class="pill-btn"><img src="icons/meds.svg" alt="Meds"></button>
    </div>
  </main>
</div>

<div id="popupOverlay" class="popup-overlay">
  <div class="popup">
    <div>Medication is low! What would you like to do?</div>
    <button id="makeAppointment" class="appointment">Make Appointment</button>
    <button id="remindLater" class="remind">Remind Me Later</button>
  </div>
</div>

<footer class="footer-nav">
  <button class="switch-btn morning active" id="morningBtn"><img src="icons/sun.svg" alt="Morning"></button>
  <button class="switch-btn night" id="nightBtn"><img src="icons/night.svg" alt="Night"></button>
  <button class="switch-btn history" id="historyBtn"><img src="icons/history.svg" alt="History"></button>
  <button class="switch-btn data" id="dataBtn"><img src="icons/data.svg" alt="Data"></button>
</footer>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const plusBtn = document.getElementById("plusBtn");
  const minusBtn = document.getElementById("minusBtn");
  const resetBtn = document.getElementById("resetBtn");
  const totalDisplay = document.getElementById("totalDisplay");
  const popupOverlay = document.getElementById("popupOverlay");
  const makeAppointment = document.getElementById("makeAppointment");
  const remindLater = document.getElementById("remindLater");

  const sanitasURL = "https://www.sanitas.es/misanitas/online/clientes/#/appointmentsV2/selection";
  let total = parseInt(localStorage.getItem("medTotal") || "28", 10);
  let popupDismissed = false;

  function updateDisplay() {
    totalDisplay.textContent = "Total: " + total;
    localStorage.setItem("medTotal", total);

    if(total <= 5 && !popupDismissed) {
      popupOverlay.style.display = "flex";
    }
  }

  plusBtn.addEventListener("click", () => { total += 1; popupDismissed=false; updateDisplay(); });
  minusBtn.addEventListener("click", () => { if(total>0) total -= 1; popupDismissed=false; updateDisplay(); });
  resetBtn.addEventListener("click", () => { total = 28; popupDismissed=false; updateDisplay(); });

  makeAppointment.addEventListener("click", () => { window.location.href = sanitasURL; });
  remindLater.addEventListener("click", () => { popupOverlay.style.display = "none"; popupDismissed=true; });

  // Footer buttons
  document.getElementById('morningBtn').onclick = () => location.reload();
  document.getElementById('nightBtn').onclick = () => window.location.href='index.html?mode=night';
  document.getElementById('historyBtn').onclick = () => window.location.href='history.html';
  document.getElementById('dataBtn').onclick = () => window.location.href='data.html';

  updateDisplay();
});
</script>
</body>
</html>
