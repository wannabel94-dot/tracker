<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Medication Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --morning-text: #f0f4ff;
  --card-radius: 14px;
  --bg-blur: 6px;
  font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; padding: 0; background: linear-gradient(to bottom, #a8c0ff, #f0f4ff); color: var(--morning-text); }
#topHeader {
  position: sticky; top: 0; width: 100%; display: flex; align-items: center; justify-content: space-between;
  padding: 10px 18px; background: transparent; z-index: 100;
}
#dayOfWeek { flex: 1; text-align: center; font-weight: 600; font-size: 1.2rem; }
#btnSettings { background: transparent; border: none; font-size: 24px; color: #fff; cursor: pointer; }
.wrap { width: 100%; max-width: 740px; margin: 40px auto; display: flex; justify-content: center; }
main.card { width: 100%; padding: 18px; border-radius: var(--card-radius); background: rgba(255,255,255,0.08); backdrop-filter: blur(var(--bg-blur)px); text-align: center; }
#plusBtn {
  width: 80px; height: 80px; border-radius: 50%; font-size: 42px; font-weight: 700; border: 0;
  background: rgba(255,255,255,0.3); color: #fff; display: flex; align-items: center; justify-content: center;
  cursor: pointer; margin: 20px auto; transition: transform 0.25s;
}
#totalDisplay { font-size: 28px; font-weight: 700; margin-top: 20px; }
.opt-btn { margin-top: 20px; padding: 12px 20px; border-radius: 12px; border: 0; font-weight: 600; background: rgba(255,255,255,0.15); color: #fff; cursor: pointer; transition: 0.2s; }
.opt-btn:hover { opacity: 0.85; }
.footer-nav {
  position: fixed; bottom: 0; left: 0; right: 0; height: 90px;
  background: rgba(0,0,0,0.25); backdrop-filter: blur(12px) saturate(180%);
  display: flex; justify-content: space-around; align-items: center; z-index: 200;
}
.footer-nav .switch-btn {
  background: transparent; border: none; width: 60px; height: 60px; border-radius: 16px;
  display: flex; justify-content: center; align-items: center; cursor: pointer; transition: transform 0.25s;
}
.footer-nav .switch-btn img { filter: invert(1); width: 32px; height: 32px; opacity: 0.8; transition: transform 0.25s, opacity 0.25s; }
.footer-nav .switch-btn:hover { transform: scale(1.07); }
.footer-nav .switch-btn.active img { opacity: 1; transform: scale(1.18); }
.settings-menu {
  position: fixed; top: 0; left: 0; height: 100vh; width: 50%;
  background: rgba(0,0,0,0.7); backdrop-filter: blur(18px) saturate(180%);
  display: flex; flex-direction: column; padding: 20px 0; transform: translateX(-100%); transition: transform 0.4s; z-index: 200;
}
.settings-menu.show { transform: translateX(0); }
.menu-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 150; }
.menu-overlay.show { opacity: 1; pointer-events: all; }
</style>
</head>
<body class="morning">

<!-- Header -->
<header id="topHeader">
  <div id="dayOfWeek">Medication</div>
  <button id="btnSettings">☰</button>
</header>

<!-- Menu overlay & settings -->
<div id="menuOverlay" class="menu-overlay"></div>
<div id="settingsMenu" class="settings-menu"></div>

<!-- Main content -->
<div class="wrap">
  <main class="card">
    <!-- + Button -->
    <button id="plusBtn">+</button>
    <!-- Total -->
    <div id="totalDisplay">Total: 0</div>
    <!-- Clear Button -->
    <button id="clearTotalBtn" class="opt-btn">Clear Total</button>
    <!-- Appointment Button -->
    <button id="appointmentBtn" class="opt-btn">Book Appointment</button>
  </main>
</div>

<!-- Footer nav -->
<footer class="footer-nav">
  <button class="switch-btn morning active" id="morningBtn"><img src="icons/sun.svg" alt="Morning"></button>
  <button class="switch-btn night" id="nightBtn"><img src="icons/night.svg" alt="Night"></button>
  <button class="switch-btn history" id="historyBtn"><img src="icons/history.svg" alt="History"></button>
  <button class="switch-btn data" id="dataBtn"><img src="icons/data.svg" alt="Data"></button>
</footer>

<script>
document.addEventListener('DOMContentLoaded', () => {
  // Settings menu toggle
  const btnSettings = document.getElementById('btnSettings');
  const settingsMenu = document.getElementById('settingsMenu');
  const menuOverlay = document.getElementById('menuOverlay');
  btnSettings.onclick = () => {
    const isOpen = settingsMenu.classList.toggle('show');
    menuOverlay.classList.toggle('show', isOpen);
  };
  menuOverlay.onclick = () => {
    settingsMenu.classList.remove('show');
    menuOverlay.classList.remove('show');
  };

  // Footer buttons
  document.getElementById('morningBtn').onclick = () => location.reload();
  document.getElementById('nightBtn').onclick = () => window.location.href='index.html?mode=night';
  document.getElementById('historyBtn').onclick = () => window.location.href='history.html';
  document.getElementById('dataBtn').onclick = () => window.location.href='data.html';

  // Counter logic
  let total = parseInt(localStorage.getItem("blankTotal") || "0", 10);
  const plusBtn = document.getElementById("plusBtn");
  const totalDisplay = document.getElementById("totalDisplay");
  const clearBtn = document.getElementById("clearTotalBtn");
  const appointmentBtn = document.getElementById("appointmentBtn");

  function updateDisplay() {
    totalDisplay.textContent = "Total: " + total;
  }
  updateDisplay();

  plusBtn.addEventListener("click", () => {
    total += 1;
    localStorage.setItem("blankTotal", total);
    updateDisplay();
    plusBtn.style.transform = "scale(1.15)";
    setTimeout(() => plusBtn.style.transform = "scale(1)", 120);
  });

  clearBtn.addEventListener("click", () => {
    total = 0;
    localStorage.setItem("blankTotal", total);
    updateDisplay();
  });

  appointmentBtn.addEventListener("click", () => {
    window.open("https://www.sanitas.es/misanitas/online/clientes/#/appointmentsV2/selection", "_blank");
  });
});
</script>

</body>
</html>
