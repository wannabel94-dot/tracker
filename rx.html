<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Medication Counter</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --text: #f0f4ff;
  --background: #07081d;
  --card-radius: 14px;
  --bg-blur: 6px;
  --glass-bg: rgba(255,255,255,0.08);
  --glass-border: rgba(255,255,255,0.12);
  font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial;
}
/* ===============================================
   GLOBAL SETTINGS
================================================= */
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body {
  margin: 0;
  padding: 0;
  min-height: 100vh;
  background: var(--background);
  color: var(--text);
  font-family: inherit;

/* Header like History page */
#topHeader {
  position: sticky;
  top: 0;
  left: 0;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 18px;
  z-index: 100;
}

#dayOfWeek {
  flex: 1;
  text-align: center;
  font-size: 1rem;
  font-weight: 600;
  color: #f0f4ff;
  margin: 0;
  pointer-events: none;
}

#btnSettings {
  background: transparent;
  border: 0;
  font-size: 24px;
  color: #fff;
  cursor: pointer;
  padding: 0;
}

/* Settings menu */
.settings-menu {
  position: fixed;
  top: 0;
  left: 0;
  height: 100vh;
  width: 50%;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(18px) saturate(180%);
  display: flex;
  flex-direction: column;
  padding: 20px 0;
  transform: translateX(-100%);
  transition: transform .4s ease;
  z-index: 200;
}

.settings-menu.show { transform: translateX(0); }

.settings-menu button {
  background: transparent;
  border: 0;
  padding: 16px 20px;
  width: 100%;
  text-align: left;
  font-weight: 600;
  color: #fff;
  cursor: pointer;
  transition: background .25s, transform .2s;
}

.settings-menu button:hover {
  background: rgba(255,255,255,0.15);
  transform: translateX(6px);
}

.menu-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  opacity: 0;
  pointer-events: none;
  transition: opacity .3s;
  z-index: 150;
}

.menu-overlay.show {
  opacity: 1;
  pointer-events: all;
}

/* Card */
.wrap {
  width: 100%;
  max-width: 400px;
  margin-top: 20px;
  display: flex;
  justify-content: center;
}

main.card {
  padding: 20px;
  border-radius: var(--card-radius);
  background: var(--card-bg);
  display: flex;
  flex-direction: column;
  align-items: center;
}

#plusBtn {
  width: auto; /* inherit pill-btn width */
  height: auto; 
  border-radius: 24px;
  padding: 12px 20px;
  font-weight: 600;
  font-size: inherit;
  background: var(--button-bg);
  border: 0;
  cursor: pointer;
}

/* Minus + Reset buttons */
button.pill-btn {
  background: var(--button-bg);
  border: 0;
  border-radius: 24px;
  color: #fff;
  font-weight: 600;
  padding: 12px 20px;
  cursor: pointer;
  margin: 5px;
  min-width: 120px;
}

/* Total display */
#totalDisplay {
  font-size: 36px;
  font-weight: 700;
  margin: 10px 0;
  text-align: center;
}

/* Popup */
.popup-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 100;
}

.popup {
  background: rgba(0,0,0,0.85);
  padding: 20px;
  border-radius: 14px;
  text-align: center;
  color: #fff;
  display: flex;
  flex-direction: column;
  gap: 15px;
}

.popup button {
  padding: 10px 20px;
  border-radius: 12px;
  border: 0;
  cursor: pointer;
  font-weight: 600;
}

.popup .appointment {
  background: #4caf50;
  color: #fff;
}

.popup .remind {
  background: #2196f3;
  color: #fff;
}

.footer-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 60px;
  background: #303f5c;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 25px;
}

.left-group {
  display: flex;
  gap: 28px;
  margin-right: 50px; /* space for central button */
}

.right-group {
  display: flex;
  gap: 28px;
  margin-left: 0px; /* space for central button */
}


/* Circular cutout behind the button */
.footer-nav::before {
  content: '';
  position: absolute;
  top: -25px; /* half the cutout height */
  left: 50%;
  transform: translateX(-50%);
  width: 60px;
  height: 60px;
  background: var(--background); /* match page background */
  border-radius: 50%;
  z-index: 110; /* below the button */
}

.floating-center-btn {
  position: fixed; /* outside the footer */
  bottom: 30px; /* vertically center it in the cutout */
  left: 50%;
  transform: translateX(-50%);
  width: 50px;  /* same as cutout */
  height: 50px;
  border-radius: 50%;
  background: #8694af;
  border: none;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 36px;
  font-weight: 700;
  color: #000;
  cursor: pointer;
  z-index: 130; /* above footer and cutout */
}

.footer-nav .switch-btn { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; padding:6px 8px; background:transparent; border:none; cursor:pointer; border-radius:12px; }
.footer-nav .switch-btn img { width:22px; height:22px; opacity:0.9; filter:invert(1); }
.footer-nav .switch-btn span { color:#fff; font-weight:600; }
.footer-nav .switch-btn.active span { color:#8d4585; font-weight:700; }
}
    #dataBtn {
  background: transparent;
  border: none;
  color: #fff;
  cursor: pointer;
  padding: 8px;
  z-index: 101;
  position: relative;
  min-width: 40px;
  min-height: 40px;
}

   #dataBtn img {
  width: 22px;
  height: 22px;
  object-fit: contain;
   filter:invert(1);
}
</style>
</head>
<body class="morning">

<!-- Header -->
<header id="topHeader">
  <button class="switch-btn data" id="dataBtn"><img src="icons/chart.svg" alt="Data"></button>
  <div id="dayOfWeek">Meds</div>
  <button id="btnSettings">☰</button>
</header>


<!-- Menu overlay & settings -->
<div id="menuOverlay" class="menu-overlay"></div>
<div id="settingsMenu" class="settings-menu">
  <button id="btnExport">Export Data</button>
  <button id="btnClearToday">Reset Total to 28</button>
</div>

<!-- Main content -->
<div class="wrap">
  <main class="card">
    <div id="totalDisplay">Total: 28</div>

    <button id="plusBtn">
      <img src="icons/meds.svg" alt="Meds">
    </button>

  <div style="display:flex; gap:10px;">
  <button id="minusBtn" class="pill-btn">-</button>
  <button id="plusBtn" class="pill-btn">+</button>
  <button id="resetBtn" class="pill-btn">Reset to 28</button>
</div>

  </main>
</div>

<!-- Popup -->
<div id="popupOverlay" class="popup-overlay">
  <div class="popup">
    <div>Medication low!</div>
    <button id="makeAppointment" class="appointment">Make Appointment</button>
    <button id="remindLater" class="remind">Remind Me Later</button>
  </div>
</div>

<footer class="footer-nav">
  <div class="left-group">
    <button class="switch-btn home" id="homeBtn"><img src="icons/home.svg" alt="Home"><span>Home</span></button>
   <button class="switch-btn rx" id="rxBtn"><img src="icons/rx1.svg" alt="rx"><span>Rx</span></button>
  </div>
  <div class="right-group">
    <button class="switch-btn todo" id="todoBtn"><img src="icons/todo.svg" alt="todo"><span>To-do</span></button>
   <button class="switch-btn mood" id="moodBtn"><img src="icons/mood.svg" alt="mood"><span>Mood</span></button>
  </div>
</footer>
<button class="floating-center-btn" id="centralBtn">+</button>

<script>
  // Footer navigation handlers
  document.getElementById('homeBtn').onclick = () => { window.location.href = 'index.html'; };
  document.getElementById('todoBtn').onclick = () => { window.location.href = 'todo.html'; };
  document.getElementById('moodBtn').onclick = () => { window.location.href = 'mood.html'; };
  document.getElementById('rxBtn').onclick = () => { window.location.href = 'rx.html'; };
  document.getElementById('dataBtn').onclick = () => { window.location.href = 'data.html'; };

document.addEventListener('DOMContentLoaded', () => {
  const plusBtn = document.getElementById("plusBtn");
  const minusBtn = document.getElementById("minusBtn");
  const resetBtn = document.getElementById("resetBtn");
  const totalDisplay = document.getElementById("totalDisplay");
  const popupOverlay = document.getElementById("popupOverlay");
  const makeAppointment = document.getElementById("makeAppointment");
  const remindLater = document.getElementById("remindLater");

  const sanitasURL = "https://www.sanitas.es/misanitas/online/clientes/#/appointmentsV2/selection";

  let total = parseInt(localStorage.getItem("medTotal") || "28", 10);
  let popupDismissed = false;

  function updateDisplay() {
    totalDisplay.textContent = "Total: " + total;
    localStorage.setItem("medTotal", total);
    if(total <= 5 && !popupDismissed) {
      popupOverlay.style.display = "flex";
    }
  }

  plusBtn.addEventListener("click", () => {
    total += 1;
    popupDismissed = false;
    updateDisplay();
  });

  minusBtn.addEventListener("click", () => {
    if(total > 0) total -= 1;
    popupDismissed = false;
    updateDisplay();
  });

  resetBtn.addEventListener("click", () => {
    total = 28;
    popupDismissed = false;
    updateDisplay();
  });

  makeAppointment.addEventListener("click", () => {
    window.location.href = sanitasURL;
  });

  remindLater.addEventListener("click", () => {
    popupOverlay.style.display = "none";
    popupDismissed = true;
  });

  // Footer navigation
  document.getElementById('morningBtn').onclick = () => location.reload();
  document.getElementById('nightBtn').onclick = () => window.location.href='index.html?mode=night';
  document.getElementById('historyBtn').onclick = () => window.location.href='history.html';
  document.getElementById('dataBtn').onclick = () => window.location.href='data.html';
  document.getElementById('blankBtn').onclick = () => window.location.href='blank.html';

  // Settings menu
  const btnSettings = document.getElementById('btnSettings');
  const settingsMenu = document.getElementById('settingsMenu');
  const menuOverlay = document.getElementById('menuOverlay');

  btnSettings.onclick = () => {
    const isOpen = settingsMenu.classList.toggle('show');
    menuOverlay.classList.toggle('show', isOpen);
  };
  menuOverlay.onclick = () => {
    settingsMenu.classList.remove('show');
    menuOverlay.classList.remove('show');
  };

  updateDisplay();
});
</script>

</body>
</html>
