<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>History</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body {
  margin:0; padding:18px 18px 90px; font-family:Inter,sans-serif; min-height:100vh; color:#f0f4ff;
}
body::before {
  content:""; position:fixed; inset:0; z-index:-1;
  background:url("https://i.pinimg.com/736x/5a/62/e0/5a62e0d170bdd225f171db6520d5bb83.jpg") center/cover no-repeat;
}
.wrap { max-width:740px; margin:0 auto; }
h1 { text-align:center; margin-top:20px; margin-bottom:24px; }
.day-entry { background: rgba(255,255,255,0.05); border-radius:14px; padding:16px; margin-bottom:16px; }
.day-entry h3 { margin:0 0 8px 0; font-size:1.2rem; }
.day-entry ul { padding-left:18px; margin:0; }
.day-entry ul li { margin-bottom:4px; }

/* Sticky footer nav */
.footer-nav {
  position:fixed; bottom:0; left:0; right:0; height:70px;
  background:rgba(0,0,0,0.35); backdrop-filter:blur(14px) saturate(180%);
  display:flex; justify-content:center; align-items:center; gap:28px;
  border-top:1px solid rgba(255,255,255,0.15); z-index:100;
}
.footer-nav .switch-btn { background:transparent; border:none; border-radius:50%; padding:10px; transition: transform 0.25s, background 0.25s; }
.footer-nav .switch-btn img { width:32px; height:32px; filter:invert(1); opacity:0.6; transition: opacity 0.3s, transform 0.3s; }
.footer-nav .switch-btn:hover { background: rgba(255,255,255,0.1); transform: scale(1.1); }

/* Enlarged active button */
.footer-nav .switch-btn.active img { opacity:1; transform: scale(1.2); }
</style>
</head>
<body class="night">

<h1>History</h1>
<div class="wrap" id="historyContainer"></div>

<footer class="footer-nav">
  <button class="switch-btn morning" id="morningBtn"><img src="icons/day.svg" alt="Morning"></button>
  <button class="switch-btn night" id="nightBtn"><img src="icons/night.svg" alt="Night"></button>
  <button class="switch-btn history" id="historyBtn"><img src="icons/history.svg" alt="History"></button>
  <button class="switch-btn data" id="dataBtn"><img src="icons/data.svg" alt="Data"></button>
</footer>

<script>
const container = document.getElementById('historyContainer');

// Load saved data from localStorage
function loadHistory() {
    container.innerHTML = ''; // clear old content
    const all = JSON.parse(localStorage.getItem('dailyTrackerData') || '{}');
    const days = Object.keys(all).sort((a,b) => new Date(b.split('/').reverse().join('-')) - new Date(a.split('/').reverse().join('-')));

    if(days.length === 0){
        container.innerHTML = '<p>No history yet.</p>';
        return;
    }

    days.forEach(day => {
        const div = document.createElement('div');
        div.className = 'day-entry';
        let html = `<h3>${day}</h3>`;

        const modes = Object.keys(all[day]);
        modes.forEach(mode => {
            html += `<strong>${mode.toUpperCase()}</strong><ul>`;
            const ans = all[day][mode].answers;
            for(const key in ans){
                const val = ans[key];
                let displayVal = '';
                if(Array.isArray(val)) displayVal = val.join(', ');
                else if(typeof val === 'object') displayVal = Object.entries(val).map(([k,v]) => `${k}: ${v}`).join(', ');
                else displayVal = val;
                html += `<li><strong>${key}:</strong> ${displayVal}</li>`;
            }
            html += '</ul>';
        });

        // Add Edit and Delete buttons
        html += `
            <div style="margin-top:8px;">
                <button onclick="editEntry('${day}')">Edit</button>
                <button onclick="deleteEntry('${day}')">Delete</button>
            </div>
        `;

        div.innerHTML = html;
        container.appendChild(div);
    });
}

// Delete an entry
function deleteEntry(day) {
    if(confirm(`Delete all data for ${day}?`)) {
        const all = JSON.parse(localStorage.getItem('dailyTrackerData') || '{}');
        delete all[day];
        localStorage.setItem('dailyTrackerData', JSON.stringify(all));
        loadHistory();
    }
}

// Edit an entry
function editEntry(day) {
    // Save the date to localStorage or pass via query string
    localStorage.setItem('editDate', day);
    window.location.href = 'index.html';
}

// Initial load
loadHistory();
</script>

                <button onclick="deleteEntry('${day}')">Delete</button>

        `;

}

// Delete an entry
function deleteEntry(day) {
    if(confirm(`Delete all data for ${day}?`)) {
        const all = JSON.parse(localStorage.getItem('dailyTrackerData') || '{}');
        delete all[day];
        localStorage.setItem('dailyTrackerData', JSON.stringify(all));
        loadHistory();
    }
}

// Edit an entry
function editEntry(day) {
    // Save the date to localStorage or pass via query string
    localStorage.setItem('editDate', day);
    window.location.href = 'index.html';
}

// Initial load
loadHistory();

// ---------- ACTIVE BUTTON STATES ----------
const morningBtn = document.getElementById('morningBtn');
const nightBtn = document.getElementById('nightBtn');
const historyBtn = document.getElementById('historyBtn');
const dataBtn = document.getElementById('dataBtn');

// Highlight History button
morningBtn.classList.remove('active');
nightBtn.classList.remove('active');
historyBtn.classList.add('active');

// ---------- FOOTER BUTTONS ----------
morningBtn.onclick = () => {
  window.location.href = 'index.html?mode=morning';
};

nightBtn.onclick = () => {
  window.location.href = 'index.html?mode=night&start=0';
};

historyBtn.onclick = () => {
  location.reload();
};

dataBtn.onclick = () => {
  window.location.href = 'index.html';
};

// ---------- LOAD HISTORY ----------
const container = document.getElementById('historyContainer');
const allData = JSON.parse(localStorage.getItem('dailyTrackerData') || '{}');
const days = Object.keys(allData).sort((a, b) => {
  return new Date(b.split('/').reverse().join('-')) - new Date(a.split('/').reverse().join('-'));
});

if (days.length === 0) {
  container.innerHTML = '<p style="text-align:center;">No history yet.</p>';
} else {
  days.forEach(day => {
    const dayData = allData[day];
    const div = document.createElement('div');
    div.className = 'day-entry';
    let html = `<h3>${day}</h3>`;

    for (const mode in dayData) {
      html += `<strong>${mode.toUpperCase()}</strong><ul>`;
      const answers = dayData[mode].answers || {};
      for (const key in answers) {
        const val = answers[key];
        let displayVal = '';
        if (Array.isArray(val)) displayVal = val.join(', ');
        else if (typeof val === 'object') displayVal = Object.entries(val).map(([k,v]) => `${k}: ${v}`).join(', ');
        else displayVal = val;
        html += `<li><strong>${key}:</strong> ${displayVal}</li>`;
      }
      html += '</ul>';
    }

    div.innerHTML = html;
    container.appendChild(div);
  });
}
</script>
</body>
</html>
