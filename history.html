<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="theme-color" content="#07081d" id="navColor">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>History</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --morning-text: #f0f4ff;
  --night-text: #f0f4ff;
  --card-radius: 14px;
  --glass-border: rgba(255,255,255,0.12);
  font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial;
}
*{box-sizing:border-box}
html, body {
  height: 100%;
  margin: 0;
  padding: 0 18px 90px;
  overflow: hidden; /* prevent whole-page scrolling */
  color: var(--night-text);
}

/* Background / header */
body{ color:#fff; }
body::before{ content:""; position:fixed; inset:0; z-index:-1; background:#07081d; }

#topHeader{
  position: sticky;
  top: 0;
  left: 0;
  width: 100%;
  display:flex;
  align-items:center;
  background: #07081d; /* must be solid */
  justify-content:space-between;
  padding:10px 0px;
  z-index:100;
}
#dayOfWeek{ flex:1; text-align:center; font-size:1rem; font-weight:600; color:#f0f4ff; margin:0; pointer-events:none; }
#btnSettings {
  background: transparent;
  border: none;
  font-size: 24px;
  color: #fff;
  cursor: pointer;
  padding: 8px;
  z-index: 101;
  position: relative;
  min-width: 40px;
  min-height: 40px;
}
  
#btnSettings:hover { color: #ddd; }

/* Main content */
.wrap {
  width: 100%;
  max-width: 740px;
  margin: 0 auto;
  position: absolute;
  top: 60px;      /* header height */
  bottom: 60px;   /* footer height */
  left: 0;
  right: 0;
  padding: 18px;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
.day-entry{ background:rgba(255,255,255,0.05); border-radius:var(--card-radius); padding:16px; margin-bottom:16px; }
.day-header{ display:flex; justify-content:space-between; align-items:center; }
.day-header h3{ margin:0; font-size:1.1rem; }
.day-actions{ display:flex; gap:8px; }
.mini-btn{ background:rgba(255,255,255,0.1); color:#fff; border:0; border-radius:8px; padding:4px 10px; cursor:pointer; font-size:.8rem; transition:background .2s; }
.mini-btn:hover{ background:rgba(255,255,255,0.25); }
.mini-btn.delete{ background:rgba(255,50,50,0.25); }
.mini-btn.delete:hover{ background:rgba(255,50,50,0.4); }

#entryView{ background:rgba(255,255,255,0.05); padding:16px; border-radius:var(--card-radius); margin-bottom:16px; }
#entryView h4 { margin-top:16px; margin-bottom:8px; font-size:1rem; font-weight:400; }
#entryView h3 { font-weight:400; }
#entryView li strong { font-weight:500; }

/* ===============================================
   FIXED FOOTER NAV
================================================= */
.footer-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 60px;
  background: #303f5c;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 28px;
  border-top: none;
  z-index: 100;
  backdrop-filter: none;
}

/* Footer buttons */
.footer-nav .switch-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  padding: 6px 8px;
  background: transparent;
  border: none;
  cursor: pointer;
  border-radius: 12px;
}

.footer-nav .switch-btn img {
  width: 22px;
  height: 22px;
  opacity: 0.9;
  filter:invert(1);
}
   
.footer-nav .switch-btn span {
  color: #fff;
  font-weight: 600;
}

.footer-nav .switch-btn.active span {
  color: #ffd86b;
  opacity: 1;
  font-weight: 700;
}
.footer-nav .switch-btn.active img {
  filter: invert(84%) sepia(52%) saturate(545%) hue-rotate(2deg) brightness(103%) contrast(101%);
}

/* Settings menu */
.settings-menu{
  position: fixed; top:0; left:0; height:100vh; width:50%;
  background: rgba(0,0,0,0.7); backdrop-filter: blur(18px) saturate(180%);
  display:flex; flex-direction:column; padding:20px 0; transform:translateX(-100%); transition: transform .4s ease; z-index:200;
}
.settings-menu.show{ transform:translateX(0); }
.settings-menu button{ background:transparent; border:0; padding:16px 20px; width:100%; text-align:left; font-weight:600; color:#fff; cursor:pointer; transition: background .25s, transform .2s; }
.settings-menu button:hover{ background: rgba(255,255,255,0.15); transform:translateX(6px); }
.menu-overlay{ position:fixed; inset:0; background:rgba(0,0,0,0.5); opacity:0; pointer-events:none; transition:opacity .3s; z-index:150; }
.menu-overlay.show{ opacity:1; pointer-events:all; }

@media (max-width:480px){ body{ padding:12px;} }
</style>
</head>
<body class="morning">
  <header id="topHeader">
    <div id="dayOfWeek">History</div>
    <button id="btnSettings">☰</button>
  </header>

  <div id="menuOverlay" class="menu-overlay"></div>
  <div id="settingsMenu" class="settings-menu">
    <button id="btnExport">Export data</button>
    <button id="btnClearToday">Clear Today's Data</button>
  </div>

  <div class="wrap" id="historyContainer"></div>

<footer class="footer-nav">
  <button class="switch-btn morning" id="morningBtn">
    <img src="icons/sun.svg" alt="Morning">
    <span>Morning</span>
  </button>
  <button class="switch-btn night" id="nightBtn">
    <img src="icons/night.svg" alt="Night">
    <span>Night</span>
  </button>
  <button class="switch-btn history" id="historyBtn">
    <img src="icons/history.svg" alt="History">
    <span>History</span>
  </button>
  <button class="switch-btn data" id="dataBtn">
    <img src="icons/data.svg" alt="Data">
    <span>Data</span>
  </button>
</footer>

<script>
const HIDE_HISTORY_KEYS = [
  "_nightChecklistDone",
  "_nightchecklistdone",
  "_morningChecklistDone",
  "_morningchecklistdone"
];

/* Footer navigation handlers */
document.getElementById('morningBtn').onclick = () => {
  const last = localStorage.getItem('lastMorningProgress') || '';
  window.location.href = `index.html?mode=morning&last=${encodeURIComponent(last)}`;
};
document.getElementById('nightBtn').onclick = () => {
  const last = localStorage.getItem('lastNightProgress') || '';
  window.location.href = `index.html?mode=night&last=${encodeURIComponent(last)}`;
};
document.getElementById('historyBtn').onclick = () => { window.location.href = 'history.html'; };
document.getElementById('dataBtn').onclick = () => { window.location.href = 'data.html'; };

/* Settings menu toggle */
const btnSettings = document.getElementById('btnSettings');
const settingsMenu = document.getElementById('settingsMenu');
const menuOverlay = document.getElementById('menuOverlay');
btnSettings.onclick = () => {
  const isOpen = settingsMenu.classList.toggle('show');
  menuOverlay.classList.toggle('show', isOpen);
};
menuOverlay.onclick = () => {
  settingsMenu.classList.remove('show');
  menuOverlay.classList.remove('show');
};

/* Label mappings for history view */
const HISTORY_LABELS = {
  temp: "Took temp",
  wake_time: "Woke up",
  how_slept: "Sleep quality",
  made_bed: "Made bed",
  kettle: "Boiled kettle",
  took_meds_morn: "Took meds",
  tidy_up: "Tidied AM",
  tea: "Had tea",
  poop: "Pooped",
  shower_morn: "Showered",
  change_towel: "Changed towel",
  get_dressed: "Dressed",
  led_mask_morn: "LED Mask",
  skincare_morn: "Skincare AM",
  eat_breakfast: "Breakfast",
  supplements_morn: "Supplements",
  brush_teeth_morn: "Teeth AM",

  psyllium: "Psyllium",
  magnesium: "Magnesium",
  pillowcase: "Pillowcase change",
  tea_night: "Had tea PM",
  skincare_night: "Skincare PM",
  teeth_night: "Teeth PM",
  flossed: "Flossed",
  left_house: "Left House",
  caffeine_alcohol: "Caffeine / Alcohol",
  sickness: "Symptoms",
  saw_dogs: "Dogs",
  feel_with_L: "Relationship",
  house_state: "House",
  day_description: "Day",
  drove: "Driving",
  body_feelings: "Body",
  food_desc: "Food",
  most_prominent: "Mental",
  pjs: "PJs",
  prepare_breakfast: "Prepared meals",
  tidy up_night: "Tidied PM",
  meds: "Extra Meds",
  sensory_triggers: "Sensory",
  appointments: "Appointments",
  movement: "Movement",
  talked_to_anyone: "People",
  wellness: "Wellness",
  creative: "Creative",
  closed_eyes_time: "Closed Eyes"
};

/* ========== History logic (view/delete) ========== */
const container = document.getElementById('historyContainer');

function safeSortDays(keys){
  return keys.sort((a,b) => {
    const parse = s => {
      if (/\d{1,2}\/\d{1,2}\/\d{4}/.test(s)) {
        const [d,m,y] = s.split('/');
        return new Date(`${y}-${m.padStart(2,'0')}-${d.padStart(2,'0')}`);
      }
      return new Date(s);
    };
    return parse(b) - parse(a);
  });
}

function loadHistory(){
  container.innerHTML = '';
  const all = JSON.parse(localStorage.getItem('dailyTrackerData') || '{}');
  const days = safeSortDays(Object.keys(all));
  if (!days.length) { container.innerHTML = '<p style="color:rgba(255,255,255,0.8)">No history yet.</p>'; return; }
  days.forEach(day => {
    const entry = document.createElement('div');
    entry.className = 'day-entry';
    entry.innerHTML = `
      <div class="day-header">
        <h3>${day}</h3>
        <div class="day-actions">
          <button class="mini-btn" data-day="${day}" onclick="viewEntry('${day}')">View</button>
          <button class="mini-btn delete" data-day="${day}" onclick="deleteEntry('${day}')">Delete</button>
        </div>
      </div>
    `;
    container.appendChild(entry);
  });
}

window.viewEntry = (day) => {
  const all = JSON.parse(localStorage.getItem('dailyTrackerData') || '{}');
  const entry = all[day];
  if (!entry) return alert("No data for this day.");

  const existingView = document.querySelector(`#entryView[data-day='${day}']`);
  if (existingView) return existingView.remove(); // toggle off

  document.querySelectorAll('#entryView').forEach(d => d.remove());

  const div = document.createElement('div'); 
  div.id = 'entryView';
  div.dataset.day = day; 
  div.style.background = "rgba(255,255,255,0.05)";
  div.style.padding = "16px";
  div.style.borderRadius = "14px";
  div.style.marginBottom = "16px";

  let html = `<h3 style="margin:0 0 8px 0">Review</h3>`;

  if (entry.morning || entry.night) {
    html += `<div style="display:grid;gap:10px">`;
    if (entry.morning && entry.morning.answers) {
      html += `<h4 style="margin:0">Morning</h4><ul style="padding-left:16px;margin:0">`;
      for (const k in entry.morning.answers) {
        if (HIDE_HISTORY_KEYS.includes(k)) continue;
        let v = entry.morning.answers[k];
        if (Array.isArray(v)) v = v.join(', ');
        html += `<li><strong>${HISTORY_LABELS[k] || k}</strong>: ${v}</li>`;
      }
      html += `</ul>`;
    }
    if (entry.night && entry.night.answers) {
      html += `<h4 style="margin:0">Night</h4><ul style="padding-left:16px;margin:0">`;
      for (const k in entry.night.answers) {
        if (HIDE_HISTORY_KEYS.includes(k)) continue;
        let v = entry.night.answers[k];
        if (Array.isArray(v)) v = v.join(', ');
        html += `<li><strong>${HISTORY_LABELS[k] || k}</strong>: ${v}</li>`;
      }
      html += `</ul>`;
    }
    html += `</div>`;
  } else if (entry.answers) {
    html += `<h4>Answers</h4><ul style="padding-left:16px">`;
    for (const key in entry.answers) {
      let val = entry.answers[key];
      if (Array.isArray(val)) val = val.join(', ');
      html += `<li><strong>${HISTORY_LABELS[key] || key}</strong>: ${val}</li>`;
    }
    html += `</ul>`;
  } else {
    html += '<p>No answers recorded.</p>';
  }

  div.innerHTML = html;

  const dayEntryBtn = document.querySelector(`.mini-btn[data-day='${day}']`);
  if (dayEntryBtn) {
    const dayEntryDiv = dayEntryBtn.closest('.day-entry');
    dayEntryDiv.insertAdjacentElement('afterend', div);
    div.scrollIntoView({ behavior: 'smooth' });
  }
};

window.deleteEntry = (day) => {
  if (!confirm(`Delete all data for ${day}?`)) return;
  const all = JSON.parse(localStorage.getItem('dailyTrackerData') || '{}');
  delete all[day];
  localStorage.setItem('dailyTrackerData', JSON.stringify(all));
  loadHistory();
};

/* initial load */
loadHistory();

document.getElementById('btnExport').addEventListener('click', () => {
  const data = localStorage.getItem('dailyTrackerData');
  if (!data) { alert("No data to export yet."); return; }
  const blob = new Blob([data], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = "daily-tracker-data.json";
  a.click();
  URL.revokeObjectURL(url);
});
document.getElementById('btnClearToday').addEventListener('click', () => {
  const day = new Date().toLocaleDateString('en-GB');
  const all = JSON.parse(localStorage.getItem('dailyTrackerData') || '{}');
  delete all[day];
  localStorage.setItem('dailyTrackerData', JSON.stringify(all));
  loadHistory();
  alert("Today's data cleared.");
});
</script>
</body>
</html>
