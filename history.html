<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>History</title>
<link rel="stylesheet" href="style.css"> <!-- reuse your main CSS -->
</head>
<body class="morning">
  <h1>History</h1>
  <div id="historyContainer"></div>
  <!-- Sticky footer nav -->
  <footer class="footer-nav">
    <button class="switch-btn morning" id="morningBtn">
      <img src="icons/day.svg" alt="Morning">
    </button>
    <button class="switch-btn night" id="nightBtn">
      <img src="icons/night.svg" alt="Night">
    </button>
    <button class="switch-btn history" id="historyBtn">
      <img src="icons/history.svg" alt="History">
    </button>
    <button class="switch-btn data" id="dataBtn">
      <img src="icons/data.svg" alt="Data">
    </button>
  </footer>
  <script>
    const container = document.getElementById('historyContainer');
    const all = JSON.parse(localStorage.getItem('dailyTrackerData') || '{}');
    const days = Object.keys(all).sort((a,b) => new Date(b.split('/').reverse().join('-')) - new Date(a.split('/').reverse().join('-')));

    if(days.length === 0){
      container.innerHTML = '<p>No history yet.</p>';
    } else {
      days.forEach(day => {
        const div = document.createElement('div');
        div.className = 'day-entry';
        let html = `<h3>${day}</h3>`;
        const modes = Object.keys(all[day]);
        modes.forEach(mode => {
          html += `<strong>${mode.toUpperCase()}</strong><ul>`;
          const ans = all[day][mode].answers;
          for(const key in ans){
            const val = ans[key];
            let displayVal = '';
            if(Array.isArray(val)) displayVal = val.join(', ');
            else if(typeof val === 'object') displayVal = Object.entries(val).map(([k,v]) => `${k}: ${v}`).join(', ');
            else displayVal = val;
            html += `<li><strong>${key}:</strong> ${displayVal}</li>`;
          }
          html += '</ul>';
        });
        div.innerHTML = html;
        container.appendChild(div);
      });
    }
  </script>
</body>
</html>
