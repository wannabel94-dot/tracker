<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Data Table</title>
<style>
    body {
        font-family: Inter, sans-serif;
        padding: 20px;
        background: #0a0f2c;
        color: #fff;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
        background: rgba(255,255,255,0.05);
        border-radius: 10px;
        overflow-x: scroll;
        display: block;
        white-space: nowrap;
    }

    thead {
        background: rgba(255,255,255,0.15);
    }

    th, td {
        padding: 10px;
        border-bottom: 1px solid rgba(255,255,255,0.1);
        text-align: left;
        font-size: 2rem;
    }

    th {
        font-weight: 600;
    }

    tr:last-child td {
        border-bottom: none;
    }

    /* Make first column sticky for easier reading */
    td:first-child, th:first-child {
        position: sticky;
        left: 0;
        background: rgba(0,0,0,0.6);
        backdrop-filter: blur(4px);
        z-index: 2;
    }
</style>
</head>
<body>

<h2>Data Table</h2>
<div id="tableContainer"></div>

<script>
    const ALLOWED_FIELDS = [

const LABELS = {
  wake_time: "Wake up",
  how_slept: "Sleep",
  temp: "Take temp",
  made_bed: "Made Bed",
  took_meds_morn: "Took meds",
  tidy_up: "Tidied",
  shower_morn: "Showered",
  get_dressed: "Dressed",
  led_mask_morn: "LED Mask",
  skincare_morn: "Skincare AM",
  eat_breakfast: "Breakfast",
  supplements_morn: "Supplements",
  brush_teeth_morn: "Teeth AM",
  psyllium: "Psyllium",
  magnesium: "Magnesium",
  pillowcase: "Pillowcase",
  shower_night: "Showered",
  skincare_night: "Skincare PM",
  teeth_night: "Teeth PM",
  flossed: "Flossed",
  left_house: "Left House",
  caffeine_alcohol: "Caffeine/Alcohol",
  sickness: "Symptoms",
  saw_dogs: "Saw Dogs",
  feel_with_L: "Relationship",
  house_state: "House",

  movement: "Movement",
  talked_to_anyone: "People",
  wellness: "Wellness",
  creative: "Creative",
  closed_eyes_time: "Closed Eyes"
};

function yesNoToSymbol(v) {
  if (v === "Yes") return "✓";
  if (v === "No") return "✗";
  return v;
}

function buildTable() {
  const raw = JSON.parse(localStorage.getItem("dailyTrackerData") || "{}");
  const days = Object.keys(raw).sort((a, b) => new Date(b) - new Date(a)); // newest first

  if (days.length === 0) {
    document.getElementById("tableContainer").innerHTML = "<p>No data saved.</p>";
    return;
  }

  // Collect all unique keys
  const allKeys = new Set();
  days.forEach(day => {
    const answers = raw[day]?.answers || {};
    Object.keys(answers).forEach(k => allKeys.add(k));
  });

  const rows = Array.from(allKeys);

  // Start table
  let html = `<table><thead><tr><th>Question</th>`;

  // Header: each day becomes a column
  days.forEach(day => {
    html += `<th>${day}</th>`;
  });

  html += `</tr></thead><tbody>`;

  // Each question becomes a row
  rows.forEach(key => {
    html += `<tr><td><strong>${LABELS[key] || key}</strong></td>`;

    days.forEach(day => {
      let value = raw[day]?.answers?.[key] ?? "";

      if (Array.isArray(value)) {
        value = value.map(v => yesNoToSymbol(v)).join(", ");
      } else {
        value = yesNoToSymbol(value);
      }

      html += `<td>${value}</td>`;
    });

    html += `</tr>`;
  });

  html += `</tbody></table>`;
  document.getElementById("tableContainer").innerHTML = html;
}


buildTable();
</script>

</body>
</html>
