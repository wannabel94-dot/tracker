<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Data Table</title>
<style>
    body {
        font-family: Inter, sans-serif;
        padding: 20px;
        background: #0a0f2c;
        color: #fff;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
        background: rgba(255,255,255,0.05);
        border-radius: 10px;
        overflow-x: scroll;
        display: block;
        white-space: nowrap;
    }

    thead {
        background: rgba(255,255,255,0.15);
    }

    th, td {
        padding: 10px;
        border-bottom: 1px solid rgba(255,255,255,0.1);
        text-align: left;
        font-size: 2rem;
    }

    th {
        font-weight: 600;
    }

    tr:last-child td {
        border-bottom: none;
    }

    /* Make first column sticky for easier reading */
    td:first-child, th:first-child {
        position: sticky;
        left: 0;
        background: rgba(0,0,0,0.6);
        backdrop-filter: blur(4px);
        z-index: 2;
    }
</style>
</head>
<body>

<h2>Data Table</h2>
<div id="tableContainer"></div>

<script>
    const LABELS = { wake_time: "Wake up", how_slept: "Sleep", temp: "Take temp", made_bed: "Made Bed", took_meds_morn: "Took meds", tidy_up: "Tidied", shower_morn: "Showered", get_dressed: "Dressed", led_mask_morn: "LED Mask", skincare_morn: "Skincare AM", eat_breakfast: "Breakfast", supplements_morn: "Supplements", brush_teeth_morn: "Teeth AM", psyllium: "Psyllium", magnesium: "Magnesium", pillowcase: "Pillowcase", shower_night: "Showered", skincare_night: "Skincare PM", teeth_night: "Teeth PM", flossed: "Flossed", left_house: "Left House", caffeine_alcohol: "Caffeine/Alcohol", sickness: "Symptoms", saw_dogs: "Saw Dogs", feel_with_L: "Relationship", house_state: "House", drove: "Driving", body_feelings: "Body", food_desc: "Diet", most_prominent: "Mental", meds: "Extra Meds", sensory_triggers: "Sensory Triggers", appointments: "Appointments", movement: "Movement", talked_to_anyone: "People", wellness: "Wellness", creative: "Creative", closed_eyes_time: "Closed Eyes" }; function yesNoToSymbol(v) { if (v === "Yes") return "✓"; if (v === "No") return "✗"; return v; }
const MORNING_CHECKLIST_KEYS = [
  "temp", "made_bed", "kettle", "took_meds_morn", "tidy_up", 
  "tea", "poop", "shower_morn", "get_dressed", "led_mask_morn",
  "skincare_morn", "eat_breakfast", "supplements_morn", "brush_teeth_morn"
];

// Optional: some items you want to show individually
const INDIVIDUAL_MORNING_ITEMS = [
  "eat_breakfast", 
    "took_meds_morn",
    "brush_teeth_morn",
    "supplements_morn"
];
    
const NIGHT_KEYS = [
  "psyllium","magnesium","pillowcase","shower_night","skincare_night",
  "teeth_night","flossed","left_house","caffeine_alcohol","sickness",
  "saw_dogs","feel_with_L","house_state","drove","body_feelings",
  "food_desc","most_prominent","meds","sensory_triggers","appointments",
  "movement","talked_to_anyone","wellness","creative","closed_eyes_time"
];
    
function buildTable() {
    const raw = JSON.parse(localStorage.getItem("dailyTrackerData") || "{}");
    const days = Object.keys(raw).sort((a,b)=>new Date(b)-new Date(a));
    
    if(days.length===0){
        document.getElementById("tableContainer").innerHTML = "<p>No data saved.</p>";
        return;
    }

    let html = `<table><thead><tr><th>Item</th>`;
    days.forEach(day => html += `<th>${day}</th>`);
    html += `</tr></thead><tbody>`;

    // Morning completion row
    html += `<tr><td><strong>AM routine</strong></td>`;
    days.forEach(day => {
        const answers = raw[day]?.answers || {};
        const total = MORNING_CHECKLIST_KEYS.length;
        const done = MORNING_CHECKLIST_KEYS.filter(k => answers[k] === "Yes").length;
        const percent = Math.round((done / total) * 100);
        html += `<td>${percent}%</td>`;
    });
    html += `</tr>`;

    // Individual morning items
    INDIVIDUAL_MORNING_ITEMS.forEach(key => {
        html += `<tr><td><strong>${key}</strong></td>`;
        days.forEach(day => {
            const val = raw[day]?.answers?.[key] ?? "";
            html += `<td>${val === "Yes" ? "✓" : val === "No" ? "✗" : val}</td>`;
        });
        html += `</tr>`;
    });

    // Night items
    NIGHT_KEYS.forEach(key => {
        html += `<tr><td><strong>${key}</strong></td>`;
        days.forEach(day => {
            let val = raw[day]?.answers?.[key] ?? "";
            if(Array.isArray(val)) val = val.map(v => v === "Yes" ? "✓" : v === "No" ? "✗" : v).join(", ");
            else val = val === "Yes" ? "✓" : val === "No" ? "✗" : val;
            html += `<td>${val}</td>`;
        });
        html += `</tr>`;
    });

    html += `</tbody></table>`;
    document.getElementById("tableContainer").innerHTML = html;
}

buildTable();
</script>

</body>
</html>
