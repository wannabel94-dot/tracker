<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#07081d" id="navColor">
<meta name="viewport" content="width=device-width,initial-scale=1">
   <!-- Theme color for Android navigation bar -->
<title>Data</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<style>

    /* ===============================================
   ROOT VARIABLES
================================================= */
:root {
  --text: #f0f4ff;
  --card-radius: 14px;
  --bg-blur: 6px;
  --glass-bg: rgba(255,255,255,0.08);
  --glass-border: rgba(255,255,255,0.12);
  font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial;
}
    /* ===============================================
   GLOBAL SETTINGS
================================================= */
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
    background:#07081d;
  margin: 0;
  padding: 0 18px 90px;
  min-height: 100vh;
color: #f0f4ff; 
}

    #topHeader {
  position: sticky;
  top: 0;
  left: 0;
  width: 100%;
  display: flex;
  align-items: center;
         background: #07081d; /* must be solid */
  justify-content: space-between;
  padding: 10px 18px;
  z-index: 100;
}
#btnSettings {
  background: transparent;
  border: 0;
  font-size: 24px;
  color: #fff;
  cursor: pointer;
  padding: 0;
}

/* Day of Week text inside header */
#dayOfWeek {
  flex: 1;
  text-align: center;
  font-size: 1rem;
  font-weight: 600;
  color: #f0f4ff;
  margin: 0;
  pointer-events: none; /* text is not interactive */
}
#tableContainer {
    overflow-x: auto;
    width: 100%;
    margin-top: 15px;
       -webkit-overflow-scrolling: touch; /* smooth scrolling */
}

table {
    width: max-content;
    min-width: 100%;
    border-collapse: separate; /* changed */
    border-spacing: 0; /* remove spacing */
    background: rgba(255,255,255,0.05);
    border-radius: 14px; /* your rounded corners */
    overflow: hidden; /* clip corners */
}


    thead {
        background: rgba(255,255,255,0.15);
    }
thead th {
    position: sticky;
    top: 0;
    background: rgba(255,255,255,0.15);
    z-index: 3;
}

    th, td {
    padding: 6px 10px;
        border-bottom: 1px solid rgba(255,255,255,0.1);
        text-align: left;
        font-size: 0.8rem;
    }

    th {
        font-weight: 600;
    }

    tr:last-child td {
        border-bottom: none;
    }

 /* Make first column sticky and more solid */
td:first-child, th:first-child {
    position: sticky;
    left: 0;
    background: rgba(0, 0, 0, 0.9); /* more solid than before */
    backdrop-filter: blur(4px);
    z-index: 4; /* higher than the other columns */
}

/* Ensure text of other columns doesn’t show under the sticky column */
table th, table td {
    white-space: nowrap; /* prevents text from wrapping behind first column */
}

/* Scrollable card wrapper */
.table-card {
  border-radius: 14px;
  padding: 12px;
  margin-top: 15px;/* Remove previous margin/padding that blocked scroll */
   
body.data-page .wrap {
  margin-top: 0 !important; /* overrides anything else */
}


  overflow-y: auto;
  overflow-x: auto;
}
/* ===============================================
   MENU
================================================= */
.settings-menu{
  position: fixed; top:0; left:0; height:100vh; width:50%;
  background: rgba(0,0,0,0.7); backdrop-filter: blur(18px) saturate(180%);
  display:flex; flex-direction:column; padding:20px 0; transform:translateX(-100%); transition: transform .4s ease; z-index:200;
}
.settings-menu.show{ transform:translateX(0); }
.settings-menu button{ background:transparent; border:0; padding:16px 20px; width:100%; text-align:left; font-weight:600; color:#fff; cursor:pointer; transition: background .25s, transform .2s; }
.settings-menu button:hover{ background: rgba(255,255,255,0.15); transform:translateX(6px); }
.menu-overlay{ position:fixed; inset:0; background:rgba(0,0,0,0.5); opacity:0; pointer-events:none; transition:opacity .3s; z-index:150; }
.menu-overlay.show{ opacity:1; pointer-events:all; }
/* ===============================================
   FIXED FOOTER NAV
================================================= */
.footer-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 60px;
  background: #303f5c; /* change this to any solid color you want */
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 28px;
  border-top: none; /* remove the top border */
  z-index: 100;
  backdrop-filter: none; /* remove blur/saturation effects */
}

/* Footer buttons */
.footer-nav .switch-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;               /* space between icon + text */
  padding: 6px 8px;
  background: transparent;
  border: none;
  cursor: pointer;
  border-radius: 12px;
}

.footer-nav .switch-btn img {
  width: 22px;
  height: 22px;
  opacity: 0.9;
filter:invert(1);
}

.footer-nav .switch-btn span {
  color: #fff;
  font-weight: 600;
}

.footer-nav .switch-btn.active span {
  color: #ffd86b;   /* example gold for active */
  opacity: 1;
  font-weight: 700; /* optional */
}
   .footer-nav .switch-btn.active img {
  filter: invert(84%) sepia(52%) saturate(545%) hue-rotate(2deg) brightness(103%) contrast(101%);
}
/* ===============================================
   RESPONSIVE / MOBILE
================================================= */
@media (max-width:480px) { 
  body{padding:12px;}
}
</style>
</head>
<body>
  <!-- Sticky header -->
  <header id="topHeader">
    <div id="dayOfWeek">Data</div>
    <button id="btnSettings">☰</button>
  </header>

<div class="table-card">
    <div id="tableContainer"></div>
</div>
<!-- Menu overlay & settings -->
<div id="menuOverlay" class="menu-overlay"></div>
<div id="settingsMenu" class="settings-menu">
  <button id="btnExport">Export data</button>
  <button id="btnClearToday">Clear Today's Data</button>
</div>

 <!-- Sticky footer nav -->
<footer class="footer-nav">
  <button class="switch-btn morning" id="morningBtn">
    <img src="icons/sun.svg" alt="Morning">
    <span>Morning</span>
  </button>

  <button class="switch-btn night" id="nightBtn">
    <img src="icons/night.svg" alt="Night">
    <span>Night</span>
  </button>

  <button class="switch-btn history" id="historyBtn">
    <img src="icons/history.svg" alt="History">
    <span>History</span>
  </button>

  <button class="switch-btn data" id="dataBtn">
    <img src="icons/data.svg" alt="Data">
    <span>Data</span>
  </button>

  <button class="switch-btn blank" id="blankBtn">
    <img src="icons/balloon.svg" alt="Blank">
    <span>Blank</span>
  </button>
</footer>
<script>
    const LABELS = { wake_time: "Wake up", how_slept: "Sleep", temp: "Take temp", made_bed: "Made Bed", took_meds_morn: "Took meds", tidy_up: "Tidied", shower_morn: "Showered", get_dressed: "Dressed", led_mask_morn: "LED Mask", skincare_morn: "Skincare AM", eat_breakfast: "Breakfast", supplements_morn: "Supplements", brush_teeth_morn: "Teeth AM", psyllium: "Psyllium", magnesium: "Magnesium", pillowcase: "Pillowcase", shower_night: "Showered", skincare_night: "Skincare PM", teeth_night: "Teeth PM", flossed: "Flossed", left_house: "Left House", caffeine_alcohol: "Caffeine/Alcohol", sickness: "Symptoms", saw_dogs: "Saw Dogs", feel_with_L: "Relationship", house_state: "House", drove: "Driving", body_feelings: "Body", food_desc: "Diet", most_prominent: "Mental", meds: "Extra Meds", sensory_triggers: "Sensory Triggers", appointments: "Appointments", movement: "Movement", talked_to_anyone: "People", wellness: "Wellness", creative: "Creative", closed_eyes_time: "Closed Eyes" }; function yesNoToSymbol(v) { if (v === "Yes") return "✓"; if (v === "No") return "✗"; return v; }
const MORNING_CHECKLIST_KEYS = [
  "temp", "made_bed", "kettle", "took_meds_morn", "tidy_up", 
  "tea", "poop", "shower_morn", "get_dressed", "led_mask_morn",
  "skincare_morn", "eat_breakfast", "supplements_morn", "brush_teeth_morn"
];

// Optional: some items you want to show individually
const INDIVIDUAL_MORNING_ITEMS = [
  "eat_breakfast", 
    "took_meds_morn",
    "brush_teeth_morn",
    "supplements_morn"
];
    
const NIGHT_KEYS = [
  "psyllium","magnesium","pillowcase","shower_night","skincare_night",
  "teeth_night","flossed","left_house","caffeine_alcohol","sickness",
  "saw_dogs","feel_with_L","house_state","drove","body_feelings",
  "food_desc","most_prominent","meds","sensory_triggers","appointments",
  "movement","talked_to_anyone","wellness","creative","closed_eyes_time"
];
 /****************************************************
 * 5️⃣ NAVIGATION BUTTONS
 ****************************************************/
document.getElementById('morningBtn').onclick = () => {
  const last = localStorage.getItem('lastMorningProgress') || '';
  window.location.href = `index.html?mode=morning&last=${encodeURIComponent(last)}`;
};
document.getElementById('nightBtn').onclick = () => {
  const last = localStorage.getItem('lastNightProgress') || '';
  window.location.href = `index.html?mode=night&last=${encodeURIComponent(last)}`;
};
document.getElementById('historyBtn').addEventListener('click', () => { window.location.href = 'history.html'; });
document.getElementById('blankBtn').addEventListener('click', () => { window.location.href = 'blank.html'; });
document.getElementById('dataBtn').addEventListener('click', () => { window.location.href = 'data.html'; });

   
function buildTable() {
    const raw = JSON.parse(localStorage.getItem("dailyTrackerData") || "{}");
    const days = Object.keys(raw).sort((a, b) => new Date(b) - new Date(a)); // most recent first

    if (days.length === 0) {
        document.getElementById("tableContainer").innerHTML = "<p>No data saved.</p>";
        return;
    }

    // All items: AM completion, individual morning, night
    const allItems = [
        { key: "AM_routine", label: "AM routine", type: "percent" },
        ...INDIVIDUAL_MORNING_ITEMS.map(k => ({ key: k, label: LABELS[k] || k, type: "yesno" })),
        ...NIGHT_KEYS.map(k => ({ key: k, label: LABELS[k] || k, type: "yesno" }))
    ];

    // Table header = items
    let html = `<table><thead><tr><th>Date</th>`;
    allItems.forEach(item => html += `<th>${item.label}</th>`);
    html += `</tr></thead><tbody>`;

    // Table rows = days
    days.forEach(day => {
        html += `<tr><td><strong>${day}</strong></td>`; // first column = date

        allItems.forEach(item => {
            if (item.key === "AM_routine") {
                const answers = raw[day]?.answers || {};
                const total = MORNING_CHECKLIST_KEYS.length;
                const done = MORNING_CHECKLIST_KEYS.filter(k => answers[k] === "Yes").length;
                const percent = Math.round((done / total) * 100);
                html += `<td>${percent}%</td>`;
            } else {
                let val = raw[day]?.answers?.[item.key] ?? "";
                if (Array.isArray(val)) val = val.map(v => v === "Yes" ? "✓" : v === "No" ? "✗" : v).join(", ");
                else val = val === "Yes" ? "✓" : val === "No" ? "✗" : val;
                html += `<td>${val}</td>`;
            }
        });

        html += `</tr>`;
    });

    html += `</tbody></table>`;
    document.getElementById("tableContainer").innerHTML = html;
}

buildTable();

const btnSettings = document.getElementById('btnSettings');
const settingsMenu = document.getElementById('settingsMenu');
const menuOverlay = document.getElementById('menuOverlay');

btnSettings.addEventListener('click', () => {
  settingsMenu.classList.toggle('show');
  menuOverlay.classList.toggle('show');
});

menuOverlay.addEventListener('click', () => {
  settingsMenu.classList.remove('show');
  menuOverlay.classList.remove('show');
});

   const footerButtons = document.querySelectorAll('.footer-nav .switch-btn');

  footerButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      // Remove active from all buttons
      footerButtons.forEach(b => b.classList.remove('active'));

      // Add active to the clicked one
      btn.classList.add('active');
    });
  });
</script>

</body>
</html>
