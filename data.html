<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#07081d">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Data</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<style>
/* ---- Full CSS + popup + editable table ---- */
body { margin:0; background:#07081d; color:#f0f4ff; font-family:Inter, sans-serif; }
#topHeader { position:sticky; top:0; display:flex; justify-content:space-between; padding:10px 18px; background:#07081d; }
#tableContainer { overflow:auto; padding:12px; }
table { width:max-content; min-width:100%; border-collapse:collapse; }
th, td { padding:6px 10px; border-bottom:1px solid rgba(255,255,255,0.1); white-space:nowrap; }
thead th { background:rgba(255,255,255,0.15); position:sticky; top:0; }
td:first-child, th:first-child { position:sticky; left:0; background:#0009; backdrop-filter:blur(4px); }
.edit-btn { cursor:pointer; color:#8d4585; font-weight:700; }
/* popup */
.edit-popup { position:fixed; inset:0; display:flex; justify-content:center; align-items:center; background:rgba(0,0,0,0.6); backdrop-filter:blur(4px); }
.popup-box { background:#1a1b2f; padding:20px; border-radius:14px; width:280px; }
.popup-box h3 { margin-top:0; }
.popup-box select, .popup-box input { width:100%; padding:8px; margin:8px 0; border-radius:8px; border:none; }
.popup-btns { display:flex; gap:10px; margin-top:10px; }
.popup-btns button { flex:1; padding:8px; border:none; border-radius:10px; cursor:pointer; }
.hidden { display:none; }
</style>
</head>
<body>
<header id="topHeader">
  <div id="dayOfWeek">Data</div>
  <button id="btnSettings">☰</button>
</header>
<div id="tableContainer"></div>

<!-- Edit Popup -->
<div id="editPopup" class="edit-popup hidden">
  <div class="popup-box">
    <h3 id="popupTitle"></h3>
    <select id="popupSelect"></select>
    <input id="popupText" class="hidden" placeholder="Enter text..." />
    <div class="popup-btns">
      <button id="popupSave">Save</button>
      <button id="popupCancel">Cancel</button>
    </div>
  </div>
</div>

<script>
/* ------------ OPTION B: CUSTOM OPTIONS PER CATEGORY -------------- */
const OPTIONS = {
  yesno: ["Yes", "No"],
  symptoms: ["None", "Headache", "Nausea", "Fatigue", "Pain"],
  mental: ["OK", "Low", "Anxious", "Irritable", "Calm"],
  movement: ["None", "Walk", "Gym", "Yoga", "Stretching"],
  diet: ["Normal", "Healthy", "Overate", "Undereat", "Takeout"],
  house: ["Clean", "Messy", "Average"],
  alcohol: ["None", "Caffeine", "Alcohol", "Both"],
  relationship: ["Good", "Neutral", "Bad"],
  body: ["Fine", "Sore", "Stiff", "Bloated"],
  default: []
};

/* Map keys → option groups */
const KEY_OPTION_MAP = {
  sickness:"symptoms",
  most_prominent:"mental",
  food_desc:"diet",
  movement:"movement",
  house_state:"house",
  caffeine_alcohol:"alcohol",
  feel_with_L:"relationship",
  body_feelings:"body"
};

const LABELS = { wake_time:"Wake up", how_slept:"Sleep", temp:"Take temp", made_bed:"Made Bed", took_meds_morn:"Took meds", tidy_up:"Tidied", shower_morn:"Showered", get_dressed:"Dressed", led_mask_morn:"LED Mask", skincare_morn:"Skincare AM", eat_breakfast:"Breakfast", supplements_morn:"Supplements", brush_teeth_morn:"Teeth AM", psyllium:"Psyllium", magnesium:"Magnesium", pillowcase:"Pillowcase", shower_night:"Showered PM", skincare_night:"Skincare PM", teeth_night:"Teeth PM", flossed:"Flossed", left_house:"Left House", caffeine_alcohol:"Caffeine/Alcohol", sickness:"Symptoms", saw_dogs:"Saw Dogs", feel_with_L:"Relationship", house_state:"House", drove:"Driving", body_feelings:"Body", food_desc:"Diet", most_prominent:"Mental", meds:"Extra Meds", sensory_triggers:"Sensory Triggers", appointments:"Appointments", movement:"Movement", talked_to_anyone:"People", wellness:"Wellness", creative:"Creative", closed_eyes_time:"Closed Eyes" };

const MORNING_CHECKLIST_KEYS = ["temp","made_bed","took_meds_morn","tidy_up","shower_morn","get_dressed","led_mask_morn","skincare_morn","eat_breakfast","supplements_morn","brush_teeth_morn"];
const INDIVIDUAL_MORNING_ITEMS=["eat_breakfast","took_meds_morn","brush_teeth_morn","supplements_morn"];
const NIGHT_KEYS=["psyllium","magnesium","pillowcase","shower_night","skincare_night","teeth_night","flossed","left_house","caffeine_alcohol","sickness","saw_dogs","feel_with_L","house_state","drove","body_feelings","food_desc","most_prominent","meds","sensory_triggers","appointments","movement","talked_to_anyone","wellness","creative","closed_eyes_time"];

function buildTable(){
  const raw = JSON.parse(localStorage.getItem("dailyTrackerData")||"{}");
  const days = Object.keys(raw).sort((a,b)=>{const p=d=>{let[x,y,z]=d.split('/').map(Number);return new Date(z,y-1,x)};return p(b)-p(a)});
  if(!days.length){ document.querySelector('#tableContainer').innerHTML='<p>No data.</p>'; return; }

  let items=[{key:"AM_routine",label:"AM %"},...INDIVIDUAL_MORNING_ITEMS.map(k=>({key:k,label:LABELS[k]})),...NIGHT_KEYS.map(k=>({key:k,label:LABELS[k]}))];

  let html='<table><thead><tr><th>Edit</th><th>Date</th>';
  items.forEach(i=>html+=`<th>${i.label}</th>`);
  html+='</tr></thead><tbody>';

  days.forEach(day=>{
    const dayData=raw[day]||{};
    const answers={...(dayData.morning?.answers||{}),...(dayData.night?.answers||{})};

    html+=`<tr data-day="${day}">
      <td><span class="edit-btn">✎</span></td>
      <td><strong>${day}</strong></td>`;

    items.forEach(it=>{
      if(it.key==="AM_routine"){
        const total=MORNING_CHECKLIST_KEYS.length;
        const done=MORNING_CHECKLIST_KEYS.filter(k=>answers[k]==="Yes").length;
        html+=`<td class="cell-readonly">${Math.round(done/total*100)}%</td>`;
      } else {
        let v=answers[it.key]||"";
        html+=`<td class="editable" data-key="${it.key}">${v}</td>`;
      }
    });

    html+='</tr>';
  });

  html+='</tbody></table>';
  document.querySelector('#tableContainer').innerHTML=html;
}
buildTable();

/* ---------------- POPUP HANDLING ---------------- */
const popup=document.querySelector('#editPopup');
const popupTitle=document.querySelector('#popupTitle');
const popupSelect=document.querySelector('#popupSelect');
const popupText=document.querySelector('#popupText');
let currentDay=null, currentKey=null;

function openPopup(day,key,label,value){
  currentDay=day; currentKey=key;
  popupTitle.textContent=label;

  let optionGroup = KEY_OPTION_MAP[key] || "yesno";
  let opts = OPTIONS[optionGroup] || [];

  popupSelect.innerHTML = opts.map(o=>`<option value="${o}">${o}</option>`).join('') + '<option value="__TEXT__">Enter text…</option><option value="">Clear</option>';

  popupSelect.classList.remove('hidden');
  popupText.classList.add('hidden');

  popupSelect.value = opts.includes(value)?value : "__TEXT__";
  if(popupSelect.value==="__TEXT__"){ popupText.classList.remove('hidden'); popupText.value=value||""; }

  popup.classList.remove('hidden');
}

popupSelect.onchange=()=>{
  if(popupSelect.value==="__TEXT__"){
    popupText.classList.remove('hidden');
  } else popupText.classList.add('hidden');
};

/* Save */
document.querySelector('#popupSave').onclick=()=>{
  const raw=JSON.parse(localStorage.getItem("dailyTrackerData")||"{}");
  const day=raw[currentDay];
  if(!day) return;

  const v = popupSelect.value==="__TEXT__" ? popupText.value.trim() : popupSelect.value;

  if(MORNING_CHECKLIST_KEYS.includes(currentKey)){
    day.morning = day.morning||{};
    day.morning.answers = day.morning.answers||{};
    day.morning.answers[currentKey]=v;
  } else {
    day.night = day.night||{};
    day.night.answers = day.night.answers||{};
    day.night.answers[currentKey]=v;
  }

  localStorage.setItem('dailyTrackerData', JSON.stringify(raw));
  popup.classList.add('hidden');
  buildTable();
};

document.querySelector('#popupCancel').onclick=()=>popup.classList.add('hidden');

/* Click handlers */
document.addEventListener('click',e=>{
  if(e.target.classList.contains('editable')){
    const td=e.target;
    const tr=td.closest('tr');
    openPopup(tr.dataset.day, td.dataset.key, LABELS[td.dataset.key], td.textContent.trim());
  }
});
</script>
</body>
</html>
