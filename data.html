<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Data Table</title>
<style>
    body {
        font-family: Inter, sans-serif;
        padding: 20px;
        background: #0a0f2c;
        color: #fff;
    }

    h2 { margin-top: 0; }

    table {
        width: 100%;
        border-collapse: collapse;
        background: rgba(255,255,255,0.05);
        border-radius: 10px;
        overflow: hidden;
        margin-top: 20px;
    }
    thead {
        background: rgba(255,255,255,0.15);
    }
    th, td {
        padding: 10px;
        border-bottom: 1px solid rgba(255,255,255,0.1);
        text-align: left;
        font-size: 0.9rem;
    }
    tr:last-child td {
        border-bottom: none;
    }
</style>
</head>
<body>

<h2>Data Table</h2>
<div id="tableContainer"></div>

<script>
const LABELS = {
  wake_time: "Wake Up Time",
  how_slept: "Sleep Quality",
  temp: "Took temperature",
  made_bed: "Made bed",
  kettle: "Boiled kettle",
  took_meds_morn: "Morning medication",
  tidy_up: "Tidied up",
  tea: "Had tea",
  poop: "Bathroom visit",
  shower_morn: "Showered (morning)",
  get_dressed: "Got dressed",
  led_mask_morn: "LED mask",
  skincare_morn: "Skincare morning",
  eat_breakfast: "Breakfast",
  supplements_morn: "Supplements",
  brush_teeth_morn: "Brushed teeth (morning)",
  psyllium: "Psyllium",
  magnesium: "Magnesium",
  pillowcase: "Changed pillowcase",
  shower_night: "Showered (night)",
  skincare_night: "Skincare night",
  teeth_night: "Brushed teeth (night)",
  flossed: "Flossed",
  left_house: "Left house",
  caffeine_alcohol: "Caffeine / Alcohol",
  sickness: "Symptoms",
  saw_dogs: "Saw dogs",
  feel_with_L: "Feeling with L",
  house_state: "House state",
  drove: "Driving",
  body_feelings: "Body feelings",
  food_desc: "Food",
  most_prominent: "Most prominent mental state",
  meds: "Extra meds",
  sensory_triggers: "Sensory triggers",
  appointments: "Appointments",
  movement: "Movement",
  talked_to_anyone: "Interacted with people",
  wellness: "Wellness",
  creative: "Creative",
  closed_eyes_time: "Closed Eyes Time"
};

function yesNoToSymbols(value) {
  if (value === "Yes") return "✓";
  if (value === "No") return "✗";
  return value;
}

function buildTable() {
  const data = JSON.parse(localStorage.getItem("dailyTrackerData") || "{}");
  const days = Object.keys(data);

  if (days.length === 0) {
    document.getElementById("tableContainer").innerHTML = "<p>No saved data.</p>";
    return;
  }

  let html = `<table>
    <thead>
      <tr>
        <th>Date</th>
        <th>Field</th>
        <th>Value</th>
      </tr>
    </thead><tbody>`;

  days.forEach(day => {
    const entry = data[day];

    if (!entry.answers) return;

    for (const key in entry.answers) {
      let value = entry.answers[key];

      if (Array.isArray(value)) {
        value = value.map(v => yesNoToSymbols(v)).join(", ");
      } else {
        value = yesNoToSymbols(value);
      }

      html += `
        <tr>
          <td>${day}</td>
          <td>${LABELS[key] || key}</td>
          <td>${value}</td>
        </tr>
      `;
    }
  });

  html += "</tbody></table>";
  document.getElementById("tableContainer").innerHTML = html;
}

buildTable();
</script>

</body>
</html>
