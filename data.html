<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Data Table</title>
<style>
    body {
        font-family: Inter, sans-serif;
        padding: 20px;
        background: #0a0f2c;
        color: #fff;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
        background: rgba(255,255,255,0.05);
        border-radius: 10px;
        overflow-x: scroll;
        display: block;
        white-space: nowrap;
    }

    thead {
        background: rgba(255,255,255,0.15);
    }

    th, td {
        padding: 10px;
        border-bottom: 1px solid rgba(255,255,255,0.1);
        text-align: left;
        font-size: 0.85rem;
    }

    th {
        font-weight: 600;
    }

    tr:last-child td {
        border-bottom: none;
    }

    /* Make first column sticky for easier reading */
    td:first-child, th:first-child {
        position: sticky;
        left: 0;
        background: rgba(0,0,0,0.6);
        backdrop-filter: blur(4px);
        z-index: 2;
    }
</style>
</head>
<body>

<h2>Data Table</h2>
<div id="tableContainer"></div>

<script>
const LABELS = {
  wake_time: "Wake Up Time",
  how_slept: "Sleep Quality",
  temp: "Temperature",
  made_bed: "Made Bed",
  kettle: "Kettle",
  took_meds_morn: "Meds (Morning)",
  tidy_up: "Tidied Up",
  tea: "Tea",
  poop: "Bathroom",
  shower_morn: "Shower (Morning)",
  get_dressed: "Dressed",
  led_mask_morn: "LED Mask",
  skincare_morn: "Skincare (Morning)",
  eat_breakfast: "Breakfast",
  supplements_morn: "Supplements",
  brush_teeth_morn: "Teeth (Morning)",
  psyllium: "Psyllium",
  magnesium: "Magnesium",
  pillowcase: "Pillowcase",
  shower_night: "Shower (Night)",
  skincare_night: "Skincare (Night)",
  teeth_night: "Teeth (Night)",
  flossed: "Flossed",
  left_house: "Left House",
  caffeine_alcohol: "Caffeine/Alcohol",
  sickness: "Symptoms",
  saw_dogs: "Saw Dogs",
  feel_with_L: "Feeling w/ L",
  house_state: "House State",
  drove: "Driving",
  body_feelings: "Body Feelings",
  food_desc: "Food",
  most_prominent: "Mental State",
  meds: "Extra Meds",
  sensory_triggers: "Sensory Triggers",
  appointments: "Appointments",
  movement: "Movement",
  talked_to_anyone: "People",
  wellness: "Wellness",
  creative: "Creative",
  closed_eyes_time: "Closed Eyes"
};

function yesNoToSymbol(v) {
  if (v === "Yes") return "✓";
  if (v === "No") return "✗";
  return v;
}

function buildTable() {
  const raw = JSON.parse(localStorage.getItem("dailyTrackerData") || "{}");
  const days = Object.keys(raw);

  if (days.length === 0) {
    document.getElementById("tableContainer").innerHTML = "<p>No data saved.</p>";
    return;
  }

  // Collect all possible keys across all days
  const allKeys = new Set();
  days.forEach(day => {
    const answers = raw[day]?.answers || {};
    Object.keys(answers).forEach(k => allKeys.add(k));
  });

  const columns = Array.from(allKeys);

  // Build header
  let html = `<table><thead><tr><th>Date</th>`;
  columns.forEach(key => {
    html += `<th>${LABELS[key] || key}</th>`;
  });
  html += `</tr></thead><tbody>`;

  // Build rows
  days.forEach(day => {
    const answers = raw[day]?.answers || {};

    html += `<tr><td><strong>${day}</strong></td>`;

    columns.forEach(key => {
      let value = answers[key] ?? "";

      if (Array.isArray(value)) {
        value = value.map(v => yesNoToSymbol(v)).join(", ");
      } else {
        value = yesNoToSymbol(value);
      }

      html += `<td>${value}</td>`;
    });

    html += `</tr>`;
  });

  html += `</tbody></table>`;

  document.getElementById("tableContainer").innerHTML = html;
}

buildTable();
</script>

</body>
</html>
