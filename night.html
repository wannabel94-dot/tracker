<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#07081d" id="navColor">
<meta name="viewport" content="width=device-width,initial-scale=1">
   <!-- Theme color for Android navigation bar -->
<title>Daily Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<style>
/* ===============================================
   ROOT VARIABLES
================================================= */
:root {
  --text: #f0f4ff;
  --card-radius: 14px;
  --bg-blur: 6px;
  --glass-bg: rgba(255,255,255,0.08);
  --glass-border: rgba(255,255,255,0.12);
  font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial;
}

/* ===============================================
   GLOBAL SETTINGS
================================================= */
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body {
  margin: 0;
  padding: 0 18px 90px;
  min-height: 100vh;
  color: var(--night-text);
}

/* ===============================================
   BACKGROUNDS
================================================= */
/* NIGHT MODE */
body.night {
 background: #07081d;
--bg-color: #07081d; /* used for the cutout */
}

/* ===============================================
   STICKY HEADER (Day + Menu)
================================================= */
#topHeader {
  position: sticky;
  top: 0;
  left: 0;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 18px;
  z-index: 100;
}

/* Day of Week text inside header */
#dayOfWeek {
  flex: 1;
  text-align: center;
  font-size: 1rem;
  font-weight: 600;
  color: #f0f4ff;
  margin: 0;
  pointer-events: none; /* text is not interactive */
}

/* Settings / Menu button */
#btnSettings {
  background: transparent;
  border: none;
  font-size: 24px;
  color: #fff;
  cursor: pointer;
  padding: 8px;
  z-index: 101;
  position: relative;
  min-width: 40px;
  min-height: 40px;
}

#btnSettings:hover {
  color: #ddd;
}
#dataBtn {
  background: transparent;
  border: none;
  color: #fff;
  cursor: pointer;
  padding: 8px;
  z-index: 101;
  position: relative;
  min-width: 40px;
  min-height: 40px;
}

   #dataBtn img {
  width: 22px;
  height: 22px;
  object-fit: contain;
   filter:invert(1);
}

   /* pop up */-------------------------------
   
.popup-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.5);
    display: flex;
    justify-content: center;
    align-items: center; /* vertically centers popup */
    z-index: 5000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
}

.popup-overlay.show {
    opacity: 1;
    pointer-events: all;
}

.popup-box {
    background: #1e1e35;
    padding: 20px;
    border-radius: 16px;
    text-align: center;
    min-width: 280px;
    max-width: 90%;        /* prevent overflow on small screens */
    transform: translateY(100px);
    transition: transform 0.3s ease, opacity 0.3s ease;
    opacity: 0;
    box-sizing: border-box;
}

.popup-overlay.show .popup-box {
    transform: translateY(0);
    opacity: 1;
}

.popup-box.hide {
    transform: translateY(100px);
    opacity: 0;
}

/* ==============================================
   WRAP / MAIN CONTENT
================================================= */
.wrap {
  width: 100%;
  max-width: 740px;
  margin: 0 auto;
  position: absolute;
  top: 60px;      /* header height */
  bottom: 60px;   /* footer height */
  left: 0;
  right: 0;
  padding: 18px;
}
/* ===============================================
   FIXED FOOTER NAV
================================================= */
.footer-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 60px;
  background: #303f5c;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 25px;
}

.left-group, .right-group {
  display: flex;
  justify-content: space-between; /* even spacing between buttons */
  width: 120px; /* adjust width to fit 2 buttons evenly */
  margin: 0;
  gap: 0; /* spacing is controlled by flex */
}


/* Circular cutout behind the button */
.footer-nav::before {
  content: '';
  position: absolute;
  top: -25px; /* half the cutout height */
  left: 50%;
  transform: translateX(-50%);
  width: 60px;
  height: 60px;
  background: var(--bg-color); /* match page background */
  border-radius: 50%;
  z-index: 110; /* below the button */
}

.floating-center-btn {
  position: fixed; /* outside the footer */
  bottom: 30px; /* vertically center it in the cutout */
  left: 50%;
  transform: translateX(-50%);
  width: 50px;  /* same as cutout */
  height: 50px;
  border-radius: 50%;
  background: #ccd4ef;
  border: none;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 36px;
  font-weight: 700;
  color: #000;
  cursor: pointer;
  z-index: 130; /* above footer and cutout */
}

.footer-nav .switch-btn { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; padding:6px 0; width: 50px; background:transparent; border:none; cursor:pointer; border-radius:12px; }
.footer-nav .switch-btn img { width:22px; height:22px; opacity:0.9; filter:invert(1); }
.footer-nav .switch-btn span { color:#fff; font-weight:600; }
.footer-nav .switch-btn.active span { color:#8d4585; font-weight:700; }
/* ===============================================
   TIME INPUT
================================================= */
input[type="time"] {
     grid-column: 1 / -1; /* span all columns in the grid */
  width: 100%;                  /* span full width of card */
  padding: 14px 18px;           /* match option padding */
  font-size: 17px;               /* match option font size */
  font-weight: 500;
  border-radius: 16px;           /* rounded pill shape */
  border: 1px solid rgba(255,255,255,0.12); /* like opt-btn */
  background: rgba(255,255,255,0.05);
  color: #f0f4ff;                /* match opt-btn text */
  text-align: center;            /* center time text */
  font-family: inherit;
  cursor: pointer;
  -webkit-appearance: none;      /* remove default arrow styles */
  -moz-appearance: none;
  appearance: none;
  transition: transform 0.2s, background 0.2s;
}

input[type="time"]:hover {
  background: rgba(255,255,255,0.10);
  transform: scale(1.02);
}

input[type="time"]:focus {
  outline: none;
  border: 1px solid rgba(255,255,255,0.6);
  background: rgba(255,255,255,0.12);
}

/* ===============================================
   ANSWER BUTTONS
================================================= */
.opt-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 14px 18px;
  border-radius: 16px;
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--glass-border);
  font-size: 17px;
  font-weight: 500;
  color: #f0f4ff;
  cursor: pointer;
  transition: transform 0.2s, background 0.2s;
  text-align: center;
  user-select: none;
}
.opt-btn:hover { background: rgba(255,255,255,0.10); transform: scale(1.02); }
.opt-btn.selected {
  background: rgba(255,255,255,0.25);
  border-color: rgba(255,255,255,0.5);
  box-shadow: 0 0 10px rgba(255,255,255,0.22);
  transform: scale(1.04);
}
body.morning .opt-btn { background: rgba(255,255,255,0.15); color: var(--morning-text); border-color: rgba(255,255,255,0.25); }
body.night .opt-btn { background: rgba(255,255,255,0.05); color:#fff; border-color: rgba(255,255,255,0.12); }
body.morning .opt-btn.selected { background: rgba(255,255,255,0.35); border-color: rgba(255,255,255,0.5); }
body.night .opt-btn.selected { background: rgba(255,255,255,0.25); border-color: rgba(255,255,255,0.4); }

/* ===============================================
   QUESTIONS + ICONS
================================================= */
.question-with-icon { display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:12px; text-align:left; }
.question-text { font-size:18px; font-weight:600; color:#f0f4ff; }
.question-icon {
  width:38px; height:38px; border-radius:50%;
  background: rgba(255,255,255,0.12);
  display:flex; justify-content:center; align-items:center;
  flex-shrink:0;
  transition: background 0.25s, transform 0.2s;
}
.question-icon img { width:60%; height:60%; filter:invert(1); }
.question-icon.special-icon img { width:80%; height:80%; }
.question-icon:hover { background: rgba(255,255,255,0.25); transform: scale(1.1); }

/* ===============================================
   DRINK COUNTERS
================================================= */
.drink-pill { display:flex; align-items:center; gap:6px; margin-bottom:12px; background:none; border:none; padding:4px 0; }
.drink-counter .drink-label { font-size:18px; font-weight:500; color:#fff; min-width:72px; }

.drink-pill:hover .icon-circle { background: rgba(255,255,255,0.25); transform: scale(1.05); }
.drink-pill:hover .counter-icon { transform: scale(1.06); opacity:0.95; }

.counter-inner { display:flex; align-items:center; gap:4px; }
.counter-inner .minus, .counter-inner .plus { background:none; border:none; color:#fff; font-weight:700; font-size:22px; cursor:pointer; padding:0 3px; transition: opacity 0.16s; }
.counter-inner .minus:hover, .counter-inner .plus:hover { opacity:0.72; }
.counter-inner span[id^="count-"] { color:#fff; font-size:18px; min-width:20px; text-align:center; }
.drink-counter { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }

.counter-btn { background:transparent; border:none; color:#fff; font-size:20px; cursor:pointer; padding:0 6px; }
.counter-btn:focus { outline:none; }

   /* ===============================================
         secondary icons
 ================================================= */
/* Make the actual icon scale consistently inside the circle */
.icon-circle img,
.icon-circle img.counter-icon {
  width: 22px;               /* fixed visual size inside the 40px circle */
  height: 22px;
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;       /* preserve aspect, center inside the circle */
  display: block;
filter:invert(1);
}

  .icon-circle {
  width: 40px;
  min-width: 40px;           /* prevents shrinking on narrow icons */
  height: 40px;
  border-radius: 50%;
  display: flex;
  justify-content: center;
  align-items: center;
  background: rgba(255,255,255,0.15);
  flex: 0 0 40px;            /* fixed flex-basis so text always starts the same */
  transition: background 0.25s ease, transform 0.2s ease;
}
/* ===============================================
   MENU
================================================= */
.settings-menu {
  position: fixed; top:0; left:0; height:100vh; width:50%;
  background: rgba(0,0,0,0.7); backdrop-filter: blur(18px) saturate(180%);
  display:flex; flex-direction:column; align-items:stretch;
  padding:20px 0; transform:translateX(-100%); transition: transform 0.4s ease; z-index:200;
}
.settings-menu.show { transform:translateX(0); }
.settings-menu button {
  background:transparent; border:none; padding:16px 20px; width:100%; text-align:left;
  font-weight:600; color:#fff; cursor:pointer; transition: background 0.25s ease, transform 0.2s ease;
}
.settings-menu button:hover { background: rgba(255,255,255,0.15); transform: translateX(6px); }

.menu-overlay { position: fixed; inset:0; background: rgba(0,0,0,0.5); opacity:0; pointer-events:none; transition: opacity 0.3s ease; z-index:150; }
.menu-overlay.show { opacity:1; pointer-events:all; }

/* ===============================================
   CARDS & QUESTIONS
================================================= */
main.card { padding:18px; border-radius:var(--card-radius); min-height:520px; }
.progress-wrap { display:flex; align-items:center; margin-bottom:12px; }
.progress { flex:1.2; height:10px; border-radius:8px; overflow:hidden; background:rgba(255,255,255,0.06); }
.bar { height:100%; width:0%; background:linear-gradient(90deg,rgba(255,255,255,0.15),rgba(255,255,255,0.3)); border-radius:8px; transition:width 0.25s; }
.question { font-size:18px; margin-bottom:12px; font-weight:600; color:#f0f4ff; }
.options { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.options.column-options { display:flex; flex-direction:column; gap:8px; }

/* ===============================================
   MORNING CHECKLIST
================================================= */
.checklist { display:flex; flex-direction:column; gap:8px; padding-bottom:60px; }
.checklist-title { font-size:18px; font-weight:600; color:#f0f4ff; margin-bottom:12px; text-align:center; }
.check-item {
  display: flex;
  align-items: center;
  gap: 12px;                 /* consistent spacing between icon and text */
  margin-bottom: 8px;
  padding: 10px 14px;
  border-radius: 16px;
  background: rgba(255,255,255,0.05);
  cursor: pointer;
  transition: background 0.2s ease;
}.check-item:hover { background:rgba(255,255,255,0.1); }
.check-text {
  flex: 1 1 auto;            /* text fills the remaining width */
  margin: 0;                 /* remove any accidental margin */
  font-weight: 500;
  color: #f0f4ff;
  line-height: 1;            /* tighter control so it aligns vertically */
}.check-item.selected .check-text { text-decoration:line-through; opacity:0.6; }
.checklist-wrapper { max-height:60vh; overflow-y:auto; -webkit-mask-image: linear-gradient(to bottom, black 80%, transparent 100%); }

/* ===============================================
   BACK NEXT BUTTONS
================================================= */
.controls { display:flex; gap:10px; justify-content:space-between; margin-top:16px; }
.back-btn, .next-btn {
  background:rgba(255,255,255,0.15); color:#f0f4ff; font-weight:700;
  border:0; padding:12px 16px; border-radius:12px; cursor:pointer; backdrop-filter:blur(6px);
  transition:opacity 0.2s;
}
.back-btn:hover, .next-btn:hover { opacity:0.85; }
.back-btn[disabled], .next-btn[disabled] { opacity:0.5; cursor:not-allowed; }
.done-note { font-size:20px; text-align:center; font-weight:700; margin-top:80px; }

.back-to-checklist {
  display:inline-block; margin-top:40px; padding:10px 18px; border:none; border-radius:20px;
  background: rgba(255,255,255,0.15); color:#f0f4ff; font-size:16px; font-weight:500; cursor:pointer;
  transition: background 0.25s ease, transform 0.2s ease;
}
.back-to-checklist:hover { background: rgba(255,255,255,0.25); transform: scale(1.05); }

   /* ===============================================
   ANIMATIONS
================================================= */
@keyframes fadeIn { from{opacity:0;} to{opacity:1;} }
@keyframes slideUp { from{transform:translateY(40px); opacity:0;} to{transform:translateY(0); opacity:1;} }

/* ===============================================
   RESPONSIVE / MOBILE
================================================= */
@media (max-width:480px) { 
  body{padding:12px;}
  .opt-btn, .counter-btn{font-size:16px;padding:12px;}
  .counter-icon{width:20px;height:20px;}
  input[type=time]{font-size:16px;padding:12px;}
}

</style>
</head>

</body>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker
      .register('/tracker/service-worker.js')
      .then(reg => console.log('SW registered:', reg))
      .catch(err => console.error('SW registration failed:', err));
  });
}

let currentIndex = 0;
let answers = {};
document.addEventListener('DOMContentLoaded', () => {

let switchTimeout;
let onMorningDoneNote = false; // tracks if we’re showing the morning done note
function getTodayDate() {
    return new Date().toLocaleDateString('en-GB');
}
   const mode = 'night'; // Fixed mode
document.body.classList.add('night');
  
  /* ---------- QUESTIONS ---------- */

   const NIGHT_CHECKLIST_ITEMS = [
{ key: 'prepare_breakfast', label:'Prepare meals', icon:'porridge.svg' },
{ key: 'tidy up_night', label:'Tidy up', icon:'spray.svg' },

{ key: 'shatki', label: 'Shatki mat', icon:'lotus.svg'},
   { key: 'teeth_night', label:'Brush teeth', icon:'toothbrush.svg' },
   { key: 'flossed', label:'Floss teeth', icon:'floss.svg'}   
];

  const NIGHT = [
   { key: 'psyillium', type:'single', label: 'Take psyllium', options:['Yes','No'], autoNext:true, icon:'grain.svg' },

    { key: 'day_description', type:'single', label:'How was today?', options:['Bedrot','Mostly wasted','Chilled','Somewhat productive','Hyperproductive','Busy','Good'], autoNext:true, icon:'clock.svg' },

    {key:'feel_with_L', type:'single', label:'How do you feel with L today?', options:['Elated','Sensitive','Pretty good','Fine','Irritated','Somewhat insecure','Anxiously insecure','Anguish'], autoNext:true, icon: 'l.svg'},

    { key: 'wellness', type:'multi', label:'Do any wellness shit?', options:['Shakti mat','Stretching','Moments of mindfulness','Meditation','Therapy notes','Deep breathing','None'], icon:'lotus.svg' },
    { key: 'creative', type:'multi', label:'Do anything creative?', options:['Painting','DIY','Guitar','Sewing','Van stuff','Reading','None'], icon:'paint.svg' },
    { key: 'closed_eyes_time', type:'time', label:'What time are you closing your eyes?', autoNext:true, icon:'sleeptime.svg', specialIcon:true }
  ];

/****************************************************
 * 1️⃣ GLOBAL ELEMENTS & INITIAL REFERENCES
 ****************************************************/
const contentArea = document.getElementById('contentArea');
const backBtn = document.getElementById('backBtn');
const nextBtn = document.getElementById('nextBtn');
const progressBar = document.getElementById('progressBar');
document.getElementById('todoBtn').onclick = () => { window.location.href = 'todo.html'; };
document.getElementById('dataBtn').onclick = () => { window.location.href = 'data.html'; };
document.getElementById('morningBtn').onclick = () => { window.location.href = 'morning.html'; };

/* Settings menu toggle */
const btnSettings = document.getElementById('btnSettings');
const settingsMenu = document.getElementById('settingsMenu');
const menuOverlay = document.getElementById('menuOverlay');
   settingsMenu.addEventListener("click", () => {
  settingsMenu.classList.remove('show');
  menuOverlay.classList.remove('show');
});

btnSettings.onclick = () => {
  const isOpen = settingsMenu.classList.toggle('show');
  menuOverlay.classList.toggle('show', isOpen);
};
menuOverlay.onclick = () => {
  settingsMenu.classList.remove('show');
  menuOverlay.classList.remove('show');
};

   document.getElementById('btnClearToday').onclick = () => {
    const day = getTodayDate();
    let all = JSON.parse(localStorage.getItem('dailyTrackerData') || '{}');

    if (all[day]) {
        delete all[day];
        localStorage.setItem('dailyTrackerData', JSON.stringify(all));
    }

    // Reset UI state
    currentIndex = 0;
    answers = {};
    onMorningDoneNote = false;

    loadUI();

    alert("Today's data has been cleared.");
};


/****************************************************
 * 2️⃣ MODE & QUESTION HELPERS
 ****************************************************/
const getMode = () => document.body.classList.contains('morning') ? 'morning' : 'night';
const getQuestions = () => getMode() === 'morning' ? MORNING : NIGHT;

/****************************************************
 * 3️⃣ LOCAL STORAGE: LOAD & SAVE
 ****************************************************/
function loadSavedData() {
    const day = getTodayDate();
    const all = JSON.parse(localStorage.getItem('dailyTrackerData') || '{}');
    const isMorning = getMode() === 'morning';
    const modeData = isMorning ? all[day]?.morning : all[day]?.night;

    if (modeData) {
        currentIndex = modeData.currentIndex || 0;
        answers = modeData.answers || {};
    } else {
        currentIndex = 0;
        answers = {};
    }
}

function saveData() {
    const day = getTodayDate();
    let all = JSON.parse(localStorage.getItem('dailyTrackerData')) || {};

    if (!all[day]) all[day] = {};

    if (getMode() === 'morning') {
        all[day].morning = { currentIndex, answers };
    } else {
        all[day].night = { currentIndex, answers };
    }

    localStorage.setItem('dailyTrackerData', JSON.stringify(all));
}

// Save before leaving page
window.addEventListener('beforeunload', saveData);

   function updateDayOfWeek() {

}

function loadUI() {
    updateDayOfWeek();

    const mode = getMode();
    const questions = getQuestions();

    progressBar.parentElement.style.display = 'block';

    // Night checklist logic
    if (mode === 'night') {
        if (currentIndex === -1 || !answers._nightChecklistDone) {
            currentIndex = -1;
            loadNightChecklist();
            return;
        }
    }

    // Night completion - show done note if finished
    if (mode === 'night' && currentIndex >= NIGHT.length) {
        contentArea.innerHTML = '<div class="done-note">Day completed.</div>';
        backBtn.style.display = 'none';
        nextBtn.style.display = 'none';
        updateProgressBar();
        return;
    }

/****************************************************
 * 7️⃣ QUESTION RENDERING FUNCTIONS
 ****************************************************/
   const q = questions[currentIndex];

    let questionHeader = '';
    if (q.icon) {
        const specialClass = q.specialIcon ? ' special-icon' : '';
        questionHeader = `
          <div class="question-with-icon">
            <div class="question-icon${specialClass}">
              <img src="icons/${q.icon}" alt="${q.label}">
            </div>

          </div>
        `;
    } else {
        questionHeader = `<div class="question">${q.label}</div>`;
    }

    let html = questionHeader + `<div class="options${q.key === 'how_slept' ? ' column-options' : ''}">`;

// Render options
if (q.type === 'single') {
    q.options.forEach(opt => {
        const selected = answers[q.key] === opt ? 'selected' : '';
        html += `<button class="opt-btn ${selected}" onclick="selectOption('${opt}')">${opt}</button>`;
    });

} else if (q.type === 'multi' && q.key === 'caffeine_alcohol') {
    if (!answers[q.key]) answers[q.key] = {};
    q.options.forEach(opt => {
        const count = answers[q.key][opt] || 0;
        html += `
          <div class="opt-btn drink-pill">
            <span style="flex:1">${opt}</span>
            <div class="counter-inner">
              <span class="minus" onclick="updateCounter('${opt}', -1)">−</span>
              <span id="count-${opt}">${count}</span>
              <span class="plus" onclick="updateCounter('${opt}', 1)">+</span>
            </div>
          </div>
        `;
    });

    // ✅ Enable next button only for caffeine/alcohol counter
    nextBtn.disabled = false;
    nextBtn.onclick = () => {
        currentIndex++;
        loadUI();
    };

} else if (q.type === 'multi') {
    if (!answers[q.key]) answers[q.key] = [];
    q.options.forEach(opt => {
        const selected = answers[q.key].includes(opt) ? 'selected' : '';
        html += `<button class="opt-btn ${selected}" onclick="toggleMultiOption('${q.key}','${opt}')">${opt}</button>`;
    });

} else if (q.type === 'time') {
    html += `<input type="time" value="${answers[q.key] || ''}" onchange="selectOption(this.value)" />`;
}

html += '</div>';
    contentArea.innerHTML = html;

    backBtn.style.display = currentIndex > 0 ? 'inline-block' : 'none';
    nextBtn.style.display = 'inline-block';
    nextBtn.textContent = 'Next';
    
    // Disable next button for all question types except caffeine/alcohol counter
    if (q.type !== 'multi' || q.key !== 'caffeine_alcohol') {
        nextBtn.disabled = !answers[q.key] || (Array.isArray(answers[q.key]) && answers[q.key].length === 0);
    }
    
    updateProgressBar();
}

/****************************************************
 * 8️⃣ ANSWER HANDLING - SINGLE, MULTI, COUNTER
 ****************************************************/
window.selectOption = (opt) => {
    const q = getQuestions()[currentIndex];
    answers[q.key] = opt;
    saveData();
    nextBtn.disabled = false;
    updateProgressBar();

    // Auto-next if the selected option is "None"
    if (opt === 'None') {
        currentIndex++;
        loadUI();
    } else if (q.autoNext) {
        currentIndex++;
        loadUI();
    }
};

window.toggleMultiOption = (qKey, opt) => {
    if (!answers[qKey]) answers[qKey] = [];
    const selected = answers[qKey].includes(opt);

    if (opt === 'None') {
        // Selecting "None" clears everything else
        answers[qKey] = selected ? [] : ['None'];
    } else {
        // Normal multi-option logic
        answers[qKey] = answers[qKey].filter(o => o !== 'None');
        if (!selected) answers[qKey].push(opt);
        else answers[qKey].splice(answers[qKey].indexOf(opt), 1);
    }

    saveData();

    const val = answers[qKey];
    const hasAnswer = (Array.isArray(val) && val.length > 0) || (typeof val === 'object' && Object.values(val).some(v => v !== 0));
    nextBtn.disabled = !hasAnswer;

    loadUI();

    // Auto-next if "None" was just selected
    if (opt === 'None' && !selected) {
        currentIndex++;
        loadUI();
    }
};

window.updateCounter = (opt, delta) => {
    if (!answers['caffeine_alcohol']) answers['caffeine_alcohol'] = {};
    let val = answers['caffeine_alcohol'][opt] || 0;
    val += delta; if (val < 0) val = 0;
    answers['caffeine_alcohol'][opt] = val;
    const el = document.getElementById(`count-${opt}`);
    if (el) el.textContent = val;
    
    // Always enable next button for counter questions (0 is valid)
    nextBtn.disabled = false;
    
    saveData(); 
    updateProgressBar();
};

nextBtn.onclick = () => {

    if (mode === 'morning') {

        if (!document.querySelector('.checklist-wrapper')) {

    if (mode === 'night') {
        if (currentIndex === -1) {
            answers._nightChecklistDone = true;
            currentIndex = 0;
            saveData();
            loadUI();
            return;
        }

        currentIndex++;
        loadUI();
    }
};

   document.addEventListener('DOMContentLoaded', () => {
  const checkbox = document.getElementById('medicationCheckbox');

  // Initialize checkbox from localStorage
  const alreadyChecked = localStorage.getItem('medChecked') === 'true';
  checkbox.checked = alreadyChecked;

  checkbox.addEventListener('change', (e) => {
    let medTotal = parseInt(localStorage.getItem('medTotal') || '28', 10);

    if (e.target.checked && !alreadyChecked) {
      // Subtract 1 when first checked
      medTotal = Math.max(0, medTotal - 1);
      localStorage.setItem('medChecked', 'true');
    } else if (!e.target.checked && alreadyChecked) {
      // Optional: restore if unchecked
      medTotal += 1;
      localStorage.setItem('medChecked', 'false');
    }

    localStorage.setItem('medTotal', medTotal);
  });
});

nextBtn.onclick = nextNightChecklistHandler;

window.toggleNightChecklist = (key, index) => {
    answers[key] = answers[key] === 'Yes' ? 'No' : 'Yes';
    saveData();

    const el = document.querySelector(`[onclick="toggleNightChecklist('${key}', ${index})"]`);
    if (el) el.classList.toggle('selected', answers[key] === 'Yes');

    nextBtn.disabled = false;

    // Scroll to next item if available
    if (answers[key] === 'Yes' && index + 1 < NIGHT_CHECKLIST_ITEMS.length) {
        const nextKey = NIGHT_CHECKLIST_ITEMS[index + 1].key;
        const nextEl = document.querySelector(`[onclick="toggleNightChecklist('${nextKey}', ${index + 1})"]`);
        if (nextEl) nextEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

       updateProgressBar(); // ✅ Add this line to dynamically update progress


    // Auto-complete if all items checked
    const allDone = NIGHT_CHECKLIST_ITEMS.every(i => answers[i.key] === 'Yes');
    if (allDone) checkNightCompletion();
};

function showNightIncompletePopup(allowAdvance = false) {
    if (document.querySelector('.popup-overlay')) return;

    const overlay = document.createElement('div');
    overlay.className = 'popup-overlay';
    overlay.style.cssText = `
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.5);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        pointer-events: all;
    `;

    overlay.innerHTML = `
        <div class="popup-box" style="background:#1e1e35;padding:20px;border-radius:16px;text-align:center;min-width:280px;pointer-events:auto;">
            <div style="font-size:18px;font-weight:600;margin-bottom:16px;">Checklist unfinished...</div>
            <button class="backBtn" style="margin:6px;padding:10px 16px;border-radius:12px;">Go back</button>
            <button class="saveBtn" style="margin:6px;padding:10px 16px;border-radius:12px;">Save anyway</button>
        </div>
    `;

    document.body.appendChild(overlay);
    requestAnimationFrame(() => overlay.classList.add('show'));

    const backBtn = overlay.querySelector('.backBtn');
    const saveBtn = overlay.querySelector('.saveBtn');

    backBtn.addEventListener('click', () => closePopup(overlay));

saveBtn.addEventListener('click', () => {
        // Always save current answers
        saveData();

        closePopup(overlay, () => {
            if (allowAdvance) {
                // Advance to next question even if checklist is incomplete
                answers._nightChecklistDone = true;
                currentIndex = 0;
                saveData();
                // Reset the next button handler before loading UI
                nextBtn.onclick = null;
                loadUI();
            } else {
                // Scroll to first incomplete item if not advancing
                const nextIndex = NIGHT_CHECKLIST_ITEMS.findIndex(item => answers[item.key] !== 'Yes');
                if (nextIndex !== -1) {
                    const nextKey = NIGHT_CHECKLIST_ITEMS[nextIndex].key;
                    const nextEl = document.querySelector(`[onclick="toggleNightChecklist('${nextKey}', ${nextIndex})"]`);
                    if (nextEl) nextEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }
        });
    });
}

function closePopup(overlay, callback) {
    if (!overlay) return;
    const box = overlay.querySelector('.popup-box');
    box.classList.add('hide');
    overlay.classList.remove('show');
    box.addEventListener('transitionend', () => {
        if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
        if (callback) callback();
    }, { once: true });
}

function checkNightCompletion() {
    answers._nightChecklistDone = true;
    saveData();
    currentIndex = 0;
    loadUI();
}

   function updateProgressBar(){
    const isMorning = getMode() === 'morning';
    const keys = isMorning
        ? ['wake_time','how_slept', ...MORNING_CHECKLIST_ITEMS.map(i=>i.key)]
        : [...NIGHT_CHECKLIST_ITEMS.map(i=>i.key), ...NIGHT.map(q=>q.key)];

    let done = 0;
    keys.forEach(key=>{
        if (MORNING_CHECKLIST_ITEMS.find(i=>i.key===key) && answers[key]==='Yes'){done++; return;}
        if (NIGHT_CHECKLIST_ITEMS.find(i=>i.key===key) && answers[key]==='Yes'){done++; return;}
        const q = NIGHT.find(q=>q.key===key);
        const val = answers[key];
        if(q?.type==='multi'){
            if(val && ((Array.isArray(val)&&val.length>0)||(typeof val==='object'&&Object.values(val).some(v=>v!==0)))) done++;
        } else { if(val) done++; }
    });

    progressBar.style.width = keys.length>0 ? Math.round((done/keys.length)*100)+'%' : '0%';
}
