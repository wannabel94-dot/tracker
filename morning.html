<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#07081d" id="navColor">
<meta name="viewport" content="width=device-width,initial-scale=1">
   <!-- Theme color for Android navigation bar -->
<title>Morning</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<style>
/* ===============================================
   ROOT VARIABLES
================================================= */
:root {
  --text: #f0f4ff;
  --background: #6C5E82;
  --card-radius: 14px;
  --bg-blur: 6px;
  --glass-bg: rgba(255,255,255,0.08);
  --glass-border: rgba(255,255,255,0.12);
  font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial;
}

/* ===============================================
   GLOBAL SETTINGS
================================================= */
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body {
  margin: 0;
  padding: 0;
  min-height: 100vh;
  background: var(--background);
  color: var(--text);
  font-family: inherit;
}

  /* ===============================================
   STICKY HEADER (Day + Menu)
================================================= */
#topHeader {
  position: sticky;
  top: 0;
  left: 0;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 18px;
  z-index: 100;
}

/* Day of Week text inside header */
#dayOfWeek {
  flex: 1;
  text-align: center;
  font-size: 1rem;
  font-weight: 600;
  color: #f0f4ff;
  margin: 0;
  pointer-events: none; /* text is not interactive */
}

/* Settings / Menu button */
#btnSettings {
  background: transparent;
  border: none;
  font-size: 24px;
  color: #fff;
  cursor: pointer;
  padding: 8px;
  z-index: 101;
  position: relative;
  min-width: 40px;
  min-height: 40px;
}

#btnSettings:hover {
  color: #ddd;
}
#dataBtn {
  background: transparent;
  border: none;
  color: #fff;
  cursor: pointer;
  padding: 8px;
  z-index: 101;
  position: relative;
  min-width: 40px;
  min-height: 40px;
}

   #dataBtn img {
  width: 22px;
  height: 22px;
  object-fit: contain;
   filter:invert(1);
}

   /* pop up */-------------------------------
   
.popup-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.5);
    display: flex;
    justify-content: center;
    align-items: center; /* vertically centers popup */
    z-index: 5000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
}

.popup-overlay.show {
    opacity: 1;
    pointer-events: all;
}

.popup-box {
    background: #1e1e35;
    padding: 20px;
    border-radius: 16px;
    text-align: center;
    min-width: 280px;
    max-width: 90%;        /* prevent overflow on small screens */
    transform: translateY(100px);
    transition: transform 0.3s ease, opacity 0.3s ease;
    opacity: 0;
    box-sizing: border-box;
}

.popup-overlay.show .popup-box {
    transform: translateY(0);
    opacity: 1;
}

.popup-box.hide {
    transform: translateY(100px);
    opacity: 0;
}

/* ==============================================
   WRAP / MAIN CONTENT
================================================= */
.wrap {
  width: 100%;
  max-width: 740px;
  margin: 0 auto;
  position: relative;
  padding: 18px;
  padding-top: 60px;  /* space for header */
  padding-bottom: 80px; /* space for footer */
  min-height: calc(100vh - 140px);
}

/* ===============================================
   FIXED FOOTER NAV
================================================= */
.footer-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 60px;
  background: #303f5c;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 25px;
}

.left-group, .right-group {
  display: flex;
  justify-content: space-between; /* even spacing between buttons */
  width: 120px; /* adjust width to fit 2 buttons evenly */
  margin: 0;
  gap: 0; /* spacing is controlled by flex */
}


/* Circular cutout behind the button */
.footer-nav::before {
  content: '';
  position: absolute;
  top: -25px; /* half the cutout height */
  left: 50%;
  transform: translateX(-50%);
  width: 60px;
  height: 60px;
  background: var(--background);
  border-radius: 50%;
  z-index: 110; /* below the button */
}

.floating-center-btn {
  position: fixed; /* outside the footer */
  bottom: 30px; /* vertically center it in the cutout */
  left: 50%;
  transform: translateX(-50%);
  width: 50px;  /* same as cutout */
  height: 50px;
  border-radius: 50%;
  background: #ccd4ef;
  border: none;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 36px;
  font-weight: 700;
  color: #000;
  cursor: pointer;
  z-index: 130; /* above footer and cutout */
}

.footer-nav .switch-btn { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; padding:6px 0; width: 50px; background:transparent; border:none; cursor:pointer; border-radius:12px; }
.footer-nav .switch-btn img { width:22px; height:22px; opacity:0.9; filter:invert(1); }
.footer-nav .switch-btn span { color:#fff; font-weight:600; }
.footer-nav .switch-btn.active span { color:#8d4585; font-weight:700; }
  
/* ===============================================
   TIME INPUT
================================================= */
input[type="time"] {
     grid-column: 1 / -1; /* span all columns in the grid */
  width: 100%;                  /* span full width of card */
  padding: 14px 18px;           /* match option padding */
  font-size: 17px;               /* match option font size */
  font-weight: 500;
  border-radius: 16px;           /* rounded pill shape */
  border: 1px solid rgba(255,255,255,0.12); /* like opt-btn */
  background: rgba(255,255,255,0.05);
  color: #f0f4ff;                /* match opt-btn text */
  text-align: center;            /* center time text */
  font-family: inherit;
  cursor: pointer;
  -webkit-appearance: none;      /* remove default arrow styles */
  -moz-appearance: none;
  appearance: none;
  transition: transform 0.2s, background 0.2s;
}

input[type="time"]:hover {
  background: rgba(255,255,255,0.10);
  transform: scale(1.02);
}

input[type="time"]:focus {
  outline: none;
  border: 1px solid rgba(255,255,255,0.6);
  background: rgba(255,255,255,0.12);
}

/* ===============================================
   ANSWER BUTTONS
================================================= */
.opt-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 14px 18px;
  border-radius: 16px;
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--glass-border);
  font-size: 17px;
  font-weight: 500;
  color: #f0f4ff;
  cursor: pointer;
  transition: transform 0.2s, background 0.2s;
  text-align: center;
  user-select: none;
}
.opt-btn:hover { background: rgba(255,255,255,0.10); transform: scale(1.02); }
.opt-btn.selected {
  background: rgba(255,255,255,0.25);
  border-color: rgba(255,255,255,0.5);
  box-shadow: 0 0 10px rgba(255,255,255,0.22);
  transform: scale(1.04);
}

/* ===============================================
   QUESTIONS + ICONS
================================================= */
.question-with-icon { display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:12px; text-align:left; }
.question-text { font-size:18px; font-weight:600; color:#f0f4ff; }
.question-icon {
  width:38px; height:38px; border-radius:50%;
  background: rgba(255,255,255,0.12);
  display:flex; justify-content:center; align-items:center;
  flex-shrink:0;
  transition: background 0.25s, transform 0.2s;
}
.question-icon img { width:60%; height:60%; filter:invert(1); }
.question-icon.special-icon img { width:80%; height:80%; }
.question-icon:hover { background: rgba(255,255,255,0.25); transform: scale(1.1); }

   /* ===============================================
         secondary icons
 ================================================= */
/* Make the actual icon scale consistently inside the circle */
.icon-circle img,
.icon-circle img.counter-icon {
  width: 22px;               /* fixed visual size inside the 40px circle */
  height: 22px;
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;       /* preserve aspect, center inside the circle */
  display: block;
filter:invert(1);
}

  .icon-circle {
  width: 40px;
  min-width: 40px;           /* prevents shrinking on narrow icons */
  height: 40px;
  border-radius: 50%;
  display: flex;
  justify-content: center;
  align-items: center;
  background: rgba(255,255,255,0.15);
  flex: 0 0 40px;            /* fixed flex-basis so text always starts the same */
  transition: background 0.25s ease, transform 0.2s ease;
}
/* ===============================================
   MENU
================================================= */
.settings-menu {
  position: fixed; top:0; left:0; height:100vh; width:50%;
  background: rgba(0,0,0,0.7); backdrop-filter: blur(18px) saturate(180%);
  display:flex; flex-direction:column; align-items:stretch;
  padding:20px 0; transform:translateX(-100%); transition: transform 0.4s ease; z-index:200;
}
.settings-menu.show { transform:translateX(0); }
.settings-menu button {
  background:transparent; border:none; padding:16px 20px; width:100%; text-align:left;
  font-weight:600; color:#fff; cursor:pointer; transition: background 0.25s ease, transform 0.2s ease;
}
.settings-menu button:hover { background: rgba(255,255,255,0.15); transform: translateX(6px); }

.menu-overlay { position: fixed; inset:0; background: rgba(0,0,0,0.5); opacity:0; pointer-events:none; transition: opacity 0.3s ease; z-index:150; }
.menu-overlay.show { opacity:1; pointer-events:all; }

/* ===============================================
   CARDS & QUESTIONS
================================================= */
main.card { padding:18px; border-radius:var(--card-radius); min-height:520px; }
.progress-wrap { display:flex; align-items:center; margin-bottom:12px; }
.progress { flex:1.2; height:10px; border-radius:8px; overflow:hidden; background:rgba(255,255,255,0.06); }
.bar { height:100%; width:0%; background:linear-gradient(90deg,rgba(255,255,255,0.15),rgba(255,255,255,0.3)); border-radius:8px; transition:width 0.25s; }
.question { font-size:18px; margin-bottom:12px; font-weight:600; color:#f0f4ff; }
.options { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.options.column-options { display:flex; flex-direction:column; gap:8px; }

/* ===============================================
   MORNING CHECKLIST
================================================= */
.checklist { display:flex; flex-direction:column; gap:8px; padding-bottom:60px; }
.checklist-title { font-size:18px; font-weight:600; color:#f0f4ff; margin-bottom:12px; text-align:center; }
.check-item {
  display: flex;
  align-items: center;
  gap: 12px;                 /* consistent spacing between icon and text */
  margin-bottom: 8px;
  padding: 10px 14px;
  border-radius: 16px;
  background: rgba(255,255,255,0.05);
  cursor: pointer;
  transition: background 0.2s ease;
}.check-item:hover { background:rgba(255,255,255,0.1); }
.check-text {
  flex: 1 1 auto;            /* text fills the remaining width */
  margin: 0;                 /* remove any accidental margin */
  font-weight: 500;
  color: #f0f4ff;
  line-height: 1;            /* tighter control so it aligns vertically */
}.check-item.selected .check-text { text-decoration:line-through; opacity:0.6; }
.checklist-wrapper { max-height:60vh; overflow-y:auto; -webkit-mask-image: linear-gradient(to bottom, black 80%, transparent 100%); }

/* ===============================================
   BACK NEXT BUTTONS
================================================= */
.controls { display:flex; gap:10px; justify-content:space-between; margin-top:16px; }
.back-btn, .next-btn {
  background:rgba(255,255,255,0.15); color:#f0f4ff; font-weight:700;
  border:0; padding:12px 16px; border-radius:12px; cursor:pointer; backdrop-filter:blur(6px);
  transition:opacity 0.2s;
}
.back-btn:hover, .next-btn:hover { opacity:0.85; }
.back-btn[disabled], .next-btn[disabled] { opacity:0.5; cursor:not-allowed; }
.done-note { font-size:20px; text-align:center; font-weight:700; margin-top:80px; }

.back-to-checklist {
  display:inline-block; margin-top:40px; padding:10px 18px; border:none; border-radius:20px;
  background: rgba(255,255,255,0.15); color:#f0f4ff; font-size:16px; font-weight:500; cursor:pointer;
  transition: background 0.25s ease, transform 0.2s ease;
}
.back-to-checklist:hover { background: rgba(255,255,255,0.25); transform: scale(1.05); }
/* ===============================================
   MORNING CHECKLIST
================================================= */
.checklist { display:flex; flex-direction:column; gap:8px; padding-bottom:60px; }
.checklist-title { font-size:18px; font-weight:600; color:#f0f4ff; margin-bottom:12px; text-align:center; }
.check-item {
  display: flex;
  align-items: center;
  gap: 12px;                 /* consistent spacing between icon and text */
  margin-bottom: 8px;
  padding: 10px 14px;
  border-radius: 16px;
  background: rgba(255,255,255,0.05);
  cursor: pointer;
  transition: background 0.2s ease;
}.check-item:hover { background:rgba(255,255,255,0.1); }
.check-text {
  flex: 1 1 auto;            /* text fills the remaining width */
  margin: 0;                 /* remove any accidental margin */
  font-weight: 500;
  color: #f0f4ff;
  line-height: 1;            /* tighter control so it aligns vertically */
}.check-item.selected .check-text { text-decoration:line-through; opacity:0.6; }
.checklist-wrapper { max-height:60vh; overflow-y:auto; -webkit-mask-image: linear-gradient(to bottom, black 80%, transparent 100%); }

   /* ===============================================
   ANIMATIONS
================================================= */
@keyframes fadeIn { from{opacity:0;} to{opacity:1;} }
@keyframes slideUp { from{transform:translateY(40px); opacity:0;} to{transform:translateY(0); opacity:1;} }

/* ===============================================
   RESPONSIVE / MOBILE
================================================= */
@media (max-width:480px) { 
  body{padding:12px;}
  .opt-btn, .counter-btn{font-size:16px;padding:12px;}
  .counter-icon{width:20px;height:20px;}
  input[type=time]{font-size:16px;padding:12px;}
}

</style>
</head>
<body class="morning">
  <!-- Sticky header -->
  <header id="topHeader">
    <button class="switch-btn data" id="dataBtn"><img src="icons/chart.svg" alt="Data"></button>
    <div id="dayOfWeek">Monday</div>
    <button id="btnSettings">☰</button>
  </header>

  <!-- Menu overlay & settings -->
  <div id="menuOverlay" class="menu-overlay"></div>
  <div id="settingsMenu" class="settings-menu">
    <button id="btnExport">Export data</button>
    <button id="btnClearToday">Clear Today's Data</button>
  </div>

  <!-- Main content wrapper -->
  <div class="wrap">
    <main class="card">
      <div class="progress-wrap"><div class="progress"><div class="bar" id="progressBar"></div></div></div>
      <div id="contentArea"></div>
      <div class="controls">
        <button class="back-btn" id="backBtn">Back</button>
        <button class="next-btn" id="nextBtn">Next</button>
      </div>
    </main>
  </div>

  <!-- Sticky footer nav -->
<footer class="footer-nav">
  <div class="left-group">
    <button class="switch-btn home" id="homeBtn"><img src="icons/home.svg" alt="Home"><span>Home</span></button>
  </div>
  <div class="right-group">
    <button class="switch-btn todo" id="todoBtn"><img src="icons/todo.svg" alt="todo"><span>To-do</span></button>
  </div>
</footer>
<button class="floating-center-btn" id="centralBtn">+</button>

</body>
<script>
document.addEventListener('DOMContentLoaded', () => {

  /******************************
   * SERVICE WORKER REGISTRATION
   ******************************/
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker
        .register('/tracker/service-worker.js')
        .then(reg => console.log('SW registered:', reg))
        .catch(err => console.error('SW registration failed:', err));
    });
  }

  /******************************
   * GLOBAL VARIABLES
   ******************************/
  let currentIndex = 0;
  let answers = {};
  let switchTimeout = null;
  let onMorningDoneNote = false;
  const mode = 'morning'; // fixed mode

  document.body.classList.add('morning');

  /******************************
   * QUESTIONS & CHECKLIST
   ******************************/
  const MORNING = [
    { key: 'wake_time', type: 'time', label: 'What time did you wake up?', icon: 'alarm.svg', autoNext: true },
    { key: 'how_slept', type: 'single', label: 'How do you think you slept?', options: [
      'Went to bed late but slept in','Went to bed late but woke early',
      'Went to bed early but woke really early',"Couldn't fall asleep",
      'Lightly disrupted','Frequently disrupted','Fine'], autoNext:true, icon: 'zzz.svg' }
  ];

  const MORNING_CHECKLIST_ITEMS = [
    { key: 'temp', label: 'Take temp', icon: 'temp.svg' },
    { key: 'made_bed', label: 'Make bed', icon: 'bedsheet.svg' },
    { key: 'kettle', label: 'Boil kettle', icon: 'kettle1.svg' },
    { key: 'took_meds_morn', label: 'Take meds', icon: 'blister.svg' },
    { key: 'tidy_up', label: 'Tidy up', icon: 'dish.svg' },
    { key: 'tea', label: 'Have tea', icon: 'tea.svg' },
    { key: 'poop', label: 'Poop', icon: 'poop.svg' },
    { key: 'shower_morn', label: 'Shower', icon: 'shower.svg' },
    { key: 'change_towel', label: 'Change towel', icon: 'towel.svg' },
    { key: 'led_mask_morn', label: 'LED mask', icon: 'led.svg' },
    { key: 'get_dressed', label: 'Get dressed', icon: 'hanger.svg' },
    { key: 'skincare_morn', label: 'Skincare', icon: 'dropper.svg' },
    { key: 'eat_breakfast', label: 'Breakfast', icon: 'break2.svg' },
    { key: 'supplements_morn', label: 'Supplements', icon: 'supplements-cropped.svg' },
    { key: 'brush_teeth_morn', label: 'Brush teeth', icon: 'toothbrush.svg' }
  ];

  /******************************
   * GLOBAL ELEMENTS
   ******************************/
  const contentArea = document.getElementById('contentArea');
  const backBtn = document.getElementById('backBtn');
  const nextBtn = document.getElementById('nextBtn');
  const progressBar = document.getElementById('progressBar');

  document.getElementById('homeBtn').onclick = () => { window.location.href = 'index.html'; };
  document.getElementById('todoBtn').onclick = () => { window.location.href = 'todo.html'; };
  document.getElementById('dataBtn').onclick = () => { window.location.href = 'data.html'; };

  const btnSettings = document.getElementById('btnSettings');
  const settingsMenu = document.getElementById('settingsMenu');
  const menuOverlay = document.getElementById('menuOverlay');

  btnSettings.onclick = () => {
    const isOpen = settingsMenu.classList.toggle('show');
    menuOverlay.classList.toggle('show', isOpen);
  };
  menuOverlay.onclick = () => {
    settingsMenu.classList.remove('show');
    menuOverlay.classList.remove('show');
  };
  settingsMenu.addEventListener("click", () => {
    settingsMenu.classList.remove('show');
    menuOverlay.classList.remove('show');
  });

  /******************************
   * DATE & STORAGE HELPERS
   ******************************/
  function getTodayDate() {
    return new Date().toLocaleDateString('en-GB');
  }

  function loadSavedData() {
    const day = getTodayDate();
    const all = JSON.parse(localStorage.getItem('dailyTrackerData') || '{}');
    const modeData = all[day]?.morning;

    if (modeData) {
      currentIndex = modeData.currentIndex || 0;
      answers = modeData.answers || {};
    } else {
      currentIndex = 0;
      answers = {};
    }
  }

  function saveData() {
    const day = getTodayDate();
    let all = JSON.parse(localStorage.getItem('dailyTrackerData')) || {};
    if (!all[day]) all[day] = {};
    all[day].morning = { currentIndex, answers };
    localStorage.setItem('dailyTrackerData', JSON.stringify(all));
  }

  window.addEventListener('beforeunload', saveData);

  /******************************
   * UI RENDERING
   ******************************/
  function updateDayOfWeek() {
    const dayOfWeekElement = document.getElementById('dayOfWeek');
    const today = new Date();
    const options = { weekday: 'long', month: 'short', day: 'numeric' };
    dayOfWeekElement.textContent = today.toLocaleDateString('en-US', options);
  }

function loadUI() {
  updateDayOfWeek();

  const allQuestionsDone = MORNING.every(q => answers[q.key]);
  const allChecklistDone = MORNING_CHECKLIST_ITEMS.every(i => answers[i.key] === 'Yes');

  // Show morning done page if everything completed
  if (allQuestionsDone && allChecklistDone) {
    showMorningDonePage();
    return;
  }

  // Load checklist if questions are done
  if (currentIndex >= MORNING.length) {
    loadMorningChecklist();
    return;
  }

  const q = MORNING[currentIndex];
  let html = '';

  if (q.icon) {
    html += `<div class="question-with-icon">
      <div class="question-icon"><img src="icons/${q.icon}" alt="${q.label}"></div>
      <span class="question-text">${q.label}</span>
    </div>`;
  } else {
    html += `<div class="question">${q.label}</div>`;
  }

  html += `<div class="options${q.key === 'how_slept' ? ' column-options' : ''}">`;

  if (q.type === 'single') {
    q.options.forEach(opt => {
      const selected = answers[q.key] === opt ? 'selected' : '';
      html += `<button class="opt-btn ${selected}" onclick="selectOption('${opt}')">${opt}</button>`;
    });
  } else if (q.type === 'time') {
    html += `<input type="time" value="${answers[q.key] || ''}" onchange="selectOption(this.value)" />`;
  }

  html += '</div>';
  contentArea.innerHTML = html;

  // Back button visible but disabled on first question
  if (currentIndex === 0) {
    backBtn.style.display = 'inline-block';
    backBtn.classList.add('disabled');  // Use CSS: .disabled { opacity:0.5; pointer-events:none; }
  } else {
    backBtn.style.display = 'inline-block';
    backBtn.classList.remove('disabled');
  }

  // Next button visible
  nextBtn.style.display = 'inline-block';
  nextBtn.textContent = 'Next';

  // Disable Next if unanswered
  if (q.type === 'time') {
    nextBtn.disabled = !answers[q.key] || answers[q.key] === '';
  } else {
    nextBtn.disabled = !answers[q.key] || (Array.isArray(answers[q.key]) && answers[q.key].length === 0);
  }
  updateProgressBar();
}

  /******************************
   * ANSWER HANDLERS
   ******************************/
  window.selectOption = (opt) => {
    const q = MORNING[currentIndex];
    answers[q.key] = opt;
    saveData();
    nextBtn.disabled = false;

    if (q.autoNext || opt === 'None') {
      currentIndex++;
      loadUI();
    }
    updateProgressBar();
  };

  /******************************
   * BACK/NEXT BUTTONS
   ******************************/
  backBtn.onclick = () => {
    if (currentIndex > 0) currentIndex--;
    loadUI();
  };
  nextBtn.onclick = () => {
    saveData();
    if (currentIndex < MORNING.length) {
      currentIndex++;
      loadUI();
    } else {
      loadMorningChecklist();
    }
  };

  /******************************
   * MORNING CHECKLIST
   ******************************/
function loadMorningChecklist() {
  const wrapper = document.querySelector('.checklist-wrapper');
  const scrollPos = wrapper ? wrapper.scrollTop : 0;

  let html = `
  <div class="checklist-title">Morning Routine</div>
    <div class="checklist-wrapper">
      <div class="checklist">
        ${MORNING_CHECKLIST_ITEMS.map(item => {
          const selected = answers[item.key] === 'Yes' ? 'selected' : '';
          return `<div class="check-item ${selected}" onclick="toggleChecklist('${item.key}')">
                    <div class="icon-circle"><img src="icons/${item.icon}" alt="${item.label}" class="counter-icon"></div>
                    <span class="check-text">${item.label}</span>
                  </div>`;
        }).join('')}
        <div style="height:80px;"></div>
      </div>
    </div>`;

  contentArea.innerHTML = html;

  // ✅ Back/Next always visible
  backBtn.style.display = 'inline-block';
  nextBtn.style.display = 'inline-block';
  nextBtn.textContent = 'Next';
  nextBtn.disabled = false; // Always enabled for checklist

  nextBtn.onclick = () => {
    saveData();
    showMorningDonePage();
  };

  if (wrapper) wrapper.scrollTop = scrollPos;
  updateProgressBar();
}

  window.toggleChecklist = (key) => {
    answers[key] = answers[key] === 'Yes' ? 'No' : 'Yes';
    saveData();
    loadMorningChecklist();

    const allDone = MORNING_CHECKLIST_ITEMS.every(i => answers[i.key] === 'Yes');
    if (allDone) setTimeout(showMorningDonePage, 300);
  };

  function showMorningDonePage() {
    contentArea.innerHTML = `<div class="done-note">Morning done</div>
      <div style="display:flex; gap:12px; justify-content:center; margin-top:40px;">
        <button id="goBackBtn">Edit morning</button>
         <button id="homeDoneBtn">Home</button>
      </div>`;
    document.getElementById('goBackBtn').onclick = loadMorningChecklist;
      document.getElementById('homeDoneBtn').onclick = () => {
    window.location.href = 'index.html';
  };
    backBtn.style.display = 'none';
    nextBtn.style.display = 'none';
    updateProgressBar();
  }

  /******************************
   * PROGRESS BAR
   ******************************/
  function updateProgressBar() {
    const keys = ['wake_time','how_slept', ...MORNING_CHECKLIST_ITEMS.map(i => i.key)];
    const done = keys.filter(key => {
      if (MORNING_CHECKLIST_ITEMS.find(i => i.key === key)) return answers[key] === 'Yes';
      return answers[key];
    }).length;
    progressBar.style.width = Math.round((done / keys.length) * 100) + '%';
  }

  /******************************
   * EXPORT & CLEAR DATA
   ******************************/
  document.getElementById("btnExport").addEventListener("click", () => {
    const data = localStorage.getItem("dailyTrackerData");
    if (!data) { alert("No data to export yet."); return; }
    const blob = new Blob([data], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "daily-tracker-data.json";
    a.click();
    URL.revokeObjectURL(url);
  });

  document.getElementById('btnClearToday').onclick = () => {
    const all = JSON.parse(localStorage.getItem('dailyTrackerData')||'{}');
    delete all[getTodayDate()];
    localStorage.setItem('dailyTrackerData', JSON.stringify(all));
    answers = {};
    currentIndex = 0;
    loadUI();
    alert("Today's data cleared.");
  };

  /******************************
   * INITIALIZE
   ******************************/
  loadSavedData();
  loadUI();

});
</script>
</body>
</html>
